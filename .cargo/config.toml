[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-static"]

# Preserve default macOS unwind metadata so Rust panics can be caught.
[target.aarch64-apple-darwin]
rustflags = ["-Ctarget-cpu=apple-m1"]

# Android targets (NDK toolchain)
[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"

# Windows targets — increase stack size for large JsonSchema derives
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-args=/STACK:8388608"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-args=/STACK:8388608"]

[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

[build]
target-dir = "target-dir"
# Let intermediate artifacts follow target-dir, including CARGO_TARGET_DIR slots.

# Run from the repository root; first use installs the pinned patched Relax.
[alias]
dev-setup = "run --quiet --manifest-path tools/relax-dev/Cargo.toml -- setup"
dev-desktop = "run --quiet --manifest-path tools/relax-dev/Cargo.toml -- desktop"
dev-gateway = "run --quiet --manifest-path tools/relax-dev/Cargo.toml -- gateway"
dev-test = "run --quiet --manifest-path tools/relax-dev/Cargo.toml -- test"
