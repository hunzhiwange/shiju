name: Build Web archive

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Test standalone Web packaging
        run: python3 -m unittest discover -s scripts/tests -p test_package_shiju_web.py
      - name: Acquire Cargo slot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/rust-slot-locks
          while :; do
            for slot in {1..20}; do
              lock="target/rust-slot-locks/slot-$slot.lock"
              if mkdir "$lock" 2>/dev/null; then break 2; fi
            done
            sleep 5
          done
          trap 'rm -f "$lock/owner"; rmdir "$lock"' EXIT
          printf 'task=web-release session=%s attempt=%s pid=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PPID" > "$lock/owner"
          {
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target/rust-slot-$slot"
            echo "CARGO_BUILD_BUILD_DIR=$GITHUB_WORKSPACE/target/rust-slot-$slot/build"
            echo "WEB_CARGO_SLOT=$slot"
          } >> "$GITHUB_ENV"
          trap - EXIT
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ${{ env.CARGO_TARGET_DIR }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Read pinned binding tool and application version
        id: versions
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          versions = {p['version'] for p in lock['package'] if p['name'] == 'wasm-bindgen'}
          assert len(versions) == 1, 'Expected one wasm-bindgen version in Cargo.lock'
          app = tomllib.loads(pathlib.Path('crates/vw-desktop/Cargo.toml').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('bindgen=' + versions.pop(), file=out)
              print('app=' + app['package']['version'], file=out)
          PY
      - name: Cache wasm-bindgen CLI
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wasm-bindgen-cli
          key: web-bindgen-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.bindgen }}
      - name: Install matching wasm-bindgen CLI
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        env:
          BINDGEN_VERSION: ${{ steps.versions.outputs.bindgen }}
        run: cargo install wasm-bindgen-cli --locked --version "$BINDGEN_VERSION" --root "$RUNNER_TEMP/wasm-bindgen-cli"
      - name: Build complete Web application
        env:
          VIBEWINDOW_RELEASE_BUILD: '1'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --profile dist -p vw-desktop --target wasm32-unknown-unknown --bin shi-ju
      - name: Generate bindings and static ZIP
        env:
          BINDGEN_VERSION: ${{ steps.versions.outputs.bindgen }}
          APP_VERSION: ${{ steps.versions.outputs.app }}
        run: |
          test "$("$RUNNER_TEMP/wasm-bindgen-cli/bin/wasm-bindgen" --version)" = "wasm-bindgen $BINDGEN_VERSION"
          "$RUNNER_TEMP/wasm-bindgen-cli/bin/wasm-bindgen" --target web --out-name shi_ju \
            --out-dir "$RUNNER_TEMP/shiju-web-bindings" \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/dist/shi-ju.wasm"
          python3 scripts/package_shiju_web.py --bindgen-dir "$RUNNER_TEMP/shiju-web-bindings" \
            --out-dir target/distrib --version "$APP_VERSION"
          (cd target/distrib && sha256sum -c "shiju-web-$APP_VERSION.zip.sha256")
      - name: Upload Web archive
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-web
          if-no-files-found: error
          path: |
            target/distrib/shiju-web-*.zip
            target/distrib/shiju-web-*.zip.sha256
      - name: Release Cargo slot
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          slot = os.environ.get('WEB_CARGO_SLOT')
          if slot:
              assert slot in {str(n) for n in range(1, 21)}, 'Invalid Cargo slot'
              lock = pathlib.Path('target/rust-slot-locks') / f'slot-{slot}.lock'
              owner = (lock / 'owner').read_text().split()
              assert f'session={os.environ["GITHUB_RUN_ID"]}' in owner, 'Slot owner mismatch'
              assert f'attempt={os.environ["GITHUB_RUN_ATTEMPT"]}' in owner, 'Slot attempt mismatch'
              (lock / 'owner').unlink()
              lock.rmdir()
          PY
