name: Release benchmark

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Measurement to run (experiments never change production configuration)
        type: choice
        options: [dist, lto, precise]
        default: dist
      cache:
        description: 'Rust cache: off for baseline, restore for measured reuse'
        type: choice
        options: [restore, off]
        default: restore

permissions:
  contents: read

concurrency:
  group: release-benchmark
  cancel-in-progress: false

jobs:
  measure:
    if: inputs.experiment == 'dist'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      VIBEWINDOW_RELEASE_BUILD: '1'
      CARGO_TERM_COLOR: never
      CACHE_TARGETS: ${{ matrix.target }}
      RELEASE_CACHE_MODE: ${{ inputs.cache }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire Cargo cache slot
        shell: bash
        run: |
          mkdir -p target/rust-slot-locks
          while :; do
            for slot in {1..10}; do
              lock="target/rust-slot-locks/slot-$slot.lock"
              if mkdir "$lock" 2>/dev/null; then break 2; fi
            done
            sleep 5
          done
          trap 'rm -f "$lock/owner"; rmdir "$lock"' EXIT
          printf 'plan=release-performance task=3 session=%s pid=%s\n' "$GITHUB_RUN_ID" "$PPID" > "$lock/owner"
          # Hold until the final cleanup step; every Cargo and packaging child inherits it.
          python - "$slot" <<'PYTHON'
          import os, pathlib, sys
          root = pathlib.Path.cwd()
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              print(f'CARGO_TARGET_DIR={root / "target" / ("rust-slot-" + sys.argv[1])}', file=out)
              print(f'RELEASE_CARGO_SLOT={sys.argv[1]}', file=out)
              print(f'RELEASE_CARGO_CACHE={pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-cargo-cache"}', file=out)
          PYTHON
          trap - EXIT
      - name: Identify Cargo cache layout and toolchain
        id: cargo-cache-layout
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess, tomllib
          root = pathlib.Path.cwd()
          meta = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version=1']))
          assert pathlib.Path(meta['target_directory']).resolve() == pathlib.Path(os.environ['CARGO_TARGET_DIR']).resolve()
          assert pathlib.Path(meta['build_directory']).resolve() == (root / 'target').resolve(), 'Unexpected Cargo build-dir: review cache paths'
          rust = subprocess.check_output(['rustc', '-Vv'])
          config = b''.join(pathlib.Path(p).read_bytes() for p in ['.cargo/config.toml', 'rust-toolchain.toml', 'dist-workspace.toml'])
          config += json.dumps(tomllib.loads(pathlib.Path('Cargo.toml').read_text()).get('profile', {}), sort_keys=True).encode()
          config += os.environ.get('RUSTFLAGS', '').encode() + os.environ.get('CARGO_ENCODED_RUSTFLAGS', '').encode()
          base = 'release-rust-v1-' + os.environ['RUNNER_OS'] + '-' + os.environ['RUNNER_ARCH'] + '-' + os.environ['CACHE_TARGETS'] + '-dist-all-features-' + hashlib.sha256(rust + config).hexdigest()[:24]
          lock = hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest()[:16]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f'cargo_home={pathlib.Path(os.environ.get("CARGO_HOME", pathlib.Path.home() / ".cargo")).resolve()}', file=out)
              print(f'prefix={base}-', file=out)
              print(f'key={base}-{lock}-' + os.environ['GITHUB_SHA'], file=out)
          print(rust.decode(), json.dumps({k: v for k, v in meta.items() if k.endswith('directory')}, indent=2))
          PYTHON
      - name: Restore trusted Cargo cache
        id: cargo-cache
        if: ${{ env.RELEASE_CACHE_MODE != 'off' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.cargo-cache-layout.outputs.cargo_home }}/registry/index
            ${{ steps.cargo-cache-layout.outputs.cargo_home }}/registry/cache
            ${{ steps.cargo-cache-layout.outputs.cargo_home }}/registry/src
            ${{ steps.cargo-cache-layout.outputs.cargo_home }}/git/db
            ${{ steps.cargo-cache-layout.outputs.cargo_home }}/git/checkouts
            ${{ env.RELEASE_CARGO_CACHE }}
          key: ${{ steps.cargo-cache-layout.outputs.key }}
          restore-keys: ${{ steps.cargo-cache-layout.outputs.prefix }}
      - name: Restore compiler directories into the held slot
        if: ${{ env.RELEASE_CACHE_MODE != 'off' }}
        shell: bash
        run: |
          python - <<'PYTHON'
          MODE = 'restore'
          import os, pathlib, shutil, time
          start = time.monotonic()
          cache = pathlib.Path(os.environ['RELEASE_CARGO_CACHE'])
          if MODE == 'save' and cache.exists():
              shutil.rmtree(cache)
          roots = {'slot': pathlib.Path(os.environ['CARGO_TARGET_DIR']), 'build': pathlib.Path.cwd() / 'target'}
          profiles = [pathlib.Path('dist')] + [pathlib.Path(t) / 'dist' for t in os.environ['CACHE_TARGETS'].split()]
          count = size = 0
          for kind, root in roots.items():
              for profile in profiles:
                  for internal in ['deps', 'build', '.fingerprint', 'incremental']:
                      relative = profile / internal
                      src, dst = (cache / kind / relative, root / relative) if MODE == 'restore' else (root / relative, cache / kind / relative)
                      if src.is_dir():
                          shutil.copytree(src, dst, dirs_exist_ok=True, symlinks=True)
                          for p in src.rglob('*'):
                              if p.is_file():
                                  count += 1
                                  size += p.stat().st_size
          print(f'{MODE}: {count} files, {size} bytes, {time.monotonic()-start:.3f}s; slot={roots["slot"]}; staging={cache}')
          PYTHON
      - name: Install dist on macOS (same installer as Release)
        if: runner.os == 'macOS'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.1/cargo-dist-installer.sh | sh
      - name: Install dist on Windows (same installer as Release)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.30.1/cargo-dist-installer.ps1 | iex
      - name: Install dist on Linux (same installer as Release)
        if: runner.os == 'Linux'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.1/cargo-dist-installer.sh | sh
      - name: Install Linux build and package dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxkbcommon-dev rpm
      - name: Install Windows package tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Cache pinned macOS packaging tools
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/macos-packaging-tools
          key: packaging-tools-${{ runner.os }}-${{ runner.arch }}-cargo-bundle-0.12.0
      - name: Install macOS packaging tools in a shared Cargo slot
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/install_macos_packaging_tools.sh "$RUNNER_TEMP/macos-packaging-tools"
      - name: Install target standard library
        shell: bash
        run: rustup target add '${{ matrix.target }}'
      - name: Measure serial dist build in a shared Cargo slot
        env:
          RELEASE_CACHE_KEY: ${{ steps.cargo-cache-layout.outputs.key }}
          RELEASE_CACHE_MATCHED_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
          RELEASE_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          from summarize_release_build import benchmark
          sys.exit(benchmark('${{ matrix.target }}', pathlib.Path('benchmark')))
          PYTHON
      - name: Package prebuilt binaries without signing credentials
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: dist
          SKIP_BUILD: '1'
          OUT_DIR: target/distrib
          CREATE_MSI: '1'
          CREATE_ZIP: '1'
          CREATE_DMG: '1'
          PACKAGE_APP: '1'
          MACOS_SIGN_MODE: adhoc
          MACOS_NOTARIZE: '0'
          INCLUDE_CLI_IN_APP: '1'
          INCLUDE_ACP_IN_APP: '1'
        run: |
          case "$TARGET" in
            *apple-darwin) bash scripts/bundle_macos.sh ;;
            *windows-msvc) bash scripts/bundle_windows.sh ;;
            *unknown-linux-gnu) bash scripts/bundle_linux.sh ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 1 ;;
          esac
      - name: Record package checksums and native package metadata
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('target/distrib')
          target = os.environ['TARGET']
          files = [p for p in root.iterdir() if p.is_file()]
          required = ['.dmg', '.zip'] if 'apple' in target else ['.msi', '.zip'] if 'windows' in target else ['.deb', '.rpm', '.tar.gz']
          for suffix in required:
              assert any(p.name.endswith(suffix) and p.stat().st_size for p in files), f'Missing {suffix}'
          records = {}
          for p in files:
              digest = hashlib.sha256()
              with p.open('rb') as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      digest.update(chunk)
              records[p.name] = dict(bytes=p.stat().st_size, sha256=digest.hexdigest())
              if p.suffix in ['.deb', '.rpm']:
                  command = ['dpkg-deb', '--info', str(p)] if p.suffix == '.deb' else ['rpm', '-qip', str(p)]
                  records[p.name]['metadata'] = subprocess.check_output(command, text=True)
                  command = ['dpkg-deb', '--contents', str(p)] if p.suffix == '.deb' else ['rpm', '-qlp', str(p)]
                  records[p.name]['contents'] = subprocess.check_output(command, text=True)
          pathlib.Path('benchmark/packages.json').write_text(json.dumps(records, indent=2))
          PYTHON
      - name: Stage compiler cache from the held slot
        if: ${{ success() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected && env.RELEASE_CACHE_MODE != 'off' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          python - <<'PYTHON'
          MODE = 'save'
          import os, pathlib, shutil, time
          start = time.monotonic()
          cache = pathlib.Path(os.environ['RELEASE_CARGO_CACHE'])
          if MODE == 'save' and cache.exists():
              shutil.rmtree(cache)
          roots = {'slot': pathlib.Path(os.environ['CARGO_TARGET_DIR']), 'build': pathlib.Path.cwd() / 'target'}
          profiles = [pathlib.Path('dist')] + [pathlib.Path(t) / 'dist' for t in os.environ['CACHE_TARGETS'].split()]
          count = size = 0
          for kind, root in roots.items():
              for profile in profiles:
                  for internal in ['deps', 'build', '.fingerprint', 'incremental']:
                      relative = profile / internal
                      src, dst = (cache / kind / relative, root / relative) if MODE == 'restore' else (root / relative, cache / kind / relative)
                      if src.is_dir():
                          shutil.copytree(src, dst, dirs_exist_ok=True, symlinks=True)
                          for p in src.rglob('*'):
                              if p.is_file():
                                  count += 1
                                  size += p.stat().st_size
          print(f'{MODE}: {count} files, {size} bytes, {time.monotonic()-start:.3f}s; slot={roots["slot"]}; staging={cache}')
          PYTHON
      - name: Save Cargo cache from protected default branch only
        if: ${{ success() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected && env.RELEASE_CACHE_MODE != 'off' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.cargo-cache-layout.outputs.cargo_home }}/registry/index
            ${{ steps.cargo-cache-layout.outputs.cargo_home }}/registry/cache
            ${{ steps.cargo-cache-layout.outputs.cargo_home }}/registry/src
            ${{ steps.cargo-cache-layout.outputs.cargo_home }}/git/db
            ${{ steps.cargo-cache-layout.outputs.cargo_home }}/git/checkouts
            ${{ env.RELEASE_CARGO_CACHE }}
          key: ${{ steps.cargo-cache-layout.outputs.key }}
      - name: Release Cargo cache slot
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, pathlib
          slot = os.environ.get('RELEASE_CARGO_SLOT')
          if slot:
              if slot not in {str(n) for n in range(1, 11)}:
                  raise RuntimeError('Invalid slot during cleanup')
              lock = pathlib.Path(f'target/rust-slot-locks/slot-{slot}.lock')
              owner = lock / 'owner'
              if f'session={os.environ["GITHUB_RUN_ID"]}' not in owner.read_text().split():
                  raise RuntimeError('Refusing to release another run slot')
              owner.unlink()
              lock.rmdir()
          PYTHON
      - name: Upload evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark-${{ matrix.target }}-${{ github.sha }}
          path: benchmark/
          if-no-files-found: error

  lto:
    if: inputs.experiment == 'lto'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      VIBEWINDOW_RELEASE_BUILD: '1'
      CARGO_TERM_COLOR: never
      BENCH_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install target standard library
        shell: bash
        run: rustup target add "$BENCH_TARGET"
      - name: Alternate thin and off with independent held slots
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, platform, shutil, signal, subprocess, time
          root = pathlib.Path.cwd()
          output = root / 'benchmark'
          output.mkdir()
          locks = root / 'target/rust-slot-locks'
          locks.mkdir(parents=True, exist_ok=True)
          held, slots, records = [], {}, []
          def interrupted(signum, frame):
              raise KeyboardInterrupt(f'signal {signum}')
          signal.signal(signal.SIGTERM, interrupted)
          def run(command, env, folder, name):
              start = time.perf_counter()
              with (folder / (name + '.stdout')).open('wb') as stdout, (folder / (name + '.stderr')).open('wb') as stderr:
                  child = subprocess.Popen(command, env=env, stdout=stdout, stderr=stderr, start_new_session=os.name != 'nt')
                  try:
                      code = child.wait()
                  except BaseException:
                      # Stop the complete process tree before releasing either slot.
                      if os.name == 'nt':
                          subprocess.run(['taskkill', '/PID', str(child.pid), '/T', '/F'], check=False)
                      else:
                          os.killpg(child.pid, signal.SIGKILL)
                      child.wait()
                      raise
              result = dict(command=command, exit_code=code, seconds=time.perf_counter()-start)
              (folder / (name + '.json')).write_text(json.dumps(result, indent=2))
              if code:
                  raise RuntimeError(f'{command} exited {code}')
              return result
          try:
              for mode in ['thin', 'off']:
                  while mode not in slots:
                      for number in range(1, 11):
                          lock = locks / f'slot-{number}.lock'
                          try:
                              lock.mkdir()
                          except FileExistsError:
                              continue
                          held.append(lock)
                          (lock / 'owner').write_text(f'plan=release-performance task=4 session={os.environ["GITHUB_RUN_ID"]} pid={os.getpid()}')
                          slots[mode] = root / 'target' / f'rust-slot-{number}'
                          break
                      else:
                          time.sleep(5)
              for index, mode in enumerate(['thin', 'off', 'off', 'thin', 'thin', 'off'], 1):
                  folder = output / f'{index}-{mode}'
                  folder.mkdir()
                  env = dict(os.environ, CARGO_TARGET_DIR=str(slots[mode]), CARGO_PROFILE_DIST_LTO=mode)
                  metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version=1'], env=env))
                  assert pathlib.Path(metadata['target_directory']).resolve() == slots[mode].resolve()
                  assert pathlib.Path(metadata['build_directory']).resolve() == (root / 'target').resolve()
                  (folder / 'environment.json').write_text(json.dumps(dict(sha=os.environ['GITHUB_SHA'], mode=mode, slot=str(slots[mode]), metadata=metadata, host=platform.platform(), runner_image=os.environ.get('ImageVersion'), rust=subprocess.check_output(['rustc', '-Vv'], env=env).decode(), cargo=subprocess.check_output(['cargo', '-V'], env=env).decode(), cache='no Actions restore; shared build-dir may be warm'), indent=2))
                  command = ['cargo', 'build', '--locked', '--profile', 'dist', '--all-features', '--target', os.environ['BENCH_TARGET'], '-p', 'vw-cli', '--bin', 'shiju', '--bin', 'vibe-agent', '-p', 'vw-acp', '--bin', 'acp', '--timings']
                  started = time.time()
                  result = run(command, env, folder, 'build')
                  # Cargo's versioned HTML includes unit timings; copy before the next build overwrites it.
                  reports = []
                  for timings in [slots[mode] / 'cargo-timings', root / 'target/cargo-timings']:
                      if timings.is_dir():
                          for report in timings.glob('*.html'):
                              if report.stat().st_mtime >= started - 1:
                                  reports.append(report)
                  if not reports:
                      raise RuntimeError('Missing fresh raw Cargo timings')
                  destination = folder / 'cargo-timings'
                  destination.mkdir()
                  for index_report, report in enumerate(reports):
                      shutil.copy2(report, destination / f'{index_report}-{report.name}')
                  binaries = slots[mode] / os.environ['BENCH_TARGET'] / 'dist'
                  native = os.environ['BENCH_TARGET'] == 'x86_64-apple-darwin' and platform.machine() == 'x86_64'
                  result.update(mode=mode, slot=str(slots[mode]), native_validation='executed' if native else 'pending: native ARM64 Windows system required', binaries={})
                  for name in ['shiju', 'vibe-agent', 'acp']:
                      binary = binaries / (name + ('.exe' if os.name == 'nt' else ''))
                      result['binaries'][name] = dict(bytes=binary.stat().st_size, sha256=hashlib.sha256(binary.read_bytes()).hexdigest())
                      if native:
                          run([str(binary), '--help'], env, folder, name + '-help')
                  if native:
                      workload = []
                      for repeat in range(20):
                          item = run([str(binaries / 'shiju'), 'completions', 'bash'], env, folder, f'completion-{repeat}')
                          item['output_sha256'] = hashlib.sha256((folder / f'completion-{repeat}.stdout').read_bytes()).hexdigest()
                          workload.append(item)
                      result['completion_workload'] = workload
                  records.append(result)
                  (output / 'summary.json').write_text(json.dumps(records, indent=2))
          finally:
              for lock in reversed(held):
                  (lock / 'owner').unlink(missing_ok=True)
                  lock.rmdir()
          PYTHON
      - name: Upload LTO evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-lto-${{ matrix.target }}-${{ github.sha }}
          path: benchmark/
          if-no-files-found: error

  precise:
    if: inputs.experiment == 'precise'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      VIBEWINDOW_RELEASE_BUILD: '1'
      CARGO_TERM_COLOR: never
      BENCH_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dist on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.1/cargo-dist-installer.sh | sh
      - name: Install dist on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.30.1/cargo-dist-installer.ps1 | iex
      - name: Install target standard library
        shell: bash
        run: rustup target add "$BENCH_TARGET"
      - name: Compare precise and workspace builds serially
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, platform, signal, sys, time
          sys.path.insert(0, str(pathlib.Path.cwd() / 'scripts'))
          from summarize_release_build import slot, capture, run_dist, write_json, BINS, PACKAGES
          def interrupted(*args):
              raise KeyboardInterrupt('benchmark interrupted')
          signal.signal(signal.SIGTERM, interrupted)
          root = pathlib.Path.cwd()
          output = root / 'benchmark'
          output.mkdir()
          config = root / 'dist-workspace.toml'
          original = config.read_text()
          assert original.count('precise-builds = true') == 1
          def checked(command, folder, name):
              result = capture(command)
              write_json(folder / (name + '.json'), result)
              if result['exit_code']:
                  raise RuntimeError(f'{name} exited {result["exit_code"]}')
              return result['output']
          try:
              with slot() as (number, target_dir):
                  write_json(root / f'target/rust-slot-locks/slot-{number}.lock/owner.json', dict(plan='release-performance', task=5, session=os.environ['GITHUB_RUN_ID'], pid=os.getpid()))
                  assert checked(['dist', '--version'], output, 'dist-version').strip() == 'cargo-dist 0.30.1'
                  checked(['dist', 'build', '--help'], output, 'build-help')
                  checked(['dist', 'plan', '--help'], output, 'plan-help')
                  checked(['rustc', '-Vv'], output, 'rustc')
                  checked(['cargo', '-V'], output, 'cargo')
                  metadata = json.loads(checked(['cargo', 'metadata', '--no-deps', '--format-version=1'], output, 'metadata'))
                  assert pathlib.Path(metadata['target_directory']).resolve() == target_dir.resolve()
                  assert pathlib.Path(metadata['build_directory']).resolve() == root / 'target'
                  write_json(output / 'environment.json', dict(sha=os.environ['GITHUB_SHA'], slot=number, CARGO_TARGET_DIR=str(target_dir), host=platform.platform(), image=os.environ.get('ImageVersion'), cache='no restore; shared build-dir and system caches may be warm', lto='unchanged production thin'))
                  for package in [*PACKAGES, 'workspace']:
                      selection = ['--workspace'] if package == 'workspace' else ['-p', package]
                      checked(['cargo', 'tree', '--locked', '--all-features', '--target', os.environ['BENCH_TARGET'], '--edges', 'normal,build', '--prefix', 'none', '--format', '{p} features=[{f}]', *selection], output, 'features-' + package)
                  inventories = []
                  for index, precise in enumerate([True, False, False, True], 1):
                      folder = output / f'{index}-{precise}'
                      folder.mkdir()
                      config.write_text(original.replace('precise-builds = true', 'precise-builds = ' + str(precise).lower()))
                      plan = json.loads(checked(['dist', 'plan', '--output-format=json'], folder, 'plan'))
                      inventory = {key: sorted(asset['name'] for asset in value.get('assets', []) if asset.get('kind') == 'executable') for key, value in plan['artifacts'].items() if os.environ['BENCH_TARGET'] in value.get('target_triples', [])}
                      assert set(name for names in inventory.values() for name in names) == set(BINS)
                      inventories.append(inventory)
                      assert inventory == inventories[0], 'Archive/bin plan changed'
                      started = time.monotonic()
                      code = run_dist(os.environ['BENCH_TARGET'], folder)
                      record = dict(precise=precise, exit_code=code, elapsed_seconds=time.monotonic()-started, inventory=inventory, native_smoke='pending: requires native platform and installer verification', binaries={})
                      write_json(folder / 'result.json', record)
                      if code:
                          raise RuntimeError(f'dist build exited {code}')
                      for name in BINS:
                          binary = target_dir / os.environ['BENCH_TARGET'] / 'dist' / (name + ('.exe' if os.name == 'nt' else ''))
                          record['binaries'][name] = dict(bytes=binary.stat().st_size, sha256=hashlib.sha256(binary.read_bytes()).hexdigest())
                          if os.environ['BENCH_TARGET'] == 'x86_64-apple-darwin' and platform.machine() == 'x86_64' and name in ['shiju', 'vibe-agent', 'acp']:
                              checked([str(binary), '--help'], folder, name + '-help')
                      write_json(folder / 'result.json', record)
          finally:
              config.write_text(original)
          PYTHON
      - name: Upload precise comparison evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-precise-${{ matrix.target }}-${{ github.sha }}
          path: benchmark/
          if-no-files-found: error
