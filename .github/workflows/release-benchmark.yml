name: Release benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-benchmark
  cancel-in-progress: false

jobs:
  measure:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      VIBEWINDOW_RELEASE_BUILD: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dist on macOS (same installer as Release)
        if: runner.os == 'macOS'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.1/cargo-dist-installer.sh | sh
      - name: Install dist on Windows (same installer as Release)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.30.1/cargo-dist-installer.ps1 | iex
      - name: Cache pinned macOS packaging tools
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/macos-packaging-tools
          key: packaging-tools-${{ runner.os }}-${{ runner.arch }}-cargo-bundle-0.12.0
      - name: Install macOS packaging tools in a shared Cargo slot
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p target/rust-slot-locks
          while :; do
            for slot in {1..10}; do
              lock="target/rust-slot-locks/slot-$slot.lock"
              if mkdir "$lock" 2>/dev/null; then
                export CARGO_TARGET_DIR="$PWD/target/rust-slot-$slot"
                break 2
              fi
            done
            sleep 5
          done
          trap 'rm -f "$lock/owner"; rmdir "$lock"' EXIT
          trap 'wait; exit 130' INT
          trap 'wait; exit 143' TERM
          printf 'plan=release-performance task=2 session=%s pid=%s\n' "$GITHUB_RUN_ID" "$$" > "$lock/owner"
          bash scripts/install_macos_packaging_tools.sh "$RUNNER_TEMP/macos-packaging-tools"
      - name: Install target standard library
        shell: bash
        run: rustup target add '${{ matrix.target }}'
      - name: Measure serial dist build in a shared Cargo slot
        shell: bash
        run: python scripts/summarize_release_build.py --run '${{ matrix.target }}' --output benchmark
      - name: Upload evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark-${{ matrix.target }}-${{ github.sha }}
          path: benchmark/
          if-no-files-found: error
