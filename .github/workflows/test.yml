name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".config/nextest.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/test.yml"
      - ".github/workflows/build-web.yml"
      - "scripts/package_shiju_web.py"
      - "scripts/web/**"
      - "scripts/tests/test_package_shiju_web.py"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".config/nextest.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/test.yml"
      - ".github/workflows/build-web.yml"
      - "scripts/package_shiju_web.py"
      - "scripts/web/**"
      - "scripts/tests/test_package_shiju_web.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: 0

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev
      - run: cargo fetch --locked
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test-native:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev
      - run: cargo fetch --locked
      - run: cargo nextest run --profile ci --workspace --exclude vw-agent --exclude vw-desktop --lib
      - run: cargo test -p vw-desktop --lib
      - run: cargo nextest run --profile ci --workspace --exclude vw-desktop --bins --tests
      - run: cargo test -p vw-desktop --bins --tests

  build-wasm:
    name: Build wasm desktop
    permissions:
      contents: read
    uses: ./.github/workflows/build-web.yml
