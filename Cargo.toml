[workspace]
members = [
  ".",
  "crates/vw-api-types",
  "crates/vw-acp",
  "crates/vw-config-types",
  "crates/vw-gateway-client",
  "crates/vw-shared",
  "crates/vw-agent",
  "crates/vw-cli",
  "crates/vw-tui",
  "crates/vw-desktop",
  "crates/vw-webview",
  "crates/vw-provider-resolver",
]
exclude = ["vendor/block", "vendor/block/test_utils"]
resolver = "3"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[patch.crates-io]
# block 0.1.6 declares an uninhabited extern static (rust-lang/rust#74840).
block = { path = "vendor/block" }
