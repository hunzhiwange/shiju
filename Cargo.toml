  "crates/libs/audio-playback",
  "crates/libs/audio-capture",
  "crates/libs/voice-permissions",
  "crates/libs/file-index",
  "crates/libs/tui-contracts",
  "crates/libs/tui-clipboard",
  "crates/libs/tui-text",
  "crates/libs/tui-render",
  "crates/libs/tui-cells",
  "crates/libs/tui-theme",
  "crates/libs/tui-highlight",
  "crates/libs/tui-markdown",
  "crates/libs/tui-stream",
