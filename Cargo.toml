  "crates/libs/patch",
  "crates/libs/project-storage-paths",
  "crates/libs/process-sandbox",
  "crates/libs/secret-store",
  "crates/libs/webview-core",
  "crates/libs/webview-ipc",
  "crates/libs/webview-init-script",
  "crates/libs/webview-launch",
  "crates/libs/webview-local-content",
  "crates/libs/webview-mcp-policy",
  "crates/libs/webview-mcp-assets",
  "crates/libs/webview-mcp-form",
  "crates/libs/webview-mcp-runtime",
  "crates/libs/webview-browser-views",
  "crates/libs/webview-browser-runtime",
  "crates/libs/webview-toolbar",
  "crates/libs/webview-storage",
  "crates/libs/webview-runtime-cookie",
  "crates/libs/webview-external-protocol",
  "crates/libs/webview-native-menu",
  "crates/libs/webview-downloads",
  "crates/libs/webview-media-permissions",
  "crates/libs/webview-popup",
  "crates/vw-api-types",
  "crates/vw-acp",
  "crates/vw-config-types",
  "crates/vw-gateway-client",
  "crates/vw-shared",
  "crates/vw-agent",
  "crates/vw-agent-apps",
  "crates/vw-cli",
  "crates/vw-tui",
  "crates/vw-desktop",
  "crates/vw-webview",
  "crates/vw-provider-resolver",
]
exclude = [
  "vendor/iced_winit",
  "vendor/block",
  "vendor/block/test_utils",
  "vendor/iced_term",
]
resolver = "3"

[profile.dev]
# Keep macOS development binaries within the compact unwind offset limit.
opt-level = 1
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[patch.crates-io]
# block 0.1.6 declares an uninhabited extern static (rust-lang/rust#74840).
block = { path = "vendor/block" }

# Iced 0.14 Web IME bridge; upstream desktop paths remain unchanged.
iced_winit = { path = "vendor/iced_winit" }
