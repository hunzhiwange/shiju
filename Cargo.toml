[workspace]
members = [
  "crates/libs/secret-store",
  "crates/libs/gateway-pairing",
  "crates/libs/content-guard",
  "crates/libs/domain-matcher",
  "crates/libs/git-discovery",
  "crates/libs/memory-algorithms",
  "crates/libs/memory-types",
  "crates/libs/memory-markdown",
  "crates/libs/memory-sqlite",
  "crates/libs/memory-postgres",
  "crates/libs/memory-lucid",
  "crates/libs/memory-response-cache",
  "crates/libs/memory-mariadb",
  "crates/libs/patch",
  "crates/libs/project-storage-paths",
  "crates/vw-api-types",
  "crates/vw-acp",
  "crates/vw-config-types",
  "crates/vw-gateway-client",
  "crates/vw-shared",
  "crates/vw-agent",
  "crates/vw-agent-apps",
  "crates/vw-cli",
  "crates/vw-tui",
  "crates/vw-desktop",
  "crates/vw-webview",
  "crates/vw-provider-resolver",
]
exclude = [
  "vendor/iced_winit",
  "vendor/block",
  "vendor/block/test_utils",
  "vendor/iced_term",
  "crates/vw-agent-apps/upstream/src-tauri",
]
resolver = "3"

[profile.dev]
# Keep macOS development binaries within the compact unwind offset limit.
opt-level = 1
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[patch.crates-io]
# block 0.1.6 declares an uninhabited extern static (rust-lang/rust#74840).
block = { path = "vendor/block" }

# Iced 0.14 Web IME bridge; upstream desktop paths remain unchanged.
iced_winit = { path = "vendor/iced_winit" }
