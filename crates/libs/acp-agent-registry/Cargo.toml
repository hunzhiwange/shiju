[package]
name = "acp-agent-registry"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
shell-command = { path = "../shell-command", version = "0.6.0", features = ["shell-tokio"] }
acp-types = { path = "../acp-types", version = "0.6.0" }
acp-access-policy = { path = "../acp-access-policy", version = "0.6.0" }
acp-host-io = { path = "../acp-host-io", version = "0.6.0" }
config-acp-install = { path = "../config-acp-install", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
