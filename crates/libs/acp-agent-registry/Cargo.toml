[package]
name = "acp-agent-registry"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
shell-command = { path = "../shell-command" }
acp-types = { path = "../acp-types" }
acp-access-policy = { path = "../acp-access-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acp-host-io = { path = "../acp-host-io" }
config-acp-install = { path = "../config-acp-install" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
