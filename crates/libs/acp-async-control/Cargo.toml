[package]
name = "acp-async-control"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "signal", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
