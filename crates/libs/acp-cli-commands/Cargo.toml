[package]
name = "acp-cli-commands"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-cli-model = { path = "../acp-cli-model" }
acp-cli-render = { path = "../acp-cli-render" }
acp-config = { path = "../acp-config" }
acp-types = { path = "../acp-types" }
acp-storage = { path = "../acp-storage" }
acp-queue = { path = "../acp-queue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
acp-paths = { path = "../acp-paths" }
tokio = { version = "1", features = ["fs", "macros", "rt", "sync"] }
