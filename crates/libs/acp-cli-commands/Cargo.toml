[package]
name = "acp-cli-commands"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-cli-model = { path = "../acp-cli-model", version = "0.6.0" }
acp-cli-render = { path = "../acp-cli-render", version = "0.6.0" }
acp-config = { path = "../acp-config", version = "0.6.0" }
acp-types = { path = "../acp-types", version = "0.6.0" }
acp-storage = { path = "../acp-storage", version = "0.6.0" }
acp-queue = { path = "../acp-queue", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
acp-paths = { path = "../acp-paths", version = "0.6.0" }
tokio = { version = "1", features = ["fs", "macros", "rt", "sync"] }
