[package]
name = "acp-cli-model"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-types = { path = "../acp-types" }
acp-config = { path = "../acp-config" }
acp-agent-registry = { path = "../acp-agent-registry" }
acp-access-policy = { path = "../acp-access-policy" }
acp-owner-process = { path = "../acp-owner-process" }
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["fs", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
