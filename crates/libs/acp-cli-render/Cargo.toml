[package]
name = "acp-cli-render"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-types = { path = "../acp-types" }
acp-queue = { path = "../acp-queue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
vw-api-tools = { path = "../api-tools" }
tokio = { version = "1", features = ["macros", "rt"] }
