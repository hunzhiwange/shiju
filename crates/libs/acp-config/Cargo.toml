[package]
name = "acp-config"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-agent-registry = { path = "../acp-agent-registry" }
acp-types = { path = "../acp-types" }
config-runtime-paths = { path = "../config-runtime-paths" }
agent-client-protocol = "0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["fs", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync"] }
