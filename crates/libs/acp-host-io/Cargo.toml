[package]
name = "acp-host-io"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
shell-command = { path = "../shell-command", version = "0.6.0", features = ["shell-tokio"] }
acp-types = { path = "../acp-types", version = "0.6.0" }
agent-client-protocol = "0.10.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
