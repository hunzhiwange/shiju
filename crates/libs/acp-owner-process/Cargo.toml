[package]
name = "acp-owner-process"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-types = { path = "../acp-types", version = "0.6.0" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
