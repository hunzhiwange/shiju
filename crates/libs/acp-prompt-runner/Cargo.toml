[package]
name = "acp-prompt-runner"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-client = { path = "../acp-client", version = "0.6.0" }
acp-async-control = { path = "../acp-async-control", version = "0.6.0" }
acp-lifecycle = { path = "../acp-lifecycle", version = "0.6.0" }
acp-types = { path = "../acp-types", version = "0.6.0" }
acp-access-policy = { path = "../acp-access-policy", version = "0.6.0" }
acp-storage = { path = "../acp-storage", version = "0.6.0" }
acp-queue = { path = "../acp-queue", version = "0.6.0" }
acp-session-connect = { path = "../acp-session-connect", version = "0.6.0" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
parking_lot = "0.12"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
