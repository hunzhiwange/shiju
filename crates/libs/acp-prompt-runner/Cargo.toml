[package]
name = "acp-prompt-runner"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-client = { path = "../acp-client" }
acp-async-control = { path = "../acp-async-control" }
acp-lifecycle = { path = "../acp-lifecycle" }
acp-types = { path = "../acp-types" }
acp-access-policy = { path = "../acp-access-policy" }
acp-storage = { path = "../acp-storage" }
acp-queue = { path = "../acp-queue" }
acp-session-connect = { path = "../acp-session-connect" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
parking_lot = "0.12"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
