[package]
name = "acp-queue"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-types = { path = "../acp-types", version = "0.6.0" }
acp-metrics = { path = "../acp-metrics", version = "0.6.0" }
acp-lease = { path = "../acp-lease", version = "0.6.0" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_boolean_config"] }
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "macros", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
parking_lot = "0.12"

[dev-dependencies]
acp-paths = { path = "../acp-paths", version = "0.6.0" }
time = { version = "0.3", features = ["formatting"] }
