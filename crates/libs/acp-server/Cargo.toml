[package]
name = "acp-server"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-types = { path = "../acp-types", version = "0.6.0" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_model", "unstable_boolean_config"] }
async-trait = "0.1.89"
parking_lot = "0.12"
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "process", "time"] }
tokio-util = { version = "0.7.18", features = ["compat"] }

serde = { version = "1", features = ["derive"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
