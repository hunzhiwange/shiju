[package]
name = "acp-session-runtime"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
acp-types = { path = "../acp-types" }
acp-access-policy = { path = "../acp-access-policy" }
acp-config = { path = "../acp-config" }
acp-metrics = { path = "../acp-metrics" }
acp-lease = { path = "../acp-lease" }
acp-queue = { path = "../acp-queue" }
acp-storage = { path = "../acp-storage" }
acp-client = { path = "../acp-client" }
acp-owner-process = { path = "../acp-owner-process" }
acp-session-connect = { path = "../acp-session-connect" }
acp-prompt-runner = { path = "../acp-prompt-runner" }
acp-async-control = { path = "../acp-async-control" }
acp-lifecycle = { path = "../acp-lifecycle" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
async-trait = "0.1.89"
parking_lot = "0.12"
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
