[package]
name = "acp-storage"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-tools = { path = "../api-tools", version = "0.6.0" }
acp-types = { path = "../acp-types", version = "0.6.0" }
acp-paths = { path = "../acp-paths", version = "0.6.0" }
acp-metrics = { path = "../acp-metrics", version = "0.6.0" }
acp-lease = { path = "../acp-lease", version = "0.6.0" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-util"] }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
