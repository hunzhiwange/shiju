[package]
name = "acp-types"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-tools = { path = "../api-tools", version = "0.6.0" }
acp-paths = { path = "../acp-paths", version = "0.6.0" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2.0.18"
vw-api-types = { path = "../../vw-api-types", version = "0.6.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
