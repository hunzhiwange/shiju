[package]
name = "acp-types"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-mcp-management = { path = "../api-mcp-management" }
vw-api-tools = { path = "../api-tools" }
acp-paths = { path = "../acp-paths" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
config-runtime-paths = { path = "../config-runtime-paths" }
