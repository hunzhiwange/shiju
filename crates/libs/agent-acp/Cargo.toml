[package]
name = "agent-acp"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["dep:tempfile", "dep:walkdir", "tokio/time", "dep:vw-agent-apps"]

[dependencies]
vw-agent-apps = { path = "../../vw-agent-apps", optional = true }
tempfile = { version = "3", optional = true }
walkdir = { version = "2", optional = true }
mcp-client = { path = "../mcp-client" }
plugin-mcp = { path = "../plugin-mcp" }
tool-types = { path = "../tool-types" }
tool-assembly = { path = "../tool-assembly" }
acp-config = { path = "../acp-config" }
agent-skills = { path = "../agent-skills" }
config-skills = { path = "../config-skills" }
agent-project = { path = "../agent-project" }
session-engine = { path = "../session-engine" }
ordered-id = { path = "../ordered-id" }
session-store = { path = "../session-store" }
async-trait = "0.1.89"
message-types = { path = "../message-types" }
vw-api-transport = { path = "../api-transport" }
acp-server = { path = "../acp-server" }
agent-approval = { path = "../agent-approval" }
tool-context = { path = "../tool-context" }
tokio = { version = "1", features = ["sync", "macros", "rt"] }
tokio-util = "0.7.18"

serde = { version = "1", features = ["derive"] }
acp-types = { path = "../acp-types" }
session-port = { path = "../session-port" }
agent-provider = { path = "../agent-provider" }
agent-storage = { path = "../agent-storage" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_model", "unstable_boolean_config"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
agent-app-services = { path = "../agent-app-services" }
agent-database = { path = "../agent-database" }
session-info = { path = "../session-info" }
vw-api-mcp-management = { path = "../api-mcp-management" }

[dev-dependencies]
config-security = { path = "../config-security" }
agent-approval = { path = "../agent-approval", features = ["test-support"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "test-util"] }
