[package]
name = "agent-acp"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["dep:tempfile", "dep:walkdir", "tokio/time", "dep:vw-agent-apps"]

[dependencies]
vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0", optional = true }
tempfile = { version = "3", optional = true }
walkdir = { version = "2", optional = true }
mcp-client = { path = "../mcp-client", version = "0.6.0" }
plugin-mcp = { path = "../plugin-mcp", version = "0.6.0" }
tool-types = { path = "../tool-types", version = "0.6.0" }
tool-assembly = { path = "../tool-assembly", version = "0.6.0" }
acp-config = { path = "../acp-config", version = "0.6.0" }
agent-skills = { path = "../agent-skills", version = "0.6.0" }
config-skills = { path = "../config-skills", version = "0.6.0" }
agent-project = { path = "../agent-project", version = "0.6.0" }
session-engine = { path = "../session-engine", version = "0.6.0" }
ordered-id = { path = "../ordered-id", version = "0.6.0" }
session-store = { path = "../session-store", version = "0.6.0" }
async-trait = "0.1.89"
message-types = { path = "../message-types", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
acp-server = { path = "../acp-server", version = "0.6.0" }
agent-approval = { path = "../agent-approval", version = "0.6.0" }
tool-context = { path = "../tool-context", version = "0.6.0" }
tokio = { version = "1", features = ["sync", "macros", "rt"] }
tokio-util = "0.7.18"

serde = { version = "1", features = ["derive"] }
acp-types = { path = "../acp-types", version = "0.6.0" }
session-port = { path = "../session-port", version = "0.6.0" }
agent-provider = { path = "../agent-provider", version = "0.6.0" }
agent-storage = { path = "../agent-storage", version = "0.6.0" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_model", "unstable_boolean_config"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
agent-app-services = { path = "../agent-app-services", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0" }
session-info = { path = "../session-info", version = "0.6.0" }
vw-api-mcp-management = { path = "../api-mcp-management", version = "0.6.0" }

[dev-dependencies]
config-security = { path = "../config-security", version = "0.6.0" }
agent-approval = { path = "../agent-approval", version = "0.6.0", features = ["test-support"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "test-util"] }
