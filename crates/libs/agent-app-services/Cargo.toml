[package]
name = "agent-app-services"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["dep:plugin-mcp", "dep:tool-types", "dep:tool-catalog"]

[dependencies]
vw-api-app-provider-base = { path = "../api-app-provider-base" }
vw-api-app-operations = { path = "../api-app-operations" }
plugin-mcp = { path = "../plugin-mcp", optional = true }
tool-types = { path = "../tool-types", optional = true }
tool-catalog = { path = "../tool-catalog", optional = true }
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }
tracing = "0.1"
thiserror = "2.0.18"
vw-api-apps-usage = { path = "../api-apps-usage" }
anyhow = "1"
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume"] }
acp-types = { path = "../acp-types" }
acp-server = { path = "../acp-server" }
session-port = { path = "../session-port" }
vw-api-mcp-management = { path = "../api-mcp-management" }
vw-api-project-profiles = { path = "../api-project-profiles" }
reqwest_012 = { package = "reqwest", version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
agent-database = { path = "../agent-database" }
app-settings-store = { path = "../app-settings-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
vw-agent-apps = { path = "../../vw-agent-apps" }
vw-api-app-auth = { path = "../api-app-auth" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-transport = { path = "../api-transport" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mcp-client = { path = "../mcp-client" }
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
vw-api-app-diagnostics = { path = "../api-app-diagnostics" }

[target.'cfg(target_os = "macos")'.dependencies]
axum = { version = "0.8.8", default-features = false }
vw-api-tools = { path = "../api-tools" }
hex = "0.4"
libc = "0.2"
uuid = { version = "1.11", features = ["v4", "js"] }

[dev-dependencies]
base64 = "0.22"
vw-api-task = { path = "../api-task" }
futures-util = "0.3"
rmcp = { version = "0.8.0", features = ["client"] }
axum = { version = "0.8.8", features = ["json", "http1", "tokio"] }
agent-database = { path = "../agent-database", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync", "macros", "test-util"] }
uuid = { version = "1.11", features = ["v4", "js"] }
vw-api-types = { path = "../../vw-api-types" }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"
