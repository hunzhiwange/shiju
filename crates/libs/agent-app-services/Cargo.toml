[package]
name = "agent-app-services"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }
tracing = "0.1"
thiserror = "2.0.18"
vw-api-apps-usage = { path = "../api-apps-usage", version = "0.6.0" }
anyhow = "1"
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume"] }
acp-types = { path = "../acp-types", version = "0.6.0" }
acp-server = { path = "../acp-server", version = "0.6.0" }
session-port = { path = "../session-port", version = "0.6.0" }
vw-api-mcp-management = { path = "../api-mcp-management", version = "0.6.0" }
vw-api-project-profiles = { path = "../api-project-profiles", version = "0.6.0" }
reqwest_012 = { package = "reqwest", version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
agent-database = { path = "../agent-database", version = "0.6.0" }
app-settings-store = { path = "../app-settings-store", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0" }
vw-api-app-auth = { path = "../api-app-auth", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mcp-client = { path = "../mcp-client", version = "0.6.0" }
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
vw-api-app-diagnostics = { path = "../api-app-diagnostics", version = "0.6.0" }

[target.'cfg(target_os = "macos")'.dependencies]
axum = { version = "0.8.8", default-features = false }
vw-api-tools = { path = "../api-tools", version = "0.6.0" }
hex = "0.4"
libc = "0.2"
uuid = { version = "1.11", features = ["v4", "js"] }

[dev-dependencies]
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync", "macros"] }
uuid = { version = "1.11", features = ["v4", "js"] }
vw-api-types = { path = "../../vw-api-types", version = "0.6.0" }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"
