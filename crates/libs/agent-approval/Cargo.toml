[package]
name = "agent-approval"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
config-security = { path = "../config-security" }
tool-context = { path = "../tool-context" }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.11", features = ["v4", "js"] }
