[package]
name = "agent-async"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
futures-util = "0.3.32"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
