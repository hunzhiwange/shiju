[package]
name = "agent-auth"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-paths = { path = "../agent-paths", version = "0.6.0" }
auth-file-store = { path = "../auth-file-store", version = "0.6.0" }
auth-types = { path = "../auth-types", version = "0.6.0" }
config-aggregate = { path = "../config-aggregate", version = "0.6.0" }
anyhow = "1"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
