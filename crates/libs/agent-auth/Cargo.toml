[package]
name = "agent-auth"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-paths = { path = "../agent-paths" }
auth-file-store = { path = "../auth-file-store" }
auth-types = { path = "../auth-types" }
config-aggregate = { path = "../config-aggregate" }
anyhow = "1"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
