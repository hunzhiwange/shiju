[package]
name = "agent-config"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["agent-database/test-support"]

[dependencies]
vw-api-transport = { path = "../api-transport" }
config-runtime-paths = { path = "../config-runtime-paths" }
config-provider = { path = "../config-provider" }
config-security = { path = "../config-security" }
config-agent = { path = "../config-agent" }
config-agent-profile = { path = "../config-agent-profile" }
acp-agent-registry = { path = "../acp-agent-registry" }
domain-matcher = { path = "../domain-matcher" }
toml = "0.9"
serde_ignored = "0.1.14"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "socks", "rustls", "http2", "gzip", "brotli", "deflate", "zstd"] }
agent-paths = { path = "../agent-paths" }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
config-aggregate = { path = "../config-aggregate" }
config-automation = { path = "../config-automation" }
config-channels = { path = "../config-channels" }
config-channel-services = { path = "../config-channel-services" }
config-channel-types = { path = "../config-channel-types" }
config-proxy = { path = "../config-proxy" }
config-skills = { path = "../config-skills" }
secret-store = { path = "../secret-store" }


agent-log = { path = "../agent-log" }
storage-types = { path = "../storage-types" }
config-tools = { path = "../config-tools" }
config-ui = { path = "../config-ui" }
config-gateway = { path = "../config-gateway" }
config-hooks = { path = "../config-hooks" }
config-memory = { path = "../config-memory" }
config-observability = { path = "../config-observability" }
config-reliability = { path = "../config-reliability" }
config-routing = { path = "../config-routing" }
config-runtime = { path = "../config-runtime" }
serde_yaml = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1.11", features = ["v4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs", "io-util", "sync"] }
agent-database = { path = "../agent-database" }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
agent-database = { path = "../agent-database", features = ["test-support"] }
tempfile = "3"
