[package]
name = "agent-config"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-paths = { path = "../agent-paths", version = "0.6.0" }
anyhow = "1"
serde_json = "1"
tracing = "0.1"
config-aggregate = { path = "../config-aggregate", version = "0.6.0" }
config-automation = { path = "../config-automation", version = "0.6.0" }
config-channels = { path = "../config-channels", version = "0.6.0" }
config-channel-services = { path = "../config-channel-services", version = "0.6.0" }
config-channel-types = { path = "../config-channel-types", version = "0.6.0" }
config-proxy = { path = "../config-proxy", version = "0.6.0" }
config-skills = { path = "../config-skills", version = "0.6.0" }
secret-store = { path = "../secret-store", version = "0.6.0" }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt"] }
agent-database = { path = "../agent-database", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
tempfile = "3"
