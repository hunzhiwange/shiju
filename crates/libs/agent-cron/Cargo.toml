[package]
name = "agent-cron"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
task-file-store = { path = "../task-file-store", version = "0.6.0" }
clap = { version = "4.5", features = ["derive"] }
session-port = { path = "../session-port", version = "0.6.0" }
async-trait = "0.1"
futures-util = "0.3.32"
agent-security = { path = "../agent-security", version = "0.6.0" }
agent-health = { path = "../agent-health", version = "0.6.0" }
channel-support = { path = "../channel-support", version = "0.6.0" }
vw-api-chat = { path = "../api-chat", version = "0.6.0" }
vw-api-acp-model = { path = "../api-acp-model", version = "0.6.0" }
agent-config = { path = "../agent-config", version = "0.6.0" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
cron = "0.16"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "process"] }
uuid = { version = "1.11", features = ["v4", "js"] }

serde_json = "1"
tracing = "0.1"

[dev-dependencies]
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
config-channel-types = { path = "../config-channel-types", version = "0.6.0" }
tempfile = "3"
tokio = { version = "1", features = ["fs", "net", "io-util"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
channel-types = { path = "../channel-types", version = "0.6.0" }
channel-telegram = { path = "../channel-telegram", version = "0.6.0" }
channel-discord = { path = "../channel-discord", version = "0.6.0" }
channel-email-channel = { path = "../channel-email-channel", version = "0.6.0" }
channel-mattermost = { path = "../channel-mattermost", version = "0.6.0" }
channel-qq = { path = "../channel-qq", version = "0.6.0" }
channel-slack = { path = "../channel-slack", version = "0.6.0" }
