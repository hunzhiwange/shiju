[package]
name = "agent-cron"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
task-file-store = { path = "../task-file-store" }
clap = { version = "4.5", features = ["derive"] }
session-port = { path = "../session-port" }
async-trait = "0.1"
futures-util = "0.3.32"
agent-security = { path = "../agent-security" }
agent-health = { path = "../agent-health" }
channel-support = { path = "../channel-support" }
vw-api-chat = { path = "../api-chat" }
vw-api-acp-model = { path = "../api-acp-model" }
agent-config = { path = "../agent-config" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
runtime-time = { path = "../runtime-time", features = ["named-time-zones"] }
cron = "0.16"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "process"] }
uuid = { version = "1.11", features = ["v4", "js"] }

serde_json = "1"
tracing = "0.1"

[dev-dependencies]
config-runtime-paths = { path = "../config-runtime-paths" }
config-channel-types = { path = "../config-channel-types" }
tempfile = "3"
tokio = { version = "1", features = ["fs", "net", "io-util"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
channel-types = { path = "../channel-types" }
channel-telegram = { path = "../channel-telegram" }
channel-discord = { path = "../channel-discord" }
channel-email-channel = { path = "../channel-email-channel" }
channel-mattermost = { path = "../channel-mattermost" }
channel-qq = { path = "../channel-qq" }
channel-slack = { path = "../channel-slack" }

[dependencies.agent-cli-types]
path = "../agent-cli-types"
