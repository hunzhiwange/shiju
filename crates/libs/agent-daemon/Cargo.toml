[package]
name = "agent-daemon"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
observability-otel = ["agent-observability/observability-otel"]

[dependencies]
agent-heartbeat = { path = "../agent-heartbeat" }
agent-observability = { path = "../agent-observability" }
agent-config = { path = "../agent-config" }
agent-health = { path = "../agent-health" }
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
config-channel-types = { path = "../config-channel-types" }
tempfile = "3"
config-channel-services = { path = "../config-channel-services" }
