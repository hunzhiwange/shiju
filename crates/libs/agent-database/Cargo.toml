[package]
name = "agent-database"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
# Share the existing isolated home and PostgreSQL fixtures with application tests.
test-support = ["dep:tempfile", "dep:uuid"]

[dependencies]
anyhow = "1"
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-postgres-rustls = "0.14.0"
url = "2"
webpki-roots = "1.0"
tempfile = { version = "3", optional = true }
uuid = { version = "1.11", features = ["v4", "js"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1.11", features = ["v4", "js"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
