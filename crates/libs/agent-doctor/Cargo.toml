[package]
name = "agent-doctor"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-daemon = { path = "../agent-daemon" }
agent-config = { path = "../agent-config" }
agent-providers = { path = "../agent-providers" }
agent-observability = { path = "../agent-observability" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false }

[dev-dependencies]
agent-provider = { path = "../agent-provider" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
