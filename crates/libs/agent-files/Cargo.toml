[package]
name = "agent-files"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-bus = { path = "../agent-bus" }
agent-log = { path = "../agent-log" }
runtime-flags = { path = "../runtime-flags" }
base64 = "0.23"
chardetng = "1"
encoding_rs = "0.8"
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
tokio = { version = "1", features = ["sync", "time", "rt"] }
walkdir = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
