[package]
name = "agent-format"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-bus = { path = "../agent-bus", version = "0.6.0" }
agent-config = { path = "../agent-config", version = "0.6.0" }
agent-files = { path = "../agent-files", version = "0.6.0" }
agent-log = { path = "../agent-log", version = "0.6.0" }
runtime-flags = { path = "../runtime-flags", version = "0.6.0" }
shell-command = { path = "../shell-command", version = "0.6.0", features = ["shell-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "rt", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
tempfile = "3"
