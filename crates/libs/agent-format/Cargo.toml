[package]
name = "agent-format"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-bus = { path = "../agent-bus" }
agent-config = { path = "../agent-config" }
agent-files = { path = "../agent-files" }
agent-log = { path = "../agent-log" }
runtime-flags = { path = "../runtime-flags" }
shell-command = { path = "../shell-command", features = ["shell-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "rt", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
tempfile = "3"
