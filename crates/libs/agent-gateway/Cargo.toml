[package]
name = "agent-gateway"
version.workspace = true
edition = "2024"
license = "MIT"
[dependencies.agent-config]
path = "../agent-config"

[dependencies.agent-approval]
path = "../agent-approval"

[dependencies.agent-project]
path = "../agent-project"

[dependencies.hex]
version = "0.4"

[dev-dependencies.config-channel-services]
path = "../config-channel-services"

[dev-dependencies.gateway-pairing]
path = "../gateway-pairing"

[dev-dependencies.observer-backends]
path = "../observer-backends"

[dev-dependencies.async-trait]
version = "0.1"


[features]
test-support = ["dep:observer-backends", "dep:gateway-files", "dep:gateway-http", "dep:gateway-endpoint", "dep:vw-api-file", "dep:tempfile"]

[lib]
doctest = false

[dependencies.agent-multimodal]
path = "../agent-multimodal"

[dependencies.agent-util]
path = "../agent-util"

[dependencies.session-info]
path = "../session-info"

[dependencies.session-ui-types]
path = "../session-ui-types"

[dependencies.session-engine]
path = "../session-engine"

[dependencies.agent-loop]
path = "../agent-loop"

[dependencies.gateway-pairing]
path = "../gateway-pairing"

[dependencies.async-trait]
version = "0.1"


[dependencies.channel-linq]
path = "../channel-linq"

[dependencies.channel-nextcloud-talk]
path = "../channel-nextcloud-talk"

[dependencies.channel-qq]
path = "../channel-qq"

[dependencies.channel-wati]
path = "../channel-wati"

[dependencies.channel-whatsapp]
path = "../channel-whatsapp"

[dependencies.channel-support]
path = "../channel-support"

[dependencies.channel-runtime]
path = "../channel-runtime"

[dependencies.agent-hooks]
path = "../agent-hooks"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["net", "signal"] }

[dependencies]
agent-health = { path = "../agent-health" }
observer-prometheus = { path = "../observer-prometheus" }
runtime-flags = { path = "../runtime-flags" }
base64 = "0.22"
hmac = "0.13"
channel-types = { path = "../channel-types" }
gateway-task = { path = "../gateway-task" }
app-diagnostics-runtime = { path = "../app-diagnostics-runtime" }
gateway-project = { path = "../gateway-project" }
agent-database = { path = "../agent-database" }
app-settings-store = { path = "../app-settings-store" }
app-project-profiles = { path = "../app-project-profiles" }
app-operations = { path = "../app-operations" }
vw-api-transport = { path = "../api-transport" }
vw-api-project-profiles = { path = "../api-project-profiles" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
app-skills = { path = "../app-skills" }

[dependencies.vw-agent-apps]
path = "../../vw-agent-apps"

[dependencies.vw-api-app-diagnostics]
path = "../api-app-diagnostics"

[dependencies.vw-api-app-identity]
path = "../api-app-identity"

[dependencies.futures-util]
version = "0.3"

[dependencies.parking_lot]
version = "0.12"

[dependencies.tokio-util]
version = "0.7"
features = ["rt"]

[dependencies.tracing]
version = "0.1"

[target.'cfg(unix)'.dependencies.libc]
version = "0.2"

[dev-dependencies]
acp-agent-registry = { path = "../acp-agent-registry" }
rand = "0.10.3"
agent-config = { path = "../agent-config", features = ["test-support"] }
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[dependencies.axum]
version = "0.8"
features = ["ws"]

[dependencies.gateway-types]
path = "../gateway-types"

[dependencies.memory-types]
path = "../memory-types"

[dependencies.observer-types]
path = "../observer-types"

[dependencies.tool-types]
