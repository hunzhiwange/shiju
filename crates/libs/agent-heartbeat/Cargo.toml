[package]
name = "agent-heartbeat"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
config-automation = { path = "../config-automation" }
observer-types = { path = "../observer-types" }
anyhow = "1"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
agent-observability = { path = "../agent-observability" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
