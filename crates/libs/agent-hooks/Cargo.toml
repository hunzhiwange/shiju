[package]
name = "agent-hooks"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
channel-types = { path = "../channel-types" }
model-types = { path = "../model-types" }
tool-types = { path = "../tool-types" }
config-hooks = { path = "../config-hooks" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
