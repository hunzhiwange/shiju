[package]
name = "agent-installation"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-bus = { path = "../agent-bus", version = "0.6.0" }
agent-log = { path = "../agent-log", version = "0.6.0" }
runtime-flags = { path = "../runtime-flags", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream", "socks", "blocking", "json", "gzip", "brotli", "deflate", "zstd", "http2", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }

[dev-dependencies]
tempfile = "3"
