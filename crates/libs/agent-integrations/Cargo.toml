[package]
name = "agent-integrations"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-config = { path = "../agent-config" }
config-provider = { path = "../config-provider" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
console = "0.16"
config-runtime-paths = { path = "../config-runtime-paths" }

[dev-dependencies]
serde_json = "1"

[dependencies.agent-cli-types]
path = "../agent-cli-types"
