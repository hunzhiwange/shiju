[package]
name = "agent-integrations"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
config-provider = { path = "../config-provider", version = "0.6.0" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
console = "0.16"
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }

[dev-dependencies]
serde_json = "1"
