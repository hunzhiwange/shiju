[package]
name = "agent-loop"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["dep:tempfile"]

[dependencies]
hostname = "0.4"
agent-text = { path = "../agent-text" }
config-routing = { path = "../config-routing" }
config-tools = { path = "../config-tools" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
permission-runtime = { path = "../permission-runtime" }
message-types = { path = "../message-types" }
channel-support = { path = "../channel-support" }
vw-api-tools = { path = "../api-tools" }
plugin-hooks = { path = "../plugin-hooks" }
session-port = { path = "../session-port" }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

agent-multimodal = { path = "../agent-multimodal" }
agent-providers = { path = "../agent-providers" }

agent-approval = { path = "../agent-approval" }
agent-observability = { path = "../agent-observability" }
agent-security = { path = "../agent-security" }
agent-hooks = { path = "../agent-hooks" }
tokio-util = { version = "0.7", features = ["rt"] }

agent-project = { path = "../agent-project" }
agent-provider = { path = "../agent-provider" }
session-engine = { path = "../session-engine" }
tool-context = { path = "../tool-context" }
vw-api-transport = { path = "../api-transport" }

agent-memory = { path = "../agent-memory" }
agent-skills = { path = "../agent-skills" }
agent-util = { path = "../agent-util" }
tool-assembly = { path = "../tool-assembly" }
chrono-tz = "0.10"

regex = "1"
tokio = { version = "1", features = ["sync", "macros", "time"] }
anyhow = "1"
tempfile = { version = "3", optional = true }
async-trait = "0.1"
agent-config = { path = "../agent-config" }
observer-types = { path = "../observer-types" }
config-agent = { path = "../config-agent" }
config-agent-profile = { path = "../config-agent-profile" }
model-selection = { path = "../model-selection" }
model-types = { path = "../model-types" }
model-protocol = { path = "../model-protocol" }
json-extract = { path = "../json-extract" }
agent-defaults = { path = "../agent-defaults" }
serde_json = "1"
tool-types = { path = "../tool-types" }
tool-services = { path = "../tool-services" }
futures-util = "0.3"
config-security = { path = "../config-security" }
config-reliability = { path = "../config-reliability" }


[dev-dependencies]
permission-types = { path = "../permission-types" }
tempfile = "3"
tokio = { version = "1", features = ["test-util", "rt"] }
