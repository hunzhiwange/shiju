[package]
name = "agent-memory"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
default = []
memory-postgres = ["dep:memory-postgres"]
memory-mariadb = ["dep:memory-mariadb"]

[dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
memory-algorithms = { path = "../memory-algorithms", version = "0.6.0" }
memory-types = { path = "../memory-types", version = "0.6.0" }
memory-markdown = { path = "../memory-markdown", version = "0.6.0" }
memory-postgres = { path = "../memory-postgres", version = "0.6.0", optional = true }
project-storage-paths = { path = "../project-storage-paths", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-util = { path = "../agent-util", version = "0.6.0" }
chrono = { version = "0.4", features = ["serde"] }
dialoguer = "0.11"
memory-lucid = { path = "../memory-lucid", version = "0.6.0" }
memory-sqlite = { path = "../memory-sqlite", version = "0.6.0" }
memory-mariadb = { path = "../memory-mariadb", version = "0.6.0", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream", "socks", "blocking", "json", "gzip", "brotli", "deflate", "zstd", "http2", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
agent-config = { path = "../agent-config", version = "0.6.0", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
