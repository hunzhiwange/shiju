[package]
name = "agent-migration"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
agent-cli-types = { path = "../agent-cli-types", version = "0.6.0" }
agent-memory = { path = "../agent-memory", version = "0.6.0" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
rusqlite = "0.37.0"

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[dev-dependencies]
agent-config = { path = "../agent-config", version = "0.6.0", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
