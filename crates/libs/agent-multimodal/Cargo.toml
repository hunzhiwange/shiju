[package]
name = "agent-multimodal"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-config = { path = "../agent-config" }
agent-paths = { path = "../agent-paths" }
config-tools = { path = "../config-tools" }
model-types = { path = "../model-types" }
anyhow = "1"
async-trait = "0.1.89"
base64 = "0.23"
hex = "0.4"
image = "0.25.9"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1.11", features = ["v4", "js"] }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", features = ["rustls"] }
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "test-util"] }
