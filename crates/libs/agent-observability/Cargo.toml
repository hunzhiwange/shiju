[package]
name = "agent-observability"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
observability-otel = ["dep:observer-otel", "observer-otel/observability-otel"]

[dependencies]
config-observability = { path = "../config-observability", version = "0.6.0" }
observer-backends = { path = "../observer-backends", version = "0.6.0" }
observer-prometheus = { path = "../observer-prometheus", version = "0.6.0" }
observer-types = { path = "../observer-types", version = "0.6.0" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
observer-otel = { path = "../observer-otel", version = "0.6.0", optional = true }

[dev-dependencies]
tempfile = "3"
