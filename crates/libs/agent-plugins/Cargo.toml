[package]
name = "agent-plugins"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
plugin-types = { path = "../plugin-types", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

plugin-hooks = { path = "../plugin-hooks", version = "0.6.0" }
plugin-install = { path = "../plugin-install", version = "0.6.0" }
config-plugins = { path = "../config-plugins", version = "0.6.0" }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

tempfile = "3"
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
