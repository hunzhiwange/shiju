[package]
name = "agent-project"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
# Preserve isolated runtime storage for host test callers.
test-support = []

[dependencies]
agent-bus = { path = "../agent-bus" }
agent-log = { path = "../agent-log" }
agent-files = { path = "../agent-files" }
agent-paths = { path = "../agent-paths" }
runtime-flags = { path = "../runtime-flags" }
project-types = { path = "../project-types" }
config-runtime-paths = { path = "../config-runtime-paths" }
vw-api-transport = { path = "../api-transport" }
anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "fs"] }
walkdir = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-database = { path = "../agent-database" }
git-discovery = { path = "../git-discovery" }
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite.workspace = true

[dev-dependencies]
storage-types = { path = "../storage-types" }
tempfile = "3"
uuid = { version = "1.11", features = ["v4", "js"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-database = { path = "../agent-database", features = ["test-support"] }
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
