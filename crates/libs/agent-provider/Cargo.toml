[package]
name = "agent-provider"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
app-model-catalog = { path = "../app-model-catalog", version = "0.6.0" }
thiserror = "2"
strsim = "0.11"
tokio = { version = "1", features = ["sync", "rt"] }
agent-auth = { path = "../agent-auth", version = "0.6.0" }
agent-env = { path = "../agent-env", version = "0.6.0" }
agent-config = { path = "../agent-config", version = "0.6.0" }
agent-project = { path = "../agent-project", version = "0.6.0" }
agent-log = { path = "../agent-log", version = "0.6.0" }
model-state = { path = "../model-state", version = "0.6.0" }
model-types = { path = "../model-types", version = "0.6.0" }
model-reasoning = { path = "../model-reasoning", version = "0.6.0" }
provider-errors = { path = "../provider-errors", version = "0.6.0" }
provider-model-cache = { path = "../provider-model-cache", version = "0.6.0" }
runtime-flags = { path = "../runtime-flags", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-model-catalog = { path = "../api-model-catalog", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
provider-model-discovery = { path = "../provider-model-discovery", version = "0.6.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
