[package]
name = "agent-provider"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
app-provider-validation = { path = "../app-provider-validation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
app-model-catalog = { path = "../app-model-catalog" }
thiserror = "2"
strsim = "0.11"
tokio = { version = "1", features = ["sync", "rt"] }
agent-auth = { path = "../agent-auth" }
agent-env = { path = "../agent-env" }
agent-config = { path = "../agent-config" }
agent-project = { path = "../agent-project" }
agent-log = { path = "../agent-log" }
model-state = { path = "../model-state" }
model-types = { path = "../model-types" }
model-reasoning = { path = "../model-reasoning" }
provider-errors = { path = "../provider-errors" }
provider-model-cache = { path = "../provider-model-cache" }
runtime-flags = { path = "../runtime-flags" }
vw-api-transport = { path = "../api-transport" }
vw-api-model-catalog = { path = "../api-model-catalog" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
provider-model-discovery = { path = "../provider-model-discovery" }
model-http-client = { path = "../model-http-client" }
config-voice = { path = "../config-voice" }
vw-api-voice = { path = "../api-voice" }
base64 = "0.23"
futures-util = "0.3.32"
image = "0.25.9"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream", "rustls"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.18"
uuid = { version = "1.11", features = ["v4", "js"] }
tokio = { version = "1", features = ["time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "process", "rt-multi-thread"] }

tempfile = "3"
agent-database = { path = "../agent-database" }
agent-paths = { path = "../agent-paths" }
app-provider-services = { path = "../app-provider-services" }
app-models = { path = "../app-models" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-provider-base = { path = "../api-app-provider-base" }
