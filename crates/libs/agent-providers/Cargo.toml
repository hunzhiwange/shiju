[package]
name = "agent-providers"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
futures-util = "0.3.32"
serde_json = "1"
model-types = { path = "../model-types" }
config-provider = { path = "../config-provider" }
config-reliability = { path = "../config-reliability" }
config-routing = { path = "../config-routing" }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["sync"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-config = { path = "../agent-config" }
agent-multimodal = { path = "../agent-multimodal" }
gateway-chat-stream = { path = "../gateway-chat-stream" }
gateway-endpoint = { path = "../gateway-endpoint" }
vw-api-acp-model = { path = "../api-acp-model" }
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
agent-provider = { path = "../agent-provider" }
model-state = { path = "../model-state" }
axum = { version = "0.8.8", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
