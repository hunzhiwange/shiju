[package]
name = "agent-pty"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-bus = { path = "../agent-bus" }
agent-log = { path = "../agent-log" }
ordered-id = { path = "../ordered-id" }
shell-command = { path = "../shell-command" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
