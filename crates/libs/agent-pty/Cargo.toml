[package]
name = "agent-pty"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-bus = { path = "../agent-bus", version = "0.6.0" }
agent-log = { path = "../agent-log", version = "0.6.0" }
ordered-id = { path = "../ordered-id", version = "0.6.0" }
shell-command = { path = "../shell-command", version = "0.6.0" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
