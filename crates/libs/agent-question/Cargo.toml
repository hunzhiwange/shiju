[package]
name = "agent-question"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-bus = { path = "../agent-bus" }
agent-log = { path = "../agent-log" }
ordered-id = { path = "../ordered-id" }
question-types = { path = "../question-types" }
vw-api-transport = { path = "../api-transport" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
uuid = { version = "1.11", features = ["v4", "js"] }
