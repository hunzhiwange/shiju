[package]
name = "agent-question"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-bus = { path = "../agent-bus", version = "0.6.0" }
agent-log = { path = "../agent-log", version = "0.6.0" }
ordered-id = { path = "../ordered-id", version = "0.6.0" }
question-types = { path = "../question-types", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
uuid = { version = "1.11", features = ["v4", "js"] }
