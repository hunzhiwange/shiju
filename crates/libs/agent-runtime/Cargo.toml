[package]
name = "agent-runtime"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
default = []
test-support = []

[dependencies]
anyhow = "1"
config-runtime = { path = "../config-runtime" }
config-runtime-paths = { path = "../config-runtime-paths" }
runtime-types = { path = "../runtime-types" }
directories = "5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
which = "6.0"
tokio = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
