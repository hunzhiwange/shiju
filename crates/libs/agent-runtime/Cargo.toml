[package]
name = "agent-runtime"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
default = []
test-support = []

[dependencies]
anyhow = "1"
config-runtime = { path = "../config-runtime", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
runtime-types = { path = "../runtime-types", version = "0.6.0" }
directories = "5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
which = "6.0"
tokio = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
