[package]
name = "agent-security"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
shellexpand = "3"
canary-guard = { path = "../canary-guard" }
agent-config = { path = "../agent-config" }
agent-memory = { path = "../agent-memory" }
sha2 = "0.11"
hex = "0.4"
directories = "6"
glob = "0.3"
regex = "1"
shell-words = "1.1"
thiserror = "2.0.18"
tree-sitter = { version = "0.26.10", optional = true }
tree-sitter-bash = { version = "0.23", optional = true }
config-security = { path = "../config-security" }
process-sandbox = { path = "../process-sandbox" }
domain-matcher = { path = "../domain-matcher" }
content-guard = { path = "../content-guard" }
gateway-pairing = { path = "../gateway-pairing" }
secret-store = { path = "../secret-store" }
anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["fs"] }
rand = "0.10.3"
ring = "0.17.14"

[dev-dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tempfile = "3"

[features]
default = []
shell-ast = ["dep:tree-sitter", "dep:tree-sitter-bash"]
sandbox-bubblewrap = ["process-sandbox/sandbox-bubblewrap"]
sandbox-landlock = ["process-sandbox/sandbox-landlock"]
