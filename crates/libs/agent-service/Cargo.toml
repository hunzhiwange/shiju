[package]
name = "agent-service"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-config = { path = "../agent-config" }
config-runtime-paths = { path = "../config-runtime-paths" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "6.0"

[dev-dependencies]
tempfile = "3"

[dependencies.agent-cli-types]
path = "../agent-cli-types"
