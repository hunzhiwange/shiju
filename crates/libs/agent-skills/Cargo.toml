[package]
name = "agent-skills"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
hex = "0.4"
tracing = "0.1"
shell-command = { path = "../shell-command", version = "0.6.0" }
tempfile = "3"
serde_yaml = "0.9"
serde_json = "1"
sha2 = "0.11"
anyhow = "1"
console = "0.16"
config-skills = { path = "../config-skills", version = "0.6.0" }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
walkdir = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dialoguer = "0.11"
