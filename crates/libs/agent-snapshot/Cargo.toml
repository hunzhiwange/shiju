[package]
name = "agent-snapshot"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snapshot-types = { path = "../snapshot-types", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-log = { path = "../agent-log", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
shell-command = { path = "../shell-command", version = "0.6.0" }
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
