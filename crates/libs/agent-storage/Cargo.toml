[package]
name = "agent-storage"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-paths = { path = "../agent-paths", version = "0.6.0" }
agent-async = { path = "../agent-async", version = "0.6.0" }
agent-log = { path = "../agent-log", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
storage-types = { path = "../storage-types", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
walkdir = "2"
uuid = { version = "1.11", features = ["v4"] }
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
uuid = { version = "1.11", features = ["v4", "js"] }
tokio = { version = "1", features = ["macros"] }
