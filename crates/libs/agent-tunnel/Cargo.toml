[package]
name = "agent-tunnel"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
config-gateway = { path = "../config-gateway", version = "0.6.0" }
shell-command = { path = "../shell-command", version = "0.6.0", features = ["shell-tokio"] }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
