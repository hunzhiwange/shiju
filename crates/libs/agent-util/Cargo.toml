[package]
name = "agent-util"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
regex = "1"
anyhow = "1"
chrono = "0.4"
runtime-time = { path = "../runtime-time", features = ["named-time-zones"] }
display-format = { path = "../display-format" }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["rt"] }
web-time = "1.1.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
