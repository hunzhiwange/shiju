[package]
name = "agent-util"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10.4"
display-format = { path = "../display-format", version = "0.6.0" }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["rt"] }
web-time = "1.1.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
