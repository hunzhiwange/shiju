[package]
name = "app-config-patch"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-hermes-memory = { path = "../api-hermes-memory", version = "0.6.0" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
