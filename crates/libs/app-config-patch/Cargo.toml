[package]
name = "app-config-patch"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-hermes-memory = { path = "../api-hermes-memory" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml.workspace = true
toml_edit = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
json-five = "0.3.1"

[dev-dependencies]
toml = "0.9"
tempfile = "3"
