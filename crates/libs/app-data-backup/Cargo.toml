[package]
name = "app-data-backup"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
app-config-paths = { path = "../app-config-paths" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
tempfile = "3"
uuid = { version = "1.11", features = ["v4", "js"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
vw-api-app-operations = { path = "../api-app-operations" }
vw-api-transport = { path = "../api-transport" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
app-usage-store = { path = "../app-usage-store" }
rusqlite = { version = "0.37.0", features = ["bundled", "hooks", "limits"] }
