[package]
name = "app-data-management"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-app-operations = { path = "../api-app-operations" }

[target.'cfg(target_os = "macos")'.dependencies]
app-data-backup = { path = "../app-data-backup" }
app-auth = { path = "../app-auth" }
vw-api-task = { path = "../api-task" }

[dev-dependencies]
app-usage-store = { path = "../app-usage-store" }
rusqlite = { version = "0.37.0", features = ["bundled", "hooks", "limits"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tempfile = "3"
vw-api-transport = { path = "../api-transport" }
