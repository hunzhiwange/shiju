[package]
name = "app-data-projection"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
hex = "0.4"
vw-api-app-operations = { path = "../api-app-operations" }
app-data-format = { path = "../app-data-format" }
app-catalog = { path = "../app-catalog" }
app-mcp-catalog = { path = "../app-mcp-catalog" }
app-prompts = { path = "../app-prompts" }
app-providers = { path = "../app-providers" }
app-usage-store = { path = "../app-usage-store" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
uuid = { version = "1.11", features = ["v4", "js"] }
toml = "0.9"
rusqlite = { version = "0.37.0", features = ["bundled", "hooks", "limits"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-provider-base = { path = "../api-app-provider-base" }
vw-api-app-provider-profiles = { path = "../api-app-provider-profiles" }
vw-api-app-provider-edit = { path = "../api-app-provider-edit" }
vw-api-project-profiles = { path = "../api-project-profiles" }
vw-api-usage = { path = "../api-usage" }
vw-api-mcp-management = { path = "../api-mcp-management" }
vw-api-transport = { path = "../api-transport" }

[target.'cfg(target_os = "macos")'.dependencies]
app-skills = { path = "../app-skills" }
libc = "0.2"
