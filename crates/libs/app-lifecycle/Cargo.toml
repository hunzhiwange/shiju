[package]
name = "app-lifecycle"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
semver = "1"
app-auth = { path = "../app-auth" }
app-catalog = { path = "../app-catalog" }
app-versions = { path = "../app-versions" }
vw-api-app-identity = { path = "../api-app-identity" }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
vw-api-types = { path = "../../vw-api-types" }
vw-api-task = { path = "../api-task" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
