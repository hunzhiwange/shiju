[package]
name = "app-mcp"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
app-mcp-catalog = { path = "../app-mcp-catalog" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-mcp-management = { path = "../api-mcp-management" }

[target.'cfg(target_os = "macos")'.dependencies]
app-auth = { path = "../app-auth" }
app-config-paths = { path = "../app-config-paths" }
app-provider-native = { path = "../app-provider-native" }
vw-api-transport = { path = "../api-transport" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
toml = "0.9"
toml_edit = "0.22"

[target.'cfg(target_os = "macos")'.dev-dependencies]
app-auth = { path = "../app-auth", features = ["test-support"] }
app-providers = { path = "../app-providers" }
vw-api-app-auth = { path = "../api-app-auth" }
tempfile = "3"
