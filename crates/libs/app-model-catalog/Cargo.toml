[package]
name = "app-model-catalog"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
app-provider-validation = { path = "../app-provider-validation" }
app-routing-policy = { path = "../app-routing-policy" }
vw-api-types = { path = "../../vw-api-types" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
toml_edit = "0.22"
