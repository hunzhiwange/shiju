[package]
name = "app-models"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
app-model-catalog = { path = "../app-model-catalog" }
app-provider-validation = { path = "../app-provider-validation" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-provider-base = { path = "../api-app-provider-base" }
vw-api-app-provider-edit = { path = "../api-app-provider-edit" }
vw-api-app-provider-terminal = { path = "../api-app-provider-terminal" }
vw-api-model-catalog = { path = "../api-model-catalog" }
vw-api-transport = { path = "../api-transport" }
model-reasoning = { path = "../model-reasoning" }
provider-model-cache = { path = "../provider-model-cache" }
provider-model-catalog = { path = "../provider-model-catalog" }
provider-model-discovery = { path = "../provider-model-discovery" }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
base64 = "0.23"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "time"] }
