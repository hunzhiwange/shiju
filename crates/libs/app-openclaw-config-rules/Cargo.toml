[package]
name = "app-openclaw-config-rules"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
app-config-patch = { path = "../app-config-patch" }
app-config-write = { path = "../app-config-write" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
