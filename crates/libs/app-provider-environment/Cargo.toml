[package]
name = "app-provider-environment"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment" }

[target.'cfg(target_os = "macos")'.dependencies]
app-config-write = { path = "../app-config-write" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
