[package]
name = "app-provider-login"
version = "0.7.10"
edition = "2024"
license = "MIT"

[target.'cfg(target_os = "macos")'.dependencies]
app-auth-codex = { path = "../app-auth-codex" }
app-config-write = { path = "../app-config-write" }
vw-api-app-identity = { path = "../api-app-identity" }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toml_edit = "0.22"

[target.'cfg(target_os = "macos")'.dev-dependencies]
app-auth = { path = "../app-auth", features = ["test-support"] }
vw-api-transport = { path = "../api-transport" }
tempfile = "3"
