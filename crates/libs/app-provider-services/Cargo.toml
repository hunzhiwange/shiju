[package]
name = "app-provider-services"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-database = { path = "../agent-database" }
agent-app-services = { path = "../agent-app-services" }
app-settings-store = { path = "../app-settings-store" }
model-protocols = { path = "../model-protocols" }
provider-model-cache = { path = "../provider-model-cache" }
vw-api-app-auth = { path = "../api-app-auth" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-provider-base = { path = "../api-app-provider-base" }
vw-api-app-provider-edit = { path = "../api-app-provider-edit" }
vw-api-app-provider-extended = { path = "../api-app-provider-extended" }
vw-api-app-provider-profiles = { path = "../api-app-provider-profiles" }
vw-api-app-provider-terminal = { path = "../api-app-provider-terminal" }
vw-api-model-catalog = { path = "../api-model-catalog" }
vw-api-transport = { path = "../api-transport" }
vw-agent-apps = { path = "../../vw-agent-apps" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
axum = { version = "0.8.8", default-features = false }
hex = "0.4"
sha2 = "0.11"
uuid = { version = "1.11", features = ["v4", "js"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite.workspace = true

[dev-dependencies]
agent-database = { path = "../agent-database", features = ["test-support"] }
base64 = "0.23"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
vw-api-types = { path = "../../vw-api-types" }
