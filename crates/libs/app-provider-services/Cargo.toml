[package]
name = "app-provider-services"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-database = { path = "../agent-database", version = "0.6.0" }
agent-app-services = { path = "../agent-app-services", version = "0.6.0" }
app-settings-store = { path = "../app-settings-store", version = "0.6.0" }
model-protocols = { path = "../model-protocols", version = "0.6.0" }
provider-model-cache = { path = "../provider-model-cache", version = "0.6.0" }
vw-api-app-auth = { path = "../api-app-auth", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-app-provider-base = { path = "../api-app-provider-base", version = "0.6.0" }
vw-api-app-provider-edit = { path = "../api-app-provider-edit", version = "0.6.0" }
vw-api-app-provider-extended = { path = "../api-app-provider-extended", version = "0.6.0" }
vw-api-app-provider-profiles = { path = "../api-app-provider-profiles", version = "0.6.0" }
vw-api-app-provider-terminal = { path = "../api-app-provider-terminal", version = "0.6.0" }
vw-api-model-catalog = { path = "../api-model-catalog", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
axum = { version = "0.8.8", default-features = false }
hex = "0.4"
sha2 = "0.11"
uuid = { version = "1.11", features = ["v4", "js"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
base64 = "0.23"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
vw-api-types = { path = "../../vw-api-types", version = "0.6.0" }
