[package]
name = "app-provider-validation"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-app-provider-base = { path = "../api-app-provider-base", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
reqwest = { version = "0.13", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toml_edit = "0.22"
vw-api-types = { path = "../../vw-api-types" }

[dev-dependencies]
tempfile = "3"
