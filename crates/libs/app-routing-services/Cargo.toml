[package]
name = "app-routing-services"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
async-compression = { version = "0.4", features = ["brotli", "deflate", "gzip", "tokio", "zlib", "zstd"] }
axum = { version = "0.8.8", default-features = false, features = ["json", "http1", "tokio"] }
futures-util = "0.3"
parking_lot = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "rt", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
model-relay-state = { path = "../model-relay-state", version = "0.6.0" }

model-protocol = { path = "../model-protocol", version = "0.6.0" }


vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0" }
model-transport = { path = "../model-transport", version = "0.6.0" }
reqwest = { version = "0.13", default-features = false, features = ["stream", "socks", "gzip", "brotli", "deflate", "zstd", "http2", "rustls"] }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0" }
agent-usage = { path = "../agent-usage", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-app-routing = { path = "../api-app-routing", version = "0.6.0" }
vw-api-app-provider-base = { path = "../api-app-provider-base", version = "0.6.0" }
getrandom = "0.4"
hex = "0.4"
sha2 = "0.11"
thiserror = "2.0.18"
httparse = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "tokio"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
rustls-pki-types = "1.14.0"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }

uuid = { version = "1.11", features = ["v4", "js"] }
tracing = "0.1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]

agent-app-services = { path = "../agent-app-services", version = "0.6.0" }
vw-api-app-auth = { path = "../api-app-auth", version = "0.6.0" }

app-settings-store = { path = "../app-settings-store", version = "0.6.0" }
vw-api-app-failover = { path = "../api-app-failover", version = "0.6.0" }

app-provider-services = { path = "../app-provider-services", version = "0.6.0" }
vw-api-model-catalog = { path = "../api-model-catalog", version = "0.6.0" }
secret-store = { path = "../secret-store", version = "0.6.0" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment", version = "0.6.0" }
chrono = { version = "0.4", features = ["serde"] }
system-configuration = "0.7"
glob = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "test-util", "rt-multi-thread", "process"] }
tempfile = "3"
flate2 = "1"
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
gateway-inference = { path = "../gateway-inference", version = "0.6.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
