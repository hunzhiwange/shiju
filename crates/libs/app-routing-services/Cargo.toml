[package]
name = "app-routing-services"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
async-compression = { version = "0.4", features = ["brotli", "deflate", "gzip", "tokio", "zlib", "zstd"] }
axum = { version = "0.8.8", default-features = false, features = ["json", "http1", "tokio"] }
futures-util = "0.3"
parking_lot = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "rt", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
model-relay-state = { path = "../model-relay-state" }

model-protocol = { path = "../model-protocol" }


vw-agent-apps = { path = "../../vw-agent-apps" }
model-transport = { path = "../model-transport" }
reqwest = { version = "0.13", default-features = false, features = ["stream", "socks", "gzip", "brotli", "deflate", "zstd", "http2", "rustls"] }
vw-api-transport = { path = "../api-transport" }
agent-database = { path = "../agent-database" }
agent-usage = { path = "../agent-usage" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-routing = { path = "../api-app-routing" }
vw-api-app-provider-base = { path = "../api-app-provider-base" }
getrandom = "0.4"
hex = "0.4"
sha2 = "0.11"
thiserror = "2.0.18"
httparse = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "tokio"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
rustls-pki-types = "1.14.0"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }

uuid = { version = "1.11", features = ["v4", "js"] }
tracing = "0.1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]

agent-app-services = { path = "../agent-app-services" }
vw-api-app-auth = { path = "../api-app-auth" }

app-settings-store = { path = "../app-settings-store" }
vw-api-app-failover = { path = "../api-app-failover" }

app-provider-services = { path = "../app-provider-services" }
vw-api-model-catalog = { path = "../api-model-catalog" }
secret-store = { path = "../secret-store" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment" }
chrono = { version = "0.4", features = ["serde"] }
system-configuration = "0.7"
glob = "0.3"

[dev-dependencies]
gateway-http = { path = "../gateway-http" }
rusqlite = "0.37"
postgres = "0.19"
tokio = { version = "1", features = ["macros", "test-util", "rt-multi-thread", "process"] }
tempfile = "3"
flate2 = "1"
agent-database = { path = "../agent-database", features = ["test-support"] }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-inference = { path = "../gateway-inference" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies.agent-config]
path = "../agent-config"
