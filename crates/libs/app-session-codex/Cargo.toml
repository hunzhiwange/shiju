[package]
name = "app-session-codex"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
app-session-core = { path = "../app-session-core" }
vw-api-external-session = { path = "../api-external-session" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rusqlite = { workspace = true, features = ["bundled", "hooks", "limits"] }
uuid = { version = "1.11", features = ["v4", "js"] }
zstd = "0.13"
