[package]
name = "app-session-migration"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
app-auth = { path = "../app-auth" }
app-config-paths = { path = "../app-config-paths" }
app-config-write = { path = "../app-config-write" }
app-provider-validation = { path = "../app-provider-validation" }
app-session-core = { path = "../app-session-core" }
app-session-codex = { path = "../app-session-codex" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment" }
vw-api-external-session = { path = "../api-external-session" }
vw-api-transport = { path = "../api-transport" }
libc = "0.2"
rusqlite = { workspace = true, features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
toml = "0.9"
toml_edit = "0.22"
zstd = "0.13"
