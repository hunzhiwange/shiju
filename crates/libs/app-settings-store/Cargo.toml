[package]
name = "app-settings-store"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
hex = "0.4"
app-availability = { path = "../app-availability" }
app-provider-validation = { path = "../app-provider-validation" }
app-routing-policy = { path = "../app-routing-policy" }
agent-database = { path = "../agent-database" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
vw-api-transport = { path = "../api-transport" }
vw-api-app-failover = { path = "../api-app-failover" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-agent-apps = { path = "../../vw-agent-apps" }

[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.13", default-features = false }
sha2 = "0.11"
uuid = { version = "1.11", features = ["v4", "js"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite.workspace = true

[dev-dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
app-providers = { path = "../app-providers" }
agent-database = { path = "../agent-database", features = ["test-support"] }
tempfile = "3"
vw-api-app-provider-base = { path = "../api-app-provider-base" }
