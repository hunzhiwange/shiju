[package]
name = "app-settings-store"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
hex = "0.4"
app-skills = { path = "../app-skills", version = "0.6.0" }
app-availability = { path = "../app-availability", version = "0.6.0" }
app-provider-validation = { path = "../app-provider-validation", version = "0.6.0" }
app-routing-policy = { path = "../app-routing-policy", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-app-failover = { path = "../api-app-failover", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0" }

[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.13", default-features = false }
sha2 = "0.11"
uuid = { version = "1.11", features = ["v4", "js"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
app-providers = { path = "../app-providers", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
tempfile = "3"
vw-api-app-provider-base = { path = "../api-app-provider-base", version = "0.6.0" }
