[package]
name = "app-uninstall"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
app-discovery = { path = "../app-discovery" }
app-lifecycle = { path = "../app-lifecycle" }
app-versions = { path = "../app-versions" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-operations = { path = "../api-app-operations" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
vw-api-types = { path = "../../vw-api-types" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
