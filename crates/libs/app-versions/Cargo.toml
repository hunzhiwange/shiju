[package]
name = "app-versions"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
semver = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
