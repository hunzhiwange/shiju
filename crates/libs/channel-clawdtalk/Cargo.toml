[package]
name = "channel-clawdtalk"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
channel-support = { path = "../channel-support", version = "0.6.0" }
channel-types = { path = "../channel-types", version = "0.6.0" }
config-channel-services = { path = "../config-channel-services", version = "0.6.0" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "test-util"] }
