[package]
name = "channel-dingtalk"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
agent-providers = { path = "../agent-providers", version = "0.6.0" }
channel-support = { path = "../channel-support", version = "0.6.0" }
channel-types = { path = "../channel-types", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
futures-util = "0.3.32"
reqwest = { version = "0.13", default-features = false, features = ["json", "socks", "gzip", "brotli", "deflate", "zstd", "http2", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
config-channel-services = { path = "../config-channel-services", version = "0.6.0" }
pulldown-cmark = "0.13"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
toml = "0.9"
