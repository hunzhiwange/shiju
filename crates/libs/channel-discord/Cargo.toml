[package]
name = "channel-discord"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-providers = { path = "../agent-providers", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
channel-types = { path = "../channel-types", version = "0.6.0" }
channel-support = { path = "../channel-support", version = "0.6.0" }
parking_lot = "0.12"
uuid = { version = "1.11", features = ["v4"] }
futures-util = "0.3.32"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "json", "rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync", "time"] }
