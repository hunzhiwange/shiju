[package]
name = "channel-email-channel"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
async-imap = { version = "0.11", features = ["runtime-tokio"], default-features = false }
async-trait = "0.1.89"
channel-types = { path = "../channel-types", version = "0.6.0" }
chrono = "0.4"
config-channel-services = { path = "../config-channel-services", version = "0.6.0" }
futures-util = "0.3.32"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "hostname", "pool", "rustls-tls"] }
mail-parser = "0.11"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1.14.0"
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }
webpki-roots = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
