[package]
name = "channel-irc"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
channel-types = { path = "../channel-types", version = "0.6.0" }
chrono = "0.4"
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
webpki-roots = "1.0"

[dev-dependencies]
config-channel-services = { path = "../config-channel-services", version = "0.6.0" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
toml = "0.9"
