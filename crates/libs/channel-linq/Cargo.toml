[package]
name = "channel-linq"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-providers = { path = "../agent-providers", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
channel-support = { path = "../channel-support", version = "0.6.0" }
channel-types = { path = "../channel-types", version = "0.6.0" }
chrono = "0.4"
hex = "0.4"
hmac = "0.13.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }
