[package]
name = "channel-mattermost"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-providers = { path = "../agent-providers" }
channel-support = { path = "../channel-support" }
channel-types = { path = "../channel-types" }
anyhow = "1"
async-trait = "0.1.89"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util", "test-util"] }
