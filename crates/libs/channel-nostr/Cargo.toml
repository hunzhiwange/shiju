[package]
name = "channel-nostr"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
channel-types = { path = "../channel-types" }
nostr = { version = "0.45.6", features = ["nip04", "nip59"] }
nostr-sdk = "0.45.6"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
