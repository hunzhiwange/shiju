[package]
name = "channel-nostr"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
channel-types = { path = "../channel-types", version = "0.6.0" }
nostr-sdk = { version = "0.37", features = ["nip04", "nip59"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
