[package]
name = "channel-qq"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
agent-providers = { path = "../agent-providers", version = "0.6.0" }
channel-support = { path = "../channel-support", version = "0.6.0" }
channel-types = { path = "../channel-types", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
futures-util = "0.3.32"
hex = "0.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
ring = "0.17.14"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }

[dev-dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
config-channel-services = { path = "../config-channel-services", version = "0.6.0" }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1.14.0"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
toml = "0.9"
