[package]
name = "channel-runtime"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
chrono-tz = "0.10"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
channel-types = { path = "../channel-types" }
channel-support = { path = "../channel-support" }
agent-async = { path = "../agent-async" }
agent-util = { path = "../agent-util" }
agent-health = { path = "../agent-health" }

agent-config = { path = "../agent-config" }
agent-providers = { path = "../agent-providers" }
model-types = { path = "../model-types" }
agent-loop = { path = "../agent-loop" }

agent-approval = { path = "../agent-approval" }
agent-memory = { path = "../agent-memory" }
agent-observability = { path = "../agent-observability" }
tool-types = { path = "../tool-types" }
agent-hooks = { path = "../agent-hooks" }
agent-runtime = { path = "../agent-runtime" }
runtime-types = { path = "../runtime-types" }
agent-skills = { path = "../agent-skills" }
agent-security = { path = "../agent-security" }
session-engine = { path = "../session-engine" }
agent-storage = { path = "../agent-storage" }
session-port = { path = "../session-port" }
tool-context = { path = "../tool-context" }
config-agent = { path = "../config-agent" }
config-agent-profile = { path = "../config-agent-profile" }
config-channels = { path = "../config-channels" }
vw-api-acp-model = { path = "../api-acp-model" }
vw-api-transport = { path = "../api-transport" }
agent-provider = { path = "../agent-provider" }
agent-project = { path = "../agent-project" }
session-info = { path = "../session-info" }
model-reasoning = { path = "../model-reasoning" }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }

[features]
default = []
test-support = ["dep:session-store", "dep:ordered-id", "dep:tempfile"]
channel-lark = ["dep:channel-lark"]
whatsapp-web = ["dep:channel-whatsapp-web", "channel-whatsapp-web/whatsapp-web"]

[dependencies.channel-clawdtalk]
path = "../channel-clawdtalk"

[dependencies.channel-lark]
path = "../channel-lark"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
channel-telegram = { path = "../channel-telegram" }
channel-discord = { path = "../channel-discord" }
channel-slack = { path = "../channel-slack" }
channel-mattermost = { path = "../channel-mattermost" }
channel-imessage = { path = "../channel-imessage" }
channel-signal = { path = "../channel-signal" }
channel-whatsapp = { path = "../channel-whatsapp" }
channel-wati = { path = "../channel-wati" }
channel-nextcloud-talk = { path = "../channel-nextcloud-talk" }
channel-email-channel = { path = "../channel-email-channel" }
channel-irc = { path = "../channel-irc" }
channel-linq = { path = "../channel-linq" }
channel-nostr = { path = "../channel-nostr" }
channel-dingtalk = { path = "../channel-dingtalk" }
channel-qq = { path = "../channel-qq" }
channel-wechat = { path = "../channel-wechat" }
channel-wecom = { path = "../channel-wecom" }
channel-whatsapp-web = { path = "../channel-whatsapp-web", optional = true }

[dev-dependencies]
model-selection = { path = "../model-selection" }
chrono = "0.4"
chrono-tz = "0.10"
config-channel-services = { path = "../config-channel-services" }
agent-approval = { path = "../agent-approval", features = ["test-support"] }
tempfile = "3"
channel-cli = { path = "../channel-cli" }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }

[dependencies.session-store]
path = "../session-store"
optional = true

[dependencies.ordered-id]
path = "../ordered-id"
optional = true

[dependencies.tempfile]
version = "3"
optional = true

[dependencies.agent-cli-types]
path = "../agent-cli-types"
