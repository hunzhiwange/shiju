[package]
name = "channel-signal"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
agent-providers = { path = "../agent-providers", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
channel-types = { path = "../channel-types", version = "0.6.0" }
futures-util = "0.3.32"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
