[package]
name = "channel-support"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-approval = { path = "../agent-approval" }
agent-observability = { path = "../agent-observability" }
agent-providers = { path = "../agent-providers" }
agent-hooks = { path = "../agent-hooks" }
tool-types = { path = "../tool-types" }
agent-storage = { path = "../agent-storage" }
session-info = { path = "../session-info" }
session-port = { path = "../session-port" }
sha2 = "0.11"
hex = "0.4"
agent-skills = { path = "../agent-skills" }
agent-memory = { path = "../agent-memory" }
agent-util = { path = "../agent-util" }
agent-provider = { path = "../agent-provider" }
chrono-tz = "0.10"
config-routing = { path = "../config-routing" }
model-selection = { path = "../model-selection" }
channel-types = { path = "../channel-types" }
agent-project = { path = "../agent-project" }
vw-api-transport = { path = "../api-transport" }
config-channels = { path = "../config-channels" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
agent-config = { path = "../agent-config" }
model-types = { path = "../model-types" }
secret-store = { path = "../secret-store" }
toml = "0.9"
anyhow = "1"
pulldown-cmark = "0.13"
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ordered-id = { path = "../ordered-id" }
message-types = { path = "../message-types" }
agent-database = { path = "../agent-database" }
session-store = { path = "../session-store" }
hostname = "0.4"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "time", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
config-agent = { path = "../config-agent" }
agent-database = { path = "../agent-database", features = ["test-support"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time", "test-util", "rt-multi-thread"] }

async-trait = "0.1"
tempfile = "3"
