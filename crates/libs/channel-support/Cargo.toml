[package]
name = "channel-support"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
model-types = { path = "../model-types", version = "0.6.0" }
secret-store = { path = "../secret-store", version = "0.6.0" }
toml = "0.9"
anyhow = "1"
pulldown-cmark = "0.13"
reqwest = { version = "0.13", default-features = false }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time", "test-util"] }
