[package]
name = "channel-telegram"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
base64 = "0.22"
image = "0.25.9"
parking_lot = "0.12"
rand = "0.10.3"
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream", "socks", "json", "gzip", "brotli", "deflate", "zstd", "http2", "rustls"] }
agent-config = { path = "../agent-config", version = "0.6.0" }
agent-providers = { path = "../agent-providers", version = "0.6.0" }
channel-support = { path = "../channel-support", version = "0.6.0" }
channel-types = { path = "../channel-types", version = "0.6.0" }
gateway-pairing = { path = "../gateway-pairing", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }

[dev-dependencies]
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
model-types = { path = "../model-types", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
agent-config = { path = "../agent-config", version = "0.6.0", features = ["test-support"] }
agent-multimodal = { path = "../agent-multimodal", version = "0.6.0" }
axum = { version = "0.8.8", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "test-util"] }
