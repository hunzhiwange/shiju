[package]
name = "channel-wechat"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
base64 = "0.23"
channel-support = { path = "../channel-support", version = "0.6.0" }
channel-types = { path = "../channel-types", version = "0.6.0" }
config-channel-services = { path = "../config-channel-services", version = "0.6.0" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }

[dev-dependencies]
pulldown-cmark = "0.13"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
