[package]
name = "channel-wecom"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
channel-support = { path = "../channel-support", version = "0.6.0" }
channel-types = { path = "../channel-types", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
futures-util = "0.3.32"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }

[dev-dependencies]
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "test-util"] }
