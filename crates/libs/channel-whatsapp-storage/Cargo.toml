[package]
name = "channel-whatsapp-storage"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
default = []
whatsapp-web = ["dep:anyhow", "dep:async-trait", "dep:chrono", "dep:parking_lot", "dep:prost", "dep:rusqlite", "dep:serde_json", "dep:wa-rs-binary", "dep:wa-rs-core", "dep:wa-rs-proto"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1.89", optional = true }
chrono = { version = "0.4", optional = true }
parking_lot = { version = "0.12", optional = true }
prost = { version = "0.14.3", optional = true }
serde_json = { version = "1", optional = true }
wa-rs-binary = { version = "0.2.0", optional = true }
wa-rs-core = { version = "0.2.0", optional = true }
wa-rs-proto = { version = "0.2.0", optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = { version = "0.37.0", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
