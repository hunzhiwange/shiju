[package]
name = "channel-whatsapp-web"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
default = []
whatsapp-web = ["dep:channel-whatsapp-storage", "channel-whatsapp-storage/whatsapp-web", "dep:chrono", "dep:parking_lot", "dep:qrcode", "dep:tracing", "dep:uuid", "dep:wa-rs", "dep:wa-rs-binary", "dep:wa-rs-core", "dep:wa-rs-proto", "dep:wa-rs-tokio-transport", "dep:wa-rs-ureq-http"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
async-trait = "0.1.89"
channel-types = { path = "../channel-types" }
channel-whatsapp-storage = { path = "../channel-whatsapp-storage", optional = true }
chrono = { version = "0.4", optional = true }
parking_lot = { version = "0.12", optional = true }
qrcode = { version = "0.14", optional = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "fs", "signal"] }
tracing = { version = "0.1", optional = true }
uuid = { version = "1.11", features = ["v4", "js"], optional = true }
wa-rs = { version = "0.2.0", optional = true, default-features = false, features = ["tokio-native", "tokio-transport", "ureq-client"] }
wa-rs-binary = { version = "0.2.0", optional = true }
wa-rs-core = { version = "0.2.0", optional = true }
wa-rs-proto = { version = "0.2.0", optional = true }
wa-rs-tokio-transport = { version = "0.2.0", optional = true }
wa-rs-ureq-http = { version = "0.2.0", optional = true }
