[package]
name = "cli-agent-session"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
config-agent = { path = "../config-agent", version = "0.6.0" }
cli-workspace-git = { path = "../cli-workspace-git", version = "0.6.0" }
config-gateway = { path = "../config-gateway", version = "0.6.0" }
vw-api-acp-model = { path = "../api-acp-model", version = "0.6.0" }
cli-gateway-transport = { path = "../cli-gateway-transport", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
cli-interaction = { path = "../cli-interaction", version = "0.6.0" }
cli-interaction-model = { path = "../cli-interaction-model", version = "0.6.0" }
vw-agent = { path = "../../vw-agent", version = "0.6.0", default-features = false }
vw-config-types = { path = "../../vw-config-types", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
vw-shared = { path = "../../vw-shared", version = "0.6.0" }

[dev-dependencies]
async-trait = "0.1.89"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
