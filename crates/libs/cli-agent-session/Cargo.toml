[package]
name = "cli-agent-session"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
cli-interaction = { path = "../cli-interaction", version = "0.6.0" }
cli-interaction-model = { path = "../cli-interaction-model", version = "0.6.0" }
cli-gateway-runtime = { path = "../cli-gateway-runtime", version = "0.6.0" }
vw-agent = { path = "../../vw-agent", version = "0.6.0", default-features = false }
vw-config-types = { path = "../../vw-config-types", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
vw-shared = { path = "../../vw-shared", version = "0.6.0" }

[dev-dependencies]
async-trait = "0.1.89"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
