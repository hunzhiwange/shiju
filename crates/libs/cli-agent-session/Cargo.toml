[package]
name = "cli-agent-session"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
runtime-types = { path = "../runtime-types" }
model-types = { path = "../model-types" }
session-ui-types = { path = "../session-ui-types" }
config-agent = { path = "../config-agent" }
cli-workspace-git = { path = "../cli-workspace-git" }
config-gateway = { path = "../config-gateway" }
vw-api-acp-model = { path = "../api-acp-model" }
cli-gateway-transport = { path = "../cli-gateway-transport" }
vw-api-transport = { path = "../api-transport" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
cli-interaction = { path = "../cli-interaction" }
cli-interaction-model = { path = "../cli-interaction-model" }
vw-agent = { path = "../../vw-agent", default-features = false }
vw-gateway-client = { path = "../../vw-gateway-client" }

[dev-dependencies]
async-trait = "0.1.89"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
