[package]
name = "cli-api-automation"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
gateway-task-pool = { path = "../gateway-task-pool" }
gateway-scheduler = { path = "../gateway-scheduler" }
gateway-workflow = { path = "../gateway-workflow" }
vw-api-workflow = { path = "../api-workflow" }
vw-api-agent-scheduler = { path = "../api-agent-scheduler" }
vw-api-task = { path = "../api-task" }
vw-api-task-lifecycle = { path = "../api-task-lifecycle" }
cli-api-core = { path = "../cli-api-core" }
vw-api-transport = { path = "../api-transport" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vw-gateway-client = { path = "../../vw-gateway-client" }
