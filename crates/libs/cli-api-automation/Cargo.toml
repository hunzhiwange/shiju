[package]
name = "cli-api-automation"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
gateway-scheduler = { path = "../gateway-scheduler", version = "0.6.0" }
gateway-workflow = { path = "../gateway-workflow", version = "0.6.0" }
vw-api-workflow = { path = "../api-workflow", version = "0.6.0" }
vw-api-agent-scheduler = { path = "../api-agent-scheduler", version = "0.6.0" }
vw-api-task = { path = "../api-task", version = "0.6.0" }
vw-api-task-lifecycle = { path = "../api-task-lifecycle", version = "0.6.0" }
cli-api-core = { path = "../cli-api-core", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
