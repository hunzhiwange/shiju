[package]
name = "cli-bootstrap"
version.workspace = true
edition = "2024"
license = "MIT"
description = "CLI process initialization and command dispatch"

[dependencies]
agent-service = { path = "../agent-service" }
agent-migration = { path = "../agent-migration" }
agent-integrations = { path = "../agent-integrations" }
app-self-update = { path = "../app-self-update" }
runtime-log = { path = "../runtime-log" }
config-agent = { path = "../config-agent" }
cli-runtime-status = { path = "../cli-runtime-status" }
cli-security-commands = { path = "../cli-security-commands" }
cli-task-commands = { path = "../cli-task-commands" }
cli-command-schema = { path = "../cli-command-schema" }
cli-gateway-process = { path = "../cli-gateway-process" }
cli-agent-session = { path = "../cli-agent-session" }
cli-gateway-commands = { path = "../cli-gateway-commands" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
schemars = "1.2"
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "fmt", "ansi"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
vw-agent = { path = "../../vw-agent", default-features = false }
acp-server = { path = "../acp-server" }

[dev-dependencies]
async-trait = "0.1.89"
tempfile = "3"

[features]
employee-acp-test-support = ["acp-server/employee-acp-test-support", "vw-agent/employee-acp-test-support"]
default = ["agent-defaults", "memory-postgres", "memory-mariadb", "channel-lark"]
agent-defaults = [
  "vw-agent/rag-pdf",
  "vw-agent/firecrawl",
  "vw-agent/web-fetch-html2md",
  "vw-agent/web-fetch-plaintext",
  "vw-agent/shell-ast",
]
memory-postgres = ["vw-agent/memory-postgres"]
memory-mariadb = ["vw-agent/memory-mariadb"]
channel-lark = ["vw-agent/channel-lark"]
