[package]
name = "cli-bootstrap"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "CLI process initialization and command dispatch"

[dependencies]
runtime-log = { path = "../runtime-log", version = "0.6.0" }
config-agent = { path = "../config-agent", version = "0.6.0" }
cli-runtime-status = { path = "../cli-runtime-status", version = "0.6.0" }
cli-security-commands = { path = "../cli-security-commands", version = "0.6.0" }
cli-task-commands = { path = "../cli-task-commands", version = "0.6.0" }
cli-command-schema = { path = "../cli-command-schema", version = "0.6.0" }
cli-gateway-process = { path = "../cli-gateway-process", version = "0.6.0" }
cli-agent-session = { path = "../cli-agent-session", version = "0.6.0" }
cli-gateway-commands = { path = "../cli-gateway-commands", version = "0.6.0" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
schemars = "1.2"
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "fmt", "ansi"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
vw-agent = { path = "../../vw-agent", version = "0.6.0", default-features = false }
acp-server = { path = "../acp-server", version = "0.6.0" }
vw-shared = { path = "../../vw-shared", version = "0.6.0" }

[dev-dependencies]
async-trait = "0.1.89"
tempfile = "3"

[features]
default = ["agent-defaults", "memory-postgres", "memory-mariadb", "channel-lark"]
agent-defaults = [
  "vw-agent/rag-pdf",
  "vw-agent/firecrawl",
  "vw-agent/web-fetch-html2md",
  "vw-agent/web-fetch-plaintext",
  "vw-agent/shell-ast",
]
memory-postgres = ["vw-agent/memory-postgres"]
memory-mariadb = ["vw-agent/memory-mariadb"]
channel-lark = ["vw-agent/channel-lark"]
