[package]
name = "cli-gateway-automation"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-cron = { path = "../gateway-cron", version = "0.6.0" }
gateway-scheduler = { path = "../gateway-scheduler", version = "0.6.0" }
gateway-workflow = { path = "../gateway-workflow", version = "0.6.0" }
vw-api-workflow = { path = "../api-workflow", version = "0.6.0" }
vw-api-agent-scheduler = { path = "../api-agent-scheduler", version = "0.6.0" }
cli-gateway-transport = { path = "../cli-gateway-transport", version = "0.6.0" }
cli-interaction-model = { path = "../cli-interaction-model", version = "0.6.0" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
