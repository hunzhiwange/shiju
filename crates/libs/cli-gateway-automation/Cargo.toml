[package]
name = "cli-gateway-automation"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-cron = { path = "../gateway-cron" }
gateway-scheduler = { path = "../gateway-scheduler" }
gateway-workflow = { path = "../gateway-workflow" }
vw-api-workflow = { path = "../api-workflow" }
vw-api-agent-scheduler = { path = "../api-agent-scheduler" }
cli-gateway-transport = { path = "../cli-gateway-transport" }
cli-interaction-model = { path = "../cli-interaction-model" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
vw-gateway-client = { path = "../../vw-gateway-client" }
