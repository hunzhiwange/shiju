[package]
name = "cli-gateway-capabilities"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
gateway-interaction = { path = "../gateway-interaction" }
gateway-mcp = { path = "../gateway-mcp" }
vw-api-mcp-inspect = { path = "../api-mcp-inspect" }
model-types = { path = "../model-types" }
model-reasoning = { path = "../model-reasoning" }
gateway-model-provider = { path = "../gateway-model-provider" }
cli-gateway-transport = { path = "../cli-gateway-transport" }
gateway-config = { path = "../gateway-config" }
cli-interaction-model = { path = "../cli-interaction-model" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
vw-gateway-client = { path = "../../vw-gateway-client" }
vw-tui = { path = "../../vw-tui" }
