[package]
name = "cli-gateway-commands"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vw-config-types = { path = "../../vw-config-types", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
vw-shared = { path = "../../vw-shared", version = "0.6.0" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
