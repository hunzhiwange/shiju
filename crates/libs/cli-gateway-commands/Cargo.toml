[package]
name = "cli-gateway-commands"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
cli-api-system = { path = "../cli-api-system" }
cli-api-automation = { path = "../cli-api-automation" }
cli-api-session = { path = "../cli-api-session" }
cli-api-workspace = { path = "../cli-api-workspace" }
cli-api-core = { path = "../cli-api-core" }
vw-api-transport = { path = "../api-transport" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vw-gateway-client = { path = "../../vw-gateway-client" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
