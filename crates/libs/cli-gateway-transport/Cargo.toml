[package]
name = "cli-gateway-transport"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-task = { path = "../api-task", version = "0.6.0" }
vw-api-project = { path = "../api-project", version = "0.6.0" }
todo-types = { path = "../todo-types", version = "0.6.0" }
vw-api-session = { path = "../api-session", version = "0.6.0" }
gateway-session = { path = "../gateway-session", version = "0.6.0" }
question-types = { path = "../question-types", version = "0.6.0" }
config-gateway = { path = "../config-gateway", version = "0.6.0" }
gateway-project = { path = "../gateway-project", version = "0.6.0" }
gateway-config = { path = "../gateway-config", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
cli-interaction-model = { path = "../cli-interaction-model", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
vw-shared = { path = "../../vw-shared", version = "0.6.0" }
vw-config-types = { path = "../../vw-config-types", version = "0.6.0" }

[dev-dependencies]
tempfile = "3"
