[package]
name = "cli-security-commands"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
cli-command-schema = { path = "../cli-command-schema", version = "0.6.0" }
dialoguer = "0.11"
vw-agent = { path = "../../vw-agent", version = "0.6.0", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
