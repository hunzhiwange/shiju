[package]
name = "computer-control"
version = "0.6.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "shiju-computer-use"
path = "src/bin/shiju-computer-use.rs"

[lib]
doctest = false

[dependencies]
tempfile = "3"
hex = "0.4"
getrandom = "0.4"
vw-api-computer-control = { path = "../api-computer-control", version = "0.6.0" }
config-computer-control = { path = "../config-computer-control", version = "0.6.0" }
office-control-sessions = { path = "../office-control-sessions", version = "0.6.0" }
async-trait = "0.1.89"
base64 = "0.23"
image = "0.25.9"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7.18", features = ["compat"] }
url = "2"
uuid = { version = "1.11", features = ["v4", "js"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
futures-util = "0.3.32"
rustls-pki-types = "1.14.0"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["net", "process"] }

[target.'cfg(unix)'.dependencies]
gateway-pairing = { path = "../gateway-pairing", version = "0.6.0" }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
