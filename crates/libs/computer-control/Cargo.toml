[package]
name = "computer-control"
version = "0.7.10"
edition = "2024"
license = "MIT"

[[bin]]
name = "shiju-computer-use"
path = "src/bin/shiju-computer-use.rs"

[features]
test-support = []

[lib]
doctest = false

[dependencies]
tempfile = "3"
hex = "0.4"
getrandom = "0.4"
vw-api-computer-control = { path = "../api-computer-control" }
config-computer-control = { path = "../config-computer-control" }
async-trait = "0.1.89"
base64 = "0.23"
image = "0.25.9"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7.18"
uuid = { version = "1.11", features = ["v4", "js"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["net", "process"] }

[target.'cfg(unix)'.dependencies]
gateway-pairing = { path = "../gateway-pairing" }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
