[package]
name = "desktop-account-ui"
version = "0.7.10"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
iced = { version = "0.14", features = ["svg", "advanced", "tokio"] }
web-time = "1"
chrono = "0.4"
desktop-account = { path = "../desktop-account" }
desktop-skill-hub = { path = "../desktop-skill-hub" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-i18n = { path = "../desktop-i18n" }
config-ui = { path = "../config-ui" }
gateway-shiju-account = { path = "../gateway-shiju-account" }

[dev-dependencies]
iced = { version = "0.14", features = ["tiny-skia"] }
desktop-assets = { path = "../desktop-assets" }
iced_runtime = "0.14"
tempfile = "3"
serde_json = "1"
image = "0.25.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

desktop-account = { path = "../desktop-account", features = ["test-support"] }

[dependencies.vw-gateway-client]
path = "../../vw-gateway-client"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
open = "5"
directories = "5"
tokio = { version = "1", features = ["time"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
