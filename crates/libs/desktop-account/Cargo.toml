[package]
name = "desktop-account"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
# Existing desktop integration tests construct verified fixtures without a gateway.
test-support = []

[dependencies]
desktop-i18n = { path = "../desktop-i18n" }
vw-gateway-client = { path = "../../vw-gateway-client" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[dev-dependencies]
tempfile = "3"
