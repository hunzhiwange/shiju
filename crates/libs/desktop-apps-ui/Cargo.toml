[package]
name = "desktop-apps-ui"
version = "0.6.0"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
desktop-provider-apps = { path = "../desktop-provider-apps", version = "0.6.0" }
iced = { version = "0.14", features = ["image", "svg", "advanced", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "fs"] }
gateway-openclaw-settings = { path = "../gateway-openclaw-settings", version = "0.6.0" }
gateway-workspace-memory = { path = "../gateway-workspace-memory", version = "0.6.0" }
vw-api-openclaw-settings = { path = "../api-openclaw-settings", version = "0.6.0" }
vw-api-workspace-memory = { path = "../api-workspace-memory", version = "0.6.0" }
vw-api-task = { path = "../api-task", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-app-aggregation = { path = "../api-app-aggregation", version = "0.6.0" }
gateway-aggregation-native = { path = "../gateway-aggregation-native", version = "0.6.0" }
gateway-app-settings = { path = "../gateway-app-settings", version = "0.6.0" }
gateway-aggregation-omo = { path = "../gateway-aggregation-omo", version = "0.6.0" }
vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }
serde_json = "1"
gateway-external-session = { path = "../gateway-external-session", version = "0.6.0" }
vw-api-external-session = { path = "../api-external-session", version = "0.6.0" }
vw-api-app-diagnostics = { path = "../api-app-diagnostics", version = "0.6.0" }
vw-api-app-provider-edit = { path = "../api-app-provider-edit", version = "0.6.0" }
gateway-app-diagnostics = { path = "../gateway-app-diagnostics", version = "0.6.0" }
rand = "0.10.3"
rfd = { version = "0.17", features = ["file-handle-inner"] }
url = "2"
local-app-auth = { path = "../local-app-auth", version = "0.6.0" }
desktop-config = { path = "../desktop-config", version = "0.6.0" }
image = "0.25.9"
[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
serde_json = "1"
iced_runtime = "0.14"
image = "0.25.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
