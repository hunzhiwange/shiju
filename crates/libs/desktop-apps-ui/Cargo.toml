[package]
name = "desktop-apps-ui"
version.workspace = true
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
gateway-aggregation-codex = { path = "../gateway-aggregation-codex" }
serde_yaml = "0.9"
gateway-app-provider = { path = "../gateway-app-provider" }
gateway-http = { path = "../gateway-http" }
vw-api-app-provider-terminal = { path = "../api-app-provider-terminal" }
serde = { version = "1", features = ["derive"] }
desktop-assets = { path = "../desktop-assets" }
desktop-provider-apps = { path = "../desktop-provider-apps" }
iced = { version = "0.14", features = ["image", "svg", "advanced", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "fs"] }
gateway-openclaw-settings = { path = "../gateway-openclaw-settings" }
gateway-workspace-memory = { path = "../gateway-workspace-memory" }
vw-api-openclaw-settings = { path = "../api-openclaw-settings" }
vw-api-workspace-memory = { path = "../api-workspace-memory" }
vw-api-task = { path = "../api-task" }
vw-api-transport = { path = "../api-transport" }
vw-gateway-client = { path = "../../vw-gateway-client" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-aggregation = { path = "../api-app-aggregation" }
gateway-aggregation-native = { path = "../gateway-aggregation-native" }
gateway-app-settings = { path = "../gateway-app-settings" }
gateway-aggregation-omo = { path = "../gateway-aggregation-omo" }
vw-api-chat-identity = { path = "../api-chat-identity" }
serde_json = "1"
gateway-external-session = { path = "../gateway-external-session" }
vw-api-external-session = { path = "../api-external-session" }
vw-api-app-diagnostics = { path = "../api-app-diagnostics" }
vw-api-app-provider-edit = { path = "../api-app-provider-edit" }
gateway-app-diagnostics = { path = "../gateway-app-diagnostics" }
rand = "0.10.3"
rfd = { version = "0.17", features = ["file-handle-inner"] }
url = "2"
local-app-auth = { path = "../local-app-auth" }
desktop-config = { path = "../desktop-config" }
image = "0.25.9"
gateway-hermes-memory = { path = "../gateway-hermes-memory" }
vw-api-hermes-memory = { path = "../api-hermes-memory" }
vw-api-hermes-dashboard = { path = "../api-hermes-dashboard" }
vw-api-app-failover = { path = "../api-app-failover" }
vw-api-mcp-management = { path = "../api-mcp-management" }
desktop-settings-account = { path = "../desktop-settings-account" }
gateway-app-auth = { path = "../gateway-app-auth" }
gateway-app-routing = { path = "../gateway-app-routing" }
vw-api-app-routing = { path = "../api-app-routing" }
vw-api-app-auth = { path = "../api-app-auth" }
gateway-aggregation = { path = "../gateway-aggregation" }
vw-api-app-provider-base = { path = "../api-app-provider-base" }
gateway-endpoint = { path = "../gateway-endpoint" }
toml_edit = "0.22"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
gateway-mcp-probe = { path = "../gateway-mcp-probe" }
gateway-app-failover = { path = "../gateway-app-failover" }
desktop-app-launch = { path = "../desktop-app-launch" }
desktop-account = { path = "../desktop-account" }
desktop-skill-hub = { path = "../desktop-skill-hub" }
desktop-i18n = { path = "../desktop-i18n" }
gateway-shiju-app = { path = "../gateway-shiju-app" }
gateway-shiju-account = { path = "../gateway-shiju-account" }
web-time = "1"
[dev-dependencies]
desktop-account = { path = "../desktop-account", features = ["test-support"] }
urlencoding = "2"
vw-api-app-provider-profiles = { path = "../api-app-provider-profiles" }
vw-api-app-provider-extended = { path = "../api-app-provider-extended" }
vw-api-model-catalog = { path = "../api-model-catalog" }

toml = "0.9"
desktop-chat-view = { path = "../desktop-chat-view" }
desktop-settings-providers = { path = "../desktop-settings-providers" }
config-ui = { path = "../config-ui" }

iced = { version = "0.14", features = ["tiny-skia"] }
serde_json = "1"
iced_runtime = "0.14"
image = "0.25.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-web-runtime = { path = "../desktop-web-runtime" }

[target.'cfg(all(not(target_arch = "wasm32"), not(windows)))'.dependencies]
open = "5"

[target.'cfg(windows)'.dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }
