[package]
name = "desktop-assets"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "advanced"] }
include_dir = "0.7"
once_cell = "1"
parking_lot = "0.12"
resvg = "0.46.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11.4"

[build-dependencies]
serde_json = "1"
