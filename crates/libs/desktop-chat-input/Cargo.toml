[package]
name = "desktop-chat-input"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "advanced"] }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }

desktop-settings-providers = { path = "../desktop-settings-providers", version = "0.6.0" }

vw-api-acp-model = { path = "../api-acp-model", version = "0.6.0" }

session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
session-info = { path = "../session-info", version = "0.6.0" }
desktop-chat-tools = { path = "../desktop-chat-tools", version = "0.6.0" }
serde_json = "1"

desktop-editor = { path = "../desktop-editor", version = "0.6.0" }

config-ui = { path = "../config-ui", version = "0.6.0" }
vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }
model-reasoning = { path = "../model-reasoning", version = "0.6.0" }

desktop-session = { path = "../desktop-session", version = "0.6.0" }
desktop-task-model = { path = "../desktop-task-model", version = "0.6.0" }
desktop-theme = { path = "../desktop-theme", version = "0.6.0" }
desktop-chat-view = { path = "../desktop-chat-view", version = "0.6.0" }

todo-types = { path = "../todo-types", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-skill-hub = { path = "../desktop-skill-hub", version = "0.6.0" }

desktop-voice-ui = { path = "../desktop-voice-ui", version = "0.6.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
image = "0.25"
model-state = { path = "../model-state", version = "0.6.0" }
model-catalog-types = { path = "../model-catalog-types", version = "0.6.0" }
