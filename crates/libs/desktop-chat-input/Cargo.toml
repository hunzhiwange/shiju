[package]
name = "desktop-chat-input"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-media = { path = "../api-media" }
iced = { version = "0.14", features = ["image", "svg", "advanced"] }
desktop-assets = { path = "../desktop-assets" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-ui-controls = { path = "../desktop-ui-controls" }

desktop-settings-providers = { path = "../desktop-settings-providers" }

vw-api-acp-model = { path = "../api-acp-model" }

session-ui-types = { path = "../session-ui-types" }
session-info = { path = "../session-info" }
desktop-chat-tools = { path = "../desktop-chat-tools" }
serde_json = "1"

desktop-editor = { path = "../desktop-editor" }

config-ui = { path = "../config-ui" }
vw-api-chat-identity = { path = "../api-chat-identity" }
model-reasoning = { path = "../model-reasoning" }

desktop-session = { path = "../desktop-session" }
desktop-task-model = { path = "../desktop-task-model" }
desktop-theme = { path = "../desktop-theme" }
desktop-chat-view = { path = "../desktop-chat-view" }

todo-types = { path = "../todo-types" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-skill-hub = { path = "../desktop-skill-hub" }

desktop-voice-ui = { path = "../desktop-voice-ui" }

[dev-dependencies]
iced_runtime = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
image = "0.25"
model-state = { path = "../model-state" }
model-catalog-types = { path = "../model-catalog-types" }
