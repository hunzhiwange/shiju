[package]
name = "desktop-chat-view"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-file-tree = { path = "../desktop-file-tree", version = "0.6.0" }
directories = "6"
gateway-chat-stream = { path = "../gateway-chat-stream", version = "0.6.0" }
question-types = { path = "../question-types", version = "0.6.0" }
runtime-time = { path = "../runtime-time", version = "0.6.0" }
iced = { version = "0.14", features = ["image", "svg", "advanced"] }
serde_json = "1"
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
desktop-chat-tools = { path = "../desktop-chat-tools", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
desktop-session = { path = "../desktop-session", version = "0.6.0" }
session-info = { path = "../session-info", version = "0.6.0" }

gateway-interaction = { path = "../gateway-interaction", version = "0.6.0" }

pulldown-cmark = "0.13.4"
regex = "1"
url = "2"
urlencoding = "2.1"

session-text = { path = "../session-text", version = "0.6.0" }
once_cell = "1"
todo-types = { path = "../todo-types", version = "0.6.0" }

web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }

[dev-dependencies]
iced_runtime = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
image = "0.25.9"
desktop-settings-agents = { path = "../desktop-settings-agents", version = "0.6.0" }
desktop-settings-skills = { path = "../desktop-settings-skills", version = "0.6.0" }
config-agent = { path = "../config-agent", version = "0.6.0" }
config-agent-profile = { path = "../config-agent-profile", version = "0.6.0" }
