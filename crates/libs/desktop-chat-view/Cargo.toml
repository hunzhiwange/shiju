[package]
name = "desktop-chat-view"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-file-tree = { path = "../desktop-file-tree" }
directories = "6"
gateway-chat-stream = { path = "../gateway-chat-stream" }
question-types = { path = "../question-types" }
runtime-time = { path = "../runtime-time" }
iced = { version = "0.14", features = ["image", "svg", "advanced"] }
serde_json = "1"
desktop-assets = { path = "../desktop-assets" }
desktop-chat-tools = { path = "../desktop-chat-tools" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-i18n = { path = "../desktop-i18n" }
config-ui = { path = "../config-ui" }
session-ui-types = { path = "../session-ui-types" }
desktop-session = { path = "../desktop-session" }
session-info = { path = "../session-info" }

gateway-interaction = { path = "../gateway-interaction" }

pulldown-cmark = "0.13.4"
regex = "1"
url = "2"
urlencoding = "2.1"

session-text = { path = "../session-text" }
once_cell = "1"
todo-types = { path = "../todo-types" }

web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt"] }
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }

[dev-dependencies]
desktop-web-runtime = { path = "../desktop-web-runtime" }
iced_runtime = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
image = "0.25.9"
desktop-settings-agents = { path = "../desktop-settings-agents" }
desktop-settings-skills = { path = "../desktop-settings-skills" }
config-agent = { path = "../config-agent" }
config-agent-profile = { path = "../config-agent-profile" }
