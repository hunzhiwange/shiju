[package]
name = "desktop-config"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
gateway-interaction = { path = "../gateway-interaction" }
gateway-cron = { path = "../gateway-cron" }
gateway-mcp = { path = "../gateway-mcp" }
vw-api-mcp-inspect = { path = "../api-mcp-inspect" }
config-ui = { path = "../config-ui" }
config-gateway = { path = "../config-gateway" }
config-runtime-paths = { path = "../config-runtime-paths" }
build-identity = { path = "../build-identity" }
vw-api-transport = { path = "../api-transport" }
config-observability = { path = "../config-observability" }
config-hooks = { path = "../config-hooks" }
config-automation = { path = "../config-automation" }
config-reliability = { path = "../config-reliability" }
config-runtime = { path = "../config-runtime" }
config-skills = { path = "../config-skills" }
config-agent = { path = "../config-agent" }
gateway-config = { path = "../gateway-config" }
gateway-http = { path = "../gateway-http" }
gateway-endpoint = { path = "../gateway-endpoint" }
vw-config-types = { path = "../../vw-config-types" }
vw-gateway-client = { path = "../../vw-gateway-client" }
iced = { version = "0.14", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
config-tools = { path = "../config-tools" }
vw-api-chat-identity = { path = "../api-chat-identity" }
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
url = "2"
directories = "5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "io-util", "sync"] }

[dev-dependencies]
iced_runtime = "0.14"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
