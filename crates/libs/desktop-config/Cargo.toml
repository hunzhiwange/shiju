[package]
name = "desktop-config"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-mcp-inspect = { path = "../api-mcp-inspect", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
config-gateway = { path = "../config-gateway", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
build-identity = { path = "../build-identity", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
config-observability = { path = "../config-observability", version = "0.6.0" }
config-hooks = { path = "../config-hooks", version = "0.6.0" }
config-automation = { path = "../config-automation", version = "0.6.0" }
config-reliability = { path = "../config-reliability", version = "0.6.0" }
config-runtime = { path = "../config-runtime", version = "0.6.0" }
config-skills = { path = "../config-skills", version = "0.6.0" }
config-agent = { path = "../config-agent", version = "0.6.0" }
gateway-config = { path = "../gateway-config", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-config-types = { path = "../../vw-config-types", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
iced = { version = "0.14", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
config-tools = { path = "../config-tools", version = "0.6.0" }
vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
url = "2"
directories = "5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "io-util", "sync"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
