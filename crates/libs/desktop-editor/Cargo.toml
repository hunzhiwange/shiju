[package]
name = "desktop-editor"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["svg", "image", "advanced", "highlighter", "markdown"] }
iced-code-editor = { git = "https://github.com/doyouhaobaby/iced-code-editor.git", tag = "v0.5.6" }
config-ui = { path = "../config-ui", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
serde_json = "1"
unicode-width = "0.2"
tracing = "0.1"

serde = { version = "1", features = ["derive"] }
desktop-config = { path = "../desktop-config", version = "0.6.0" }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
gateway-desktop-settings = { path = "../gateway-desktop-settings", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-lsp = { path = "../desktop-lsp", version = "0.6.0" }
tokio = { version = "1", default-features = false, features = ["sync"] }
