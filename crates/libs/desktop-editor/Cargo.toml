[package]
name = "desktop-editor"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["svg", "advanced", "highlighter", "markdown"] }
iced-code-editor = { git = "https://github.com/doyouhaobaby/iced-code-editor.git", tag = "v0.5.6" }
config-ui = { path = "../config-ui", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
serde_json = "1"
unicode-width = "0.2"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-lsp = { path = "../desktop-lsp", version = "0.6.0" }
