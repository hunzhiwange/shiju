[package]
name = "desktop-editor"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-files = { path = "../gateway-files" }
preview-content = { path = "../preview-content" }
iced = { version = "0.14", features = ["svg", "image", "advanced", "highlighter", "markdown"] }
iced-code-editor = { git = "https://github.com/doyouhaobaby/iced-code-editor.git", tag = "v0.5.6", features = ["two-face"] }
config-ui = { path = "../config-ui" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-assets = { path = "../desktop-assets" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
serde_json = "1"
unicode-width = "0.2"
tracing = "0.1"

serde = { version = "1", features = ["derive"] }
desktop-config = { path = "../desktop-config" }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
vw-gateway-client = { path = "../../vw-gateway-client" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-lsp = { path = "../desktop-lsp" }
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
iced_runtime = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
