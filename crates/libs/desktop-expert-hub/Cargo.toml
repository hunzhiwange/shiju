[package]
name = "desktop-expert-hub"
version = "0.6.0"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
gateway-skill-market = { path = "../gateway-skill-market", version = "0.6.0" }
gateway-desktop-settings = { path = "../gateway-desktop-settings", version = "0.6.0" }
gateway-shiju-knowledge = { path = "../gateway-shiju-knowledge", version = "0.6.0" }
gateway-shiju-connector = { path = "../gateway-shiju-connector", version = "0.6.0" }
desktop-account = { path = "../desktop-account", version = "0.6.0" }
gateway-shiju-skill = { path = "../gateway-shiju-skill", version = "0.6.0" }
gateway-shiju-account = { path = "../gateway-shiju-account", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
open = "5"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }

desktop-skill-hub = { path = "../desktop-skill-hub", version = "0.6.0" }
directories = "5"
tempfile = "3"
gateway-knowledge = { path = "../gateway-knowledge", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
vw-api-knowledge = { path = "../api-knowledge", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
iced = { version = "0.14", features = ["advanced", "tokio", "markdown", "svg"] }
serde_json = "1"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.23"
rfd = { version = "0.17", features = ["file-handle-inner"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["stream"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
iced = { version = "0.14", features = ["tiny-skia"] }
iced_runtime = "0.14"
