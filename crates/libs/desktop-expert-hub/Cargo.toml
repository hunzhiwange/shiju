[package]
name = "desktop-expert-hub"
version.workspace = true
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
desktop-chat-input = { path = "../desktop-chat-input" }
desktop-chat-view = { path = "../desktop-chat-view" }
chrono = "0.4"

desktop-app-launch = { path = "../desktop-app-launch" }
desktop-apps-ui = { path = "../desktop-apps-ui" }
gateway-shiju-app = { path = "../gateway-shiju-app" }
config-runtime-paths = { path = "../config-runtime-paths" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-assets = { path = "../desktop-assets" }
gateway-skill-market = { path = "../gateway-skill-market" }
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
gateway-shiju-knowledge = { path = "../gateway-shiju-knowledge" }
gateway-shiju-connector = { path = "../gateway-shiju-connector" }
desktop-account = { path = "../desktop-account" }
gateway-shiju-skill = { path = "../gateway-shiju-skill" }
gateway-shiju-account = { path = "../gateway-shiju-account" }
config-ui = { path = "../config-ui" }
open = "5"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }

desktop-skill-hub = { path = "../desktop-skill-hub" }
directories = "5"
tempfile = "3"
gateway-knowledge = { path = "../gateway-knowledge" }
gateway-http = { path = "../gateway-http" }
vw-api-knowledge = { path = "../api-knowledge" }
desktop-i18n = { path = "../desktop-i18n" }
iced = { version = "0.14", features = ["advanced", "tokio", "markdown", "svg"] }
serde_json = "1"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.23"
rfd = { version = "0.17", features = ["file-handle-inner"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["stream"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
vw-gateway-client = { path = "../../vw-gateway-client" }
image = "0.25"
urlencoding = "2.1"
tokio = { version = "1", features = ["macros", "rt"] }
iced = { version = "0.14", features = ["tiny-skia"] }
iced_runtime = "0.14"
