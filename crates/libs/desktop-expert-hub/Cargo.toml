[package]
name = "desktop-expert-hub"
version = "0.6.0"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
gateway-knowledge = { path = "../gateway-knowledge", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
vw-api-knowledge = { path = "../api-knowledge", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
iced = { version = "0.14", features = ["advanced", "tokio"] }
serde_json = "1"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.23"
rfd = { version = "0.17", features = ["file-handle-inner"] }
tokio = { version = "1", features = ["time", "fs"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
iced_runtime = "0.14"
