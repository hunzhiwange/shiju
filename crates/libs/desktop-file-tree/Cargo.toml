[package]
name = "desktop-file-tree"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["svg", "advanced"] }
config-ui = { path = "../config-ui" }
desktop-assets = { path = "../desktop-assets" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
vw-api-file = { path = "../api-file" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSWindow", "NSView"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
iced_runtime = "0.14"
image = "0.25.9"
