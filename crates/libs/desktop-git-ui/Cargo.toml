[package]
name = "desktop-git-ui"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-chat-view = { path = "../desktop-chat-view", version = "0.6.0" }
iced = { version = "0.14", features = ["advanced", "svg"] }
similar = "2"
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
desktop-git = { path = "../desktop-git", version = "0.6.0" }
vw-api-git = { path = "../api-git", version = "0.6.0" }

chrono = "0.4"
unicode-width = "0.2"

iced-code-editor = { git = "https://github.com/doyouhaobaby/iced-code-editor.git", tag = "v0.5.6", features = ["lsp-process"] }
web-time = "1.1.0"
desktop-workspace = { path = "../desktop-workspace", version = "0.6.0" }
gateway-project = { path = "../gateway-project", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
vw-api-project = { path = "../api-project", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }

[dev-dependencies]
session-info = { path = "../session-info", version = "0.6.0" }
iced_runtime = "0.14"
image = "0.25.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
