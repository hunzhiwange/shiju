[package]
name = "desktop-i18n"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
session-text = { path = "../session-text", version = "0.6.0" }
serde = "1"
serde_json = "1"
vw-shared = { path = "../../vw-shared", version = "0.6.0" }
once_cell = "1"
time = { version = "0.3", features = ["formatting"] }
iced-code-editor = { git = "https://github.com/doyouhaobaby/iced-code-editor.git", tag = "v0.5.6", features = ["lsp-process"] }

[dev-dependencies]
regex = "1"
