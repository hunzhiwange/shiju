[package]
name = "desktop-lsp"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-i18n = { path = "../desktop-i18n" }
shell-command = { path = "../shell-command", features = ["shell-tokio"] }
iced-code-editor = { workspace = true, features = ["lsp-process"] }
preview-content = { path = "../preview-content" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["process", "rt", "time"] }
walkdir = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
