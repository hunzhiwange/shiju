[package]
name = "desktop-lsp"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
shell-command = { path = "../shell-command", version = "0.6.0", features = ["shell-tokio"] }
iced-code-editor = { git = "https://github.com/doyouhaobaby/iced-code-editor.git", tag = "v0.5.6", features = ["lsp-process"] }
preview-content = { path = "../preview-content", version = "0.6.0" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["process", "time"] }
walkdir = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
