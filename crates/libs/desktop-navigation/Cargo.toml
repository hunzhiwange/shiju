[package]
name = "desktop-navigation"
version.workspace = true
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
desktop-chat-input = { path = "../desktop-chat-input" }
desktop-workspace = { path = "../desktop-workspace" }
desktop-platform = { path = "../desktop-platform" }
serde_json = "1"
desktop-settings-network = { path = "../desktop-settings-network" }
desktop-settings-skills = { path = "../desktop-settings-skills" }
iced = { version = "0.14", features = ["image", "svg", "advanced", "canvas"] }
desktop-assets = { path = "../desktop-assets" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
config-ui = { path = "../config-ui" }
web-time = "1"
time = { version = "0.3", features = ["formatting"] }
desktop-settings-providers = { path = "../desktop-settings-providers" }
desktop-update = { path = "../desktop-update" }
desktop-release = { path = "../desktop-release" }
update-types = { path = "../update-types" }
desktop-editor = { path = "../desktop-editor" }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-web-install = { path = "../desktop-web-install" }

[dev-dependencies]
desktop-session = { path = "../desktop-session" }
iced_runtime = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
image = "0.25.9"
desktop-settings-appearance = { path = "../desktop-settings-appearance" }
