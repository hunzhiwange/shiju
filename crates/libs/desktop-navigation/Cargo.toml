[package]
name = "desktop-navigation"
version = "0.6.0"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
desktop-settings-shell = { path = "../desktop-settings-shell", version = "0.6.0" }
desktop-chat-input = { path = "../desktop-chat-input", version = "0.6.0" }
desktop-workspace = { path = "../desktop-workspace", version = "0.6.0" }
desktop-platform = { path = "../desktop-platform", version = "0.6.0" }
serde_json = "1"
desktop-settings-network = { path = "../desktop-settings-network", version = "0.6.0" }
desktop-settings-skills = { path = "../desktop-settings-skills", version = "0.6.0" }
iced = { version = "0.14", features = ["image", "svg", "advanced", "canvas"] }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
web-time = "1"
time = { version = "0.3", features = ["formatting"] }
desktop-settings-providers = { path = "../desktop-settings-providers", version = "0.6.0" }
desktop-update = { path = "../desktop-update", version = "0.6.0" }
desktop-release = { path = "../desktop-release", version = "0.6.0" }
update-types = { path = "../update-types", version = "0.6.0" }
desktop-editor = { path = "../desktop-editor", version = "0.6.0" }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-web-install = { path = "../desktop-web-install", version = "0.6.0" }

[dev-dependencies]
iced_runtime = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
