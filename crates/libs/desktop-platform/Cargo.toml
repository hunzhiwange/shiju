[package]
name = "desktop-platform"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
config-ui = { path = "../config-ui", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-app-operations = { path = "../api-app-operations", version = "0.6.0" }
vw-api-app-skills = { path = "../api-app-skills", version = "0.6.0" }
vw-api-mcp-management = { path = "../api-mcp-management", version = "0.6.0" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false }
serde_json = "1"
urlencoding = "2"
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
mac-usernotifications = "0.3.1"
muda = { version = "0.19", default-features = false }
once_cell = "1"
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = { version = "4.18.2", default-features = false }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
