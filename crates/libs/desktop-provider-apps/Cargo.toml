[package]
name = "desktop-provider-apps"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-task = { path = "../api-task", version = "0.6.0" }
gateway-aggregation-desktop = { path = "../gateway-aggregation-desktop", version = "0.6.0" }
vw-api-app-aggregation = { path = "../api-app-aggregation", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-model-catalog = { path = "../api-model-catalog", version = "0.6.0" }
tokio = { version = "1", features = ["sync"] }
iced = { version = "0.14", features = ["advanced", "image"] }
vw-api-app-provider-base = { path = "../api-app-provider-base", version = "0.6.0" }
vw-api-app-provider-profiles = { path = "../api-app-provider-profiles", version = "0.6.0" }
vw-api-app-provider-extended = { path = "../api-app-provider-extended", version = "0.6.0" }
vw-api-app-provider-terminal = { path = "../api-app-provider-terminal", version = "0.6.0" }
vw-api-app-provider-edit = { path = "../api-app-provider-edit", version = "0.6.0" }
vw-api-app-auth = { path = "../api-app-auth", version = "0.6.0" }
vw-api-types = { path = "../../vw-api-types", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
base64 = "0.22"
image = "0.25.9"

serde_json = "1"
gateway-app-provider = { path = "../gateway-app-provider", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
