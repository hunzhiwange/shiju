[package]
name = "desktop-session"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-config = { path = "../desktop-config", version = "0.6.0" }
desktop-settings-apps = { path = "../desktop-settings-apps", version = "0.6.0" }
desktop-settings-skills = { path = "../desktop-settings-skills", version = "0.6.0" }
gateway-app-skills = { path = "../gateway-app-skills", version = "0.6.0" }
gateway-desktop-settings = { path = "../gateway-desktop-settings", version = "0.6.0" }
gateway-shiju-account = { path = "../gateway-shiju-account", version = "0.6.0" }
gateway-shiju-app = { path = "../gateway-shiju-app", version = "0.6.0" }
gateway-shiju-skill = { path = "../gateway-shiju-skill", version = "0.6.0" }
gateway-skill-market = { path = "../gateway-skill-market", version = "0.6.0" }
gateway-task-pool = { path = "../gateway-task-pool", version = "0.6.0" }
vw-api-agent-scheduler = { path = "../api-agent-scheduler", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-app-skills = { path = "../api-app-skills", version = "0.6.0" }
vw-api-project = { path = "../api-project", version = "0.6.0" }
vw-api-task = { path = "../api-task", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
gateway-project = { path = "../gateway-project", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
desktop-workspace = { path = "../desktop-workspace", version = "0.6.0" }
anyhow = "1"
session-text = { path = "../session-text", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
todo-types = { path = "../todo-types", version = "0.6.0" }
tracing = "0.1"
session-info = { path = "../session-info", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-session = { path = "../api-session", version = "0.6.0" }
message-types = { path = "../message-types", version = "0.6.0" }
desktop-settings-agents = { path = "../desktop-settings-agents", version = "0.6.0" }
desktop-chat-tools = { path = "../desktop-chat-tools", version = "0.6.0" }
serde_json = "1"
web-time = "1"
desktop-editor = { path = "../desktop-editor", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-task-model = { path = "../desktop-task-model", version = "0.6.0" }
session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
runtime-time = { path = "../runtime-time", version = "0.6.0" }
vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }

iced = { version = "0.14", features = ["image", "svg", "advanced"] }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
pasted-text-cache = { path = "../pasted-text-cache", version = "0.6.0" }

gateway-session = { path = "../gateway-session", version = "0.6.0" }
vw-api-acp-model = { path = "../api-acp-model", version = "0.6.0" }

config-ui = { path = "../config-ui", version = "0.6.0" }

gateway-interaction = { path = "../gateway-interaction", version = "0.6.0" }
question-types = { path = "../question-types", version = "0.6.0" }
gateway-chat-stream = { path = "../gateway-chat-stream", version = "0.6.0" }
provider-resolution = { path = "../provider-resolution", version = "0.6.0" }
model-types = { path = "../model-types", version = "0.6.0" }

directories = "5"
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
session-artifact-store = { path = "../session-artifact-store", version = "0.6.0" }

rand = "0.10.3"
serde_yaml = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream", "socks", "blocking", "json", "rustls"] }
desktop-web-runtime = { path = "../desktop-web-runtime", version = "0.6.0" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }
arboard = "3.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
reqwest = { version = "0.13", features = ["json"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
