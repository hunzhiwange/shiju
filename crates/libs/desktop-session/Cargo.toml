[package]
name = "desktop-session"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-chat-tools = { path = "../desktop-chat-tools", version = "0.6.0" }
serde_json = "1"
web-time = "1"
desktop-editor = { path = "../desktop-editor", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-task-model = { path = "../desktop-task-model", version = "0.6.0" }
session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
runtime-time = { path = "../runtime-time", version = "0.6.0" }
vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }

iced = { version = "0.14", features = ["image", "svg", "advanced"] }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
pasted-text-cache = { path = "../pasted-text-cache", version = "0.6.0" }

gateway-session = { path = "../gateway-session", version = "0.6.0" }
vw-api-acp-model = { path = "../api-acp-model", version = "0.6.0" }

config-ui = { path = "../config-ui", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.4"
