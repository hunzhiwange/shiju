[package]
name = "desktop-session"
version = "0.7.10"
edition = "2024"
license = "MIT"

[features]
test-support = []

[lib]
doctest = false

[dependencies]
vw-api-media = { path = "../api-media" }
desktop-config = { path = "../desktop-config" }
desktop-settings-apps = { path = "../desktop-settings-apps" }
desktop-settings-skills = { path = "../desktop-settings-skills" }
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
gateway-shiju-account = { path = "../gateway-shiju-account" }
gateway-shiju-app = { path = "../gateway-shiju-app" }
gateway-shiju-skill = { path = "../gateway-shiju-skill" }
gateway-skill-market = { path = "../gateway-skill-market" }
gateway-task-pool = { path = "../gateway-task-pool" }
vw-api-agent-scheduler = { path = "../api-agent-scheduler" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-project = { path = "../api-project" }
vw-api-task = { path = "../api-task" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
gateway-project = { path = "../gateway-project" }
vw-api-transport = { path = "../api-transport" }
desktop-workspace = { path = "../desktop-workspace" }
anyhow = "1"
session-text = { path = "../session-text" }
serde = { version = "1", features = ["derive"] }
todo-types = { path = "../todo-types" }
tracing = "0.1"
session-info = { path = "../session-info" }
vw-gateway-client = { path = "../../vw-gateway-client" }
gateway-endpoint = { path = "../gateway-endpoint" }
vw-api-session = { path = "../api-session" }
message-types = { path = "../message-types" }
desktop-settings-agents = { path = "../desktop-settings-agents" }
desktop-chat-tools = { path = "../desktop-chat-tools" }
serde_json = "1"
web-time = "1"
desktop-editor = { path = "../desktop-editor" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-task-model = { path = "../desktop-task-model" }
session-ui-types = { path = "../session-ui-types" }
runtime-time = { path = "../runtime-time" }
vw-api-chat-identity = { path = "../api-chat-identity" }

iced = { version = "0.14", features = ["image", "svg", "advanced"] }
desktop-i18n = { path = "../desktop-i18n" }
pasted-text-cache = { path = "../pasted-text-cache" }

gateway-session = { path = "../gateway-session" }
vw-api-acp-model = { path = "../api-acp-model" }

config-ui = { path = "../config-ui" }

gateway-interaction = { path = "../gateway-interaction" }
question-types = { path = "../question-types" }
gateway-chat-stream = { path = "../gateway-chat-stream" }
provider-resolution = { path = "../provider-resolution" }
model-types = { path = "../model-types" }

directories = "6"
config-runtime-paths = { path = "../config-runtime-paths" }
session-artifact-store = { path = "../session-artifact-store" }

rand = "0.10.3"
serde_yaml.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream", "socks", "blocking", "json", "rustls"] }
desktop-web-runtime = { path = "../desktop-web-runtime" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }
arboard = "3.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
reqwest = { version = "0.13", features = ["json"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
