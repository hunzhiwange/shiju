[package]
name = "desktop-settings-appearance"
version = "0.7.10"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
desktop-editor = { path = "../desktop-editor" }
iced = { version = "0.14", features = ["advanced"] }
config-ui = { path = "../config-ui" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-theme = { path = "../desktop-theme" }
tracing = "0.1"
desktop-settings-security = { path = "../desktop-settings-security" }

desktop-config = { path = "../desktop-config" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.17", features = ["file-handle-inner"] }

[dev-dependencies]
urlencoding = "2"
serde_json = "1"
desktop-terminal = { path = "../desktop-terminal" }
iced_runtime = "0.14"
desktop-editor = { path = "../desktop-editor" }
desktop-chat-view = { path = "../desktop-chat-view" }
desktop-assets = { path = "../desktop-assets" }
iced-code-editor = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
image = "0.25"

tempfile = "3"
desktop-theme = { path = "../desktop-theme", features = ["test-support"] }

[dependencies.desktop-provider-apps]
path = "../desktop-provider-apps"

[dependencies.vw-api-app-identity]
path = "../api-app-identity"
