[package]
name = "desktop-settings-apps"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
app-versions = { path = "../app-versions" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
iced_runtime = "0.14"
web-time = "1"
config-ui = { path = "../config-ui" }
desktop-i18n = { path = "../desktop-i18n" }
image = "0.25"
gateway-app-lifecycle = { path = "../gateway-app-lifecycle" }
gateway-endpoint = { path = "../gateway-endpoint" }
rand = "0.10.3"
desktop-apps-ui = { path = "../desktop-apps-ui" }
desktop-provider-apps = { path = "../desktop-provider-apps" }
gateway-aggregation = { path = "../gateway-aggregation" }
gateway-aggregation-native = { path = "../gateway-aggregation-native" }
gateway-aggregation-omo = { path = "../gateway-aggregation-omo" }
gateway-app-provider = { path = "../gateway-app-provider" }
vw-api-app-aggregation = { path = "../api-app-aggregation" }
vw-api-app-provider-base = { path = "../api-app-provider-base" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-operations = { path = "../api-app-operations" }
vw-api-task = { path = "../api-task" }
gateway-http = { path = "../gateway-http" }
gateway-app-read = { path = "../gateway-app-read" }
gateway-app-settings = { path = "../gateway-app-settings" }
local-app-auth = { path = "../local-app-auth" }
vw-gateway-client = { path = "../../vw-gateway-client" }
vw-api-transport = { path = "../api-transport" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-assets = { path = "../desktop-assets" }
serde_json = "1"
directories = "6"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }
iced = { version = "0.14", features = ["image", "svg", "advanced", "tokio"] }

[dev-dependencies]
vw-api-chat-identity = { path = "../api-chat-identity" }
vw-api-app-provider-profiles = { path = "../api-app-provider-profiles" }
tempfile = "3"
