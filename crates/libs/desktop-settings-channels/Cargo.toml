[package]
name = "desktop-settings-channels"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["advanced", "svg", "image"] }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-settings-security = { path = "../desktop-settings-security", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
config-channel-types = { path = "../config-channel-types", version = "0.6.0" }
config-channel-services = { path = "../config-channel-services", version = "0.6.0" }
config-channels = { path = "../config-channels", version = "0.6.0" }
config-agent-profile = { path = "../config-agent-profile", version = "0.6.0" }
gateway-channel-qr = { path = "../gateway-channel-qr", version = "0.6.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
base64 = "0.23"
