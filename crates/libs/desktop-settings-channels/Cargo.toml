[package]
name = "desktop-settings-channels"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-chat-view = { path = "../desktop-chat-view" }
iced = { version = "0.14", features = ["advanced", "svg", "image"] }
desktop-i18n = { path = "../desktop-i18n" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-settings-security = { path = "../desktop-settings-security" }
config-ui = { path = "../config-ui" }
config-channel-types = { path = "../config-channel-types" }
config-channel-services = { path = "../config-channel-services" }
config-channels = { path = "../config-channels" }
config-agent-profile = { path = "../config-agent-profile" }
gateway-channel-qr = { path = "../gateway-channel-qr" }

desktop-config = { path = "../desktop-config" }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vw-gateway-client = { path = "../../vw-gateway-client" }
vw-api-transport = { path = "../api-transport" }
vw-api-project = { path = "../api-project" }
config-agent = { path = "../config-agent" }
gateway-project = { path = "../gateway-project" }
gateway-config = { path = "../gateway-config" }
gateway-model-provider = { path = "../gateway-model-provider" }

url = "2"

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

iced_runtime = "0.14"
desktop-assets = { path = "../desktop-assets" }
tempfile = "3"
image = "0.25.9"
