[package]
name = "desktop-settings-channels"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-chat-view = { path = "../desktop-chat-view", version = "0.6.0" }
iced = { version = "0.14", features = ["advanced", "svg", "image"] }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-settings-security = { path = "../desktop-settings-security", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
config-channel-types = { path = "../config-channel-types", version = "0.6.0" }
config-channel-services = { path = "../config-channel-services", version = "0.6.0" }
config-channels = { path = "../config-channels", version = "0.6.0" }
config-agent-profile = { path = "../config-agent-profile", version = "0.6.0" }
gateway-channel-qr = { path = "../gateway-channel-qr", version = "0.6.0" }

desktop-config = { path = "../desktop-config", version = "0.6.0" }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-project = { path = "../api-project", version = "0.6.0" }
config-agent = { path = "../config-agent", version = "0.6.0" }
gateway-project = { path = "../gateway-project", version = "0.6.0" }
gateway-config = { path = "../gateway-config", version = "0.6.0" }
gateway-model-provider = { path = "../gateway-model-provider", version = "0.6.0" }

url = "2"

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

iced_runtime = "0.14"
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
tempfile = "3"
image = "0.25.9"
