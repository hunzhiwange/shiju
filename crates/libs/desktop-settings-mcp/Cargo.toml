[package]
name = "desktop-settings-mcp"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
app-config-patch = { path = "../app-config-patch" }
desktop-apps-ui = { path = "../desktop-apps-ui" }
desktop-assets = { path = "../desktop-assets" }
iced = { version = "0.14", features = ["advanced"] }
serde_json = "1"
toml = "0.9"
config-tools = { path = "../config-tools" }
config-ui = { path = "../config-ui" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
vw-api-mcp-inspect = { path = "../api-mcp-inspect" }
vw-api-tools = { path = "../api-tools" }
vw-api-mcp-management = { path = "../api-mcp-management" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-operations = { path = "../api-app-operations" }
vw-api-task = { path = "../api-task" }
vw-api-transport = { path = "../api-transport" }
desktop-provider-apps = { path = "../desktop-provider-apps" }
vw-gateway-client = { path = "../../vw-gateway-client" }
gateway-mcp-write = { path = "../gateway-mcp-write" }
gateway-mcp-distribution = { path = "../gateway-mcp-distribution" }
serde = "1"
vw-api-app-auth = { path = "../api-app-auth" }

gateway-desktop-settings = { path = "../gateway-desktop-settings" }
gateway-mcp-read = { path = "../gateway-mcp-read" }
gateway-mcp-probe = { path = "../gateway-mcp-probe" }
gateway-http = { path = "../gateway-http" }
gateway-app-settings = { path = "../gateway-app-settings" }
gateway-config = { path = "../gateway-config" }
vw-api-app-diagnostics = { path = "../api-app-diagnostics" }
desktop-settings-apps = { path = "../desktop-settings-apps" }
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
iced_runtime = "0.14"

gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
