[package]
name = "desktop-settings-memory"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
config-aggregate = { path = "../config-aggregate", version = "0.6.0" }
iced = { version = "0.14", features = ["advanced"] }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
gateway-device-sync = { path = "../gateway-device-sync", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-app-operations = { path = "../api-app-operations", version = "0.6.0" }
vw-api-device-sync = { path = "../api-device-sync", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-project-profiles = { path = "../api-project-profiles", version = "0.6.0" }
tokio = { version = "1", features = ["time"] }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
gateway-app-data = { path = "../gateway-app-data", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
serde_json = "1"
local-app-auth = { path = "../local-app-auth", version = "0.6.0" }
