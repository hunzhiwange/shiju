[package]
name = "desktop-settings-memory"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
config-aggregate = { path = "../config-aggregate" }
iced = { version = "0.14", features = ["advanced"] }
desktop-ui-controls = { path = "../desktop-ui-controls" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-project-profiles = { path = "../api-project-profiles" }
tokio = { version = "1", features = ["time"] }
desktop-i18n = { path = "../desktop-i18n" }
config-ui = { path = "../config-ui" }
serde_json = "1"
rfd = { version = "0.17", features = ["file-handle-inner"] }

config-memory = { path = "../config-memory" }

[dev-dependencies]
tempfile = "3"
iced_runtime = "0.14"
image = "0.25.9"
desktop-assets = { path = "../desktop-assets" }
desktop-settings-providers = { path = "../desktop-settings-providers" }
desktop-chat-view = { path = "../desktop-chat-view" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
