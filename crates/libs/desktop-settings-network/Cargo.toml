[package]
name = "desktop-settings-network"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
sha2 = "0.11"
hex = "0.4"
rand = "0.10.3"
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
pinyin = "0.11"
config-proxy = { path = "../config-proxy", version = "0.6.0" }
config-aggregate = { path = "../config-aggregate", version = "0.6.0" }
iced = { version = "0.14", features = ["advanced"] }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
config-tools = { path = "../config-tools", version = "0.6.0" }
config-gateway = { path = "../config-gateway", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
chrono = "0.4"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.reqwest]
version = "0.13"
default-features = false
features = ["json", "rustls"]

[target.'cfg(target_arch = "wasm32")'.dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.tracing]
version = "0.1"

[dependencies.gateway-endpoint]
path = "../gateway-endpoint"
version = "0.6.0"

[dev-dependencies]
iced_runtime = "0.14"
image = "0.25"
tempfile = "3"
urlencoding = "2"
desktop-chat-view = { path = "../desktop-chat-view", version = "0.6.0" }
desktop-settings-appearance = { path = "../desktop-settings-appearance", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-config = { path = "../desktop-config", version = "0.6.0" }
desktop-settings-agents = { path = "../desktop-settings-agents", version = "0.6.0" }
gateway-desktop-settings = { path = "../gateway-desktop-settings", version = "0.6.0" }
gateway-config = { path = "../gateway-config", version = "0.6.0" }
gateway-interaction = { path = "../gateway-interaction", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
vw-config-types = { path = "../../vw-config-types", version = "0.6.0" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
