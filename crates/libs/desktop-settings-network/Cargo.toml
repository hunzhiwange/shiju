[package]
name = "desktop-settings-network"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
sha2 = "0.11"
hex = "0.4"
rand = "0.10.3"
vw-api-transport = { path = "../api-transport" }
pinyin = "0.11"
config-proxy = { path = "../config-proxy" }
config-aggregate = { path = "../config-aggregate" }
iced = { version = "0.14", features = ["advanced"] }
desktop-i18n = { path = "../desktop-i18n" }
config-ui = { path = "../config-ui" }
config-tools = { path = "../config-tools" }
config-gateway = { path = "../config-gateway" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-assets = { path = "../desktop-assets" }
chrono = "0.4"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.reqwest]
version = "0.13"
default-features = false
features = ["json", "rustls"]

[target.'cfg(target_arch = "wasm32")'.dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.tracing]
version = "0.1"

[dependencies.gateway-endpoint]
path = "../gateway-endpoint"

[dev-dependencies]
iced_runtime = "0.14"
image = "0.25"
tempfile = "3"
urlencoding = "2"
desktop-chat-view = { path = "../desktop-chat-view" }
desktop-settings-appearance = { path = "../desktop-settings-appearance" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-config = { path = "../desktop-config" }
desktop-settings-agents = { path = "../desktop-settings-agents" }
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
gateway-config = { path = "../gateway-config" }
gateway-interaction = { path = "../gateway-interaction" }
vw-gateway-client = { path = "../../vw-gateway-client" }
vw-config-types = { path = "../../vw-config-types" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
