[package]
name = "desktop-settings-providers"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
chrono = "0.4"
config-gateway = { path = "../config-gateway" }
serde_json = "1"
desktop-i18n = { path = "../desktop-i18n" }
model-types = { path = "../model-types" }
config-aggregate = { path = "../config-aggregate" }
config-routing = { path = "../config-routing" }
config-ui = { path = "../config-ui" }
desktop-assets = { path = "../desktop-assets" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
iced = { version = "0.14", features = ["image", "svg", "advanced", "canvas"] }
desktop-config = { path = "../desktop-config" }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-model-provider = { path = "../gateway-model-provider" }
vw-gateway-client = { path = "../../vw-gateway-client" }
auth-file-store = { path = "../auth-file-store" }
auth-types = { path = "../auth-types" }
config-runtime-paths = { path = "../config-runtime-paths" }
provider-resolution = { path = "../provider-resolution" }
provider-model-cache = { path = "../provider-model-cache" }
provider-model-discovery = { path = "../provider-model-discovery" }
model-catalog-types = { path = "../model-catalog-types" }
directories = "5"

desktop-provider-apps = { path = "../desktop-provider-apps" }
vw-api-model-catalog = { path = "../api-model-catalog" }
vw-api-transport = { path = "../api-transport" }
vw-api-app-identity = { path = "../api-app-identity" }

gateway-model-catalog = { path = "../gateway-model-catalog" }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gateway-shiju-account = { path = "../gateway-shiju-account" }

[dev-dependencies]
iced_runtime = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
model-state = { path = "../model-state" }
image = "0.25"
