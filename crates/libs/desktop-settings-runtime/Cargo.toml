[package]
name = "desktop-settings-runtime"
version = "0.7.10"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
config-aggregate = { path = "../config-aggregate" }
iced = { version = "0.14", features = ["advanced"] }
serde_json = "1"
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-assets = { path = "../desktop-assets" }
desktop-settings-providers = { path = "../desktop-settings-providers" }
config-ui = { path = "../config-ui" }
config-tools = { path = "../config-tools" }
config-routing = { path = "../config-routing" }
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
config-observability = { path = "../config-observability" }

config-runtime = { path = "../config-runtime" }
config-reliability = { path = "../config-reliability" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
iced_runtime = "0.14"
image = "0.25"
tempfile = "3"
desktop-chat-view = { path = "../desktop-chat-view" }
