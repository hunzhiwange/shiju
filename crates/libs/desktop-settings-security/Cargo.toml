[package]
name = "desktop-settings-security"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "advanced", "canvas"] }
sha2 = "0.10"
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-computer-control = { path = "../api-computer-control", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-computer-control = { path = "../gateway-computer-control", version = "0.6.0" }
tokio = { version = "1", features = ["time"] }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
config-security = { path = "../config-security", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
