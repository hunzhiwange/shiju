[package]
name = "desktop-settings-sessions"
version = "0.6.0"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[features]
acceptance-fixture = ["dep:serde_json", "dep:tempfile"]

[dependencies]
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
iced = { version = "0.14", features = ["svg", "advanced", "tokio"] }
sha2 = "0.11"
session-info = { path = "../session-info", version = "0.6.0" }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
gateway-session = { path = "../gateway-session", version = "0.6.0" }
vw-api-session = { path = "../api-session", version = "0.6.0" }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
serde_json = "1"
iced_runtime = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
