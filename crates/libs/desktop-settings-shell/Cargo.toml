[package]
name = "desktop-settings-shell"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
config-ui = { path = "../config-ui" }
iced = { version = "0.14", features = ["svg", "advanced"] }
desktop-assets = { path = "../desktop-assets" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
config-security = { path = "../config-security" }
config-skills = { path = "../config-skills" }
desktop-config = { path = "../desktop-config" }
desktop-provider-apps = { path = "../desktop-provider-apps" }
desktop-settings-agents = { path = "../desktop-settings-agents" }
desktop-settings-appearance = { path = "../desktop-settings-appearance" }
desktop-settings-channels = { path = "../desktop-settings-channels" }
desktop-settings-cron = { path = "../desktop-settings-cron" }
desktop-settings-mcp = { path = "../desktop-settings-mcp" }
desktop-settings-memory = { path = "../desktop-settings-memory" }
desktop-settings-network = { path = "../desktop-settings-network" }
desktop-settings-providers = { path = "../desktop-settings-providers" }
desktop-settings-runtime = { path = "../desktop-settings-runtime" }
desktop-settings-security = { path = "../desktop-settings-security" }
desktop-settings-sessions = { path = "../desktop-settings-sessions" }
desktop-settings-skills = { path = "../desktop-settings-skills" }
desktop-settings-workspace = { path = "../desktop-settings-workspace" }
gateway-cron = { path = "../gateway-cron" }
gateway-desktop-settings = { path = "../gateway-desktop-settings" }

chrono = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-settings-voice = { path = "../desktop-settings-voice" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
desktop-task-board = { path = "../desktop-task-board" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
image = "0.25.9"
iced_runtime = "0.14"
