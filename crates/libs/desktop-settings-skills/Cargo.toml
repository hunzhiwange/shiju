[package]
name = "desktop-settings-skills"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
config-runtime-paths = { path = "../config-runtime-paths" }
config-ui = { path = "../config-ui" }
config-skills = { path = "../config-skills" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-assets = { path = "../desktop-assets" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
gateway-app-prompts = { path = "../gateway-app-prompts" }
gateway-app-prompt-resources = { path = "../gateway-app-prompt-resources" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-operations = { path = "../api-app-operations" }
vw-api-types = { path = "../../vw-api-types" }
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
iced = { version = "0.14", features = ["image", "svg", "advanced", "canvas"] }
desktop-provider-apps = { path = "../desktop-provider-apps" }
vw-gateway-client = { path = "../../vw-gateway-client" }
local-app-auth = { path = "../local-app-auth" }
tokio = { version = "1", features = ["rt"] }
rfd = { version = "0.17", features = ["file-handle-inner"] }

vw-api-transport = { path = "../api-transport" }

[dev-dependencies]
desktop-chat-view = { path = "../desktop-chat-view" }
iced_runtime = "0.14"
image = "0.25"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
urlencoding = "2.1"
