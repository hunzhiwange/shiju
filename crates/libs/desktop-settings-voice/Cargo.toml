[package]
name = "desktop-settings-voice"
version = "0.6.0"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-voice = { path = "../desktop-voice", version = "0.6.0" }
audio-capture = { path = "../audio-capture", version = "0.6.0" }
config-voice = { path = "../config-voice", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-voice = { path = "../gateway-voice", version = "0.6.0" }
iced = { version = "0.14", features = ["advanced", "tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
[dev-dependencies]
iced_runtime = "0.14"
tempfile = "3"
