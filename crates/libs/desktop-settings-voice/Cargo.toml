[package]
name = "desktop-settings-voice"
version = "0.7.10"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-voice = { path = "../desktop-voice" }
audio-capture = { path = "../audio-capture" }
config-voice = { path = "../config-voice" }
config-ui = { path = "../config-ui" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-http = { path = "../gateway-http" }
gateway-voice = { path = "../gateway-voice" }
iced = { version = "0.14", features = ["advanced", "tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
[dev-dependencies]
iced_runtime = "0.14"
tempfile = "3"
