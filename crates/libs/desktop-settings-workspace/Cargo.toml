[package]
name = "desktop-settings-workspace"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["advanced", "svg"] }
sha2 = "0.10"
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-i18n = { path = "../desktop-i18n" }
config-worktree = { path = "../config-worktree" }
config-ui = { path = "../config-ui" }
vw-api-transport = { path = "../api-transport" }
vw-api-project = { path = "../api-project" }
vw-api-worktree = { path = "../api-worktree" }
vw-gateway-client = { path = "../../vw-gateway-client" }
gateway-project = { path = "../gateway-project" }
gateway-endpoint = { path = "../gateway-endpoint" }
desktop-assets = { path = "../desktop-assets" }
gateway-config = { path = "../gateway-config" }
gateway-system = { path = "../gateway-system" }
serde_json = "1"

desktop-workspace = { path = "../desktop-workspace" }

[dev-dependencies]
urlencoding = "2"
desktop-navigation = { path = "../desktop-navigation" }
desktop-chat-view = { path = "../desktop-chat-view" }
desktop-task-model = { path = "../desktop-task-model" }
tempfile = "3"
iced_runtime = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
image = "0.25"
