[package]
name = "desktop-settings-workspace"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["advanced", "svg"] }
sha2 = "0.10"
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
config-worktree = { path = "../config-worktree", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-project = { path = "../api-project", version = "0.6.0" }
vw-api-worktree = { path = "../api-worktree", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
gateway-project = { path = "../gateway-project", version = "0.6.0" }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
gateway-config = { path = "../gateway-config", version = "0.6.0" }
gateway-system = { path = "../gateway-system", version = "0.6.0" }
serde_json = "1"

desktop-workspace = { path = "../desktop-workspace", version = "0.6.0" }

[dev-dependencies]
urlencoding = "2"
desktop-navigation = { path = "../desktop-navigation", version = "0.6.0" }
desktop-chat-view = { path = "../desktop-chat-view", version = "0.6.0" }
desktop-task-model = { path = "../desktop-task-model", version = "0.6.0" }
tempfile = "3"
iced_runtime = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
image = "0.25"
