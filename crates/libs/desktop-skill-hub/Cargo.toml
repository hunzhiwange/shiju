[package]
name = "desktop-skill-hub"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-http = { path = "../gateway-http" }
open = "5"
gateway-shiju-account = { path = "../gateway-shiju-account" }
gateway-skill-market = { path = "../gateway-skill-market" }
gateway-shiju-skill = { path = "../gateway-shiju-skill" }
gateway-shiju-knowledge = { path = "../gateway-shiju-knowledge" }
config-runtime-paths = { path = "../config-runtime-paths" }
directories = "5"
parking_lot = "0.12"
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
iced = { version = "0.14", features = ["markdown"] }
desktop-account = { path = "../desktop-account" }
desktop-i18n = { path = "../desktop-i18n" }
config-ui = { path = "../config-ui" }
vw-gateway-client = { path = "../../vw-gateway-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "fs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
