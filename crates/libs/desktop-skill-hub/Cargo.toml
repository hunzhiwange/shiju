[package]
name = "desktop-skill-hub"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-skill-market = { path = "../gateway-skill-market", version = "0.6.0" }
gateway-shiju-skill = { path = "../gateway-shiju-skill", version = "0.6.0" }
gateway-shiju-knowledge = { path = "../gateway-shiju-knowledge", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
directories = "5"
parking_lot = "0.12"
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
iced = { version = "0.14", features = ["markdown"] }
desktop-account = { path = "../desktop-account", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", default-features = false, features = ["rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
