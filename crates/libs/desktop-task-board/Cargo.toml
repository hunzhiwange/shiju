[package]
name = "desktop-task-board"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-chat-input = { path = "../desktop-chat-input" }
desktop-task-model = { path = "../desktop-task-model" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-assets = { path = "../desktop-assets" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-settings-providers = { path = "../desktop-settings-providers" }
config-ui = { path = "../config-ui" }
iced = { version = "0.14", features = ["image", "svg", "advanced"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
web-time = "1"
vw-api-agent-scheduler = { path = "../api-agent-scheduler" }

vw-api-task = { path = "../api-task" }
serde_json = "1"

desktop-task-executor = { path = "../desktop-task-executor" }
vw-api-transport = { path = "../api-transport" }
runtime-time = { path = "../runtime-time" }

vw-api-chat-identity = { path = "../api-chat-identity" }

display-format = { path = "../display-format" }
gateway-http = { path = "../gateway-http" }
tracing = "0.1"

time = { version = "0.3", features = ["formatting"] }
config-agent = { path = "../config-agent" }
desktop-settings-agents = { path = "../desktop-settings-agents" }

desktop-chat-view = { path = "../desktop-chat-view" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
desktop-task-model = { path = "../desktop-task-model", features = ["test-support"] }
vw-api-task-lifecycle = { path = "../api-task-lifecycle" }

iced_runtime = "0.14"
image = "0.25"
