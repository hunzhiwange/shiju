[package]
name = "desktop-task-board"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-task-model = { path = "../desktop-task-model", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
desktop-settings-providers = { path = "../desktop-settings-providers", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }
iced = { version = "0.14", features = ["image", "svg", "advanced"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
web-time = "1"
vw-api-agent-scheduler = { path = "../api-agent-scheduler", version = "0.6.0" }

vw-api-task = { path = "../api-task", version = "0.6.0" }
serde_json = "1"

desktop-task-executor = { path = "../desktop-task-executor", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
runtime-time = { path = "../runtime-time", version = "0.6.0" }

vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }

[dev-dependencies]
desktop-task-model = { path = "../desktop-task-model", version = "0.6.0", features = ["test-support"] }
vw-api-task-lifecycle = { path = "../api-task-lifecycle", version = "0.6.0" }
