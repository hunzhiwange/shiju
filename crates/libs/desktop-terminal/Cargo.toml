[package]
name = "desktop-terminal"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "svg"] }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-assets = { path = "../desktop-assets" }
desktop-i18n = { path = "../desktop-i18n" }
config-ui = { path = "../config-ui" }

serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced_term = { path = "../../../vendor/iced_term" }
portable-pty = "0.9"
arboard = "3.4"

[dev-dependencies]
iced-code-editor = { git = "https://github.com/doyouhaobaby/iced-code-editor.git", tag = "v0.5.6" }
iced_runtime = "0.14"
desktop-editor = { path = "../desktop-editor" }
tempfile = "3"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
