[package]
name = "desktop-theme"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
# 桌面组合测试需要与本库共用同线程的主题根目录覆盖。
test-support = []

[dependencies]
anyhow = "1"
config-runtime-paths = { path = "../config-runtime-paths" }
directories = "6"
iced = { version = "0.14", features = ["image"] }
include_dir = "0.7"
serde_json = "1"
theme-model = { path = "../theme-model" }
theme-store = { path = "../theme-store" }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
