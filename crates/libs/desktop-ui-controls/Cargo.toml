[package]
name = "desktop-ui-controls"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "advanced", "canvas"] }
serde = { version = "1", features = ["derive"] }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }

desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
config-ui = { path = "../config-ui", version = "0.6.0" }

urlencoding = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
image = "0.25.9"
