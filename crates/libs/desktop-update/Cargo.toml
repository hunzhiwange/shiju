[package]
name = "desktop-update"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vw-shared = { path = "../../vw-shared", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
config-ui = { path = "../config-ui", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
directories = "5"
hex = "0.4"
rfd = { version = "0.17", features = ["file-handle-inner"] }
sha2 = "0.11"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
