[package]
name = "desktop-usage"
version = "0.7.10"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[dependencies]
config-runtime-paths = { path = "../config-runtime-paths" }
desktop-provider-apps = { path = "../desktop-provider-apps" }
provider-resolution = { path = "../provider-resolution" }
model-types = { path = "../model-types" }
model-state = { path = "../model-state" }

desktop-assets = { path = "../desktop-assets" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-settings-account = { path = "../desktop-settings-account" }
gateway-app-auth = { path = "../gateway-app-auth" }
gateway-app-usage = { path = "../gateway-app-usage" }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-usage-price = { path = "../gateway-usage-price" }
gateway-usage-scan = { path = "../gateway-usage-scan" }
vw-gateway-client = { path = "../../vw-gateway-client" }
vw-api-types = { path = "../../vw-api-types" }
vw-api-app-auth = { path = "../api-app-auth" }
vw-api-apps-usage = { path = "../api-apps-usage" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-transport = { path = "../api-transport" }
vw-api-task = { path = "../api-task" }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["formatting"] }
serde_json = "1"
iced = { version = "0.14", features = ["svg", "advanced", "tokio", "canvas"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }
gateway-usage-read = { path = "../gateway-usage-read" }
vw-api-usage = { path = "../api-usage" }
session-ui-types = { path = "../session-ui-types" }
session-info = { path = "../session-info" }
config-ui = { path = "../config-ui" }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
[dev-dependencies]
iced_runtime = "0.14"
