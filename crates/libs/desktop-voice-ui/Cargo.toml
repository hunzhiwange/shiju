[package]
name = "desktop-voice-ui"
version = "0.7.10"
edition = "2024"
license = "MIT"
[lib]
doctest = false
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-chat-view = { path = "../desktop-chat-view" }
desktop-voice = { path = "../desktop-voice" }
audio-capture = { path = "../audio-capture" }
voice-recordings = { path = "../voice-recordings" }
config-voice = { path = "../config-voice" }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-http = { path = "../gateway-http" }
gateway-voice = { path = "../gateway-voice" }
vw-api-voice = { path = "../api-voice" }
base64 = "0.23"
rand = "0.10.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
chrono = "0.4"
desktop-settings-voice = { path = "../desktop-settings-voice" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
iced = { version = "0.14", features = ["svg", "advanced", "tokio"] }
[dev-dependencies]
serde_json = "1"
tempfile = "3"
iced_runtime = "0.14"
desktop-assets = { path = "../desktop-assets" }
image = "0.25.9"
