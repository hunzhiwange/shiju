[package]
name = "desktop-voice"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
acceptance-fixture = ["dep:tokio-tungstenite"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
audio-capture = { path = "../audio-capture" }
voice-recordings = { path = "../voice-recordings" }
image = "0.25.9"
audio-playback = { path = "../audio-playback" }
voice-permissions = { path = "../voice-permissions" }
config-voice = { path = "../config-voice" }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-http = { path = "../gateway-http" }
gateway-voice = { path = "../gateway-voice" }
vw-api-voice = { path = "../api-voice" }
base64 = "0.23"
cpal = { version = "0.18.2", default-features = false }
iced = { version = "0.14", features = ["tokio"] }
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.29", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }
