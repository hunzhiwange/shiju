[package]
name = "desktop-web-install"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
desktop-release = { path = "../desktop-release", version = "0.6.0" }
update-types = { path = "../update-types", version = "0.6.0" }
anyhow = "1"
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
directories = "5"
iced = { version = "0.14", features = ["tokio"] }
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }
