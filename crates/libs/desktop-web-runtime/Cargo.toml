[package]
name = "desktop-web-runtime"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
product-version = { path = "../product-version" }
question-types = { path = "../question-types" }
serde_json = "1"

iced = { version = "0.14", features = ["advanced", "image", "svg"] }
desktop-assets = { path = "../desktop-assets" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
config-ui = { path = "../config-ui" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
base64 = "0.22"
gateway-mcp = { path = "../gateway-mcp" }
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls"] }
rfd = { version = "0.17", features = ["file-handle-inner"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "net"] }
urlencoding = "2.1"
vw-api-mcp-network = { path = "../api-mcp-network" }
vw-gateway-client = { path = "../../vw-gateway-client" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sha2 = "0.11"
hex = "0.4"
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["rt-multi-thread", "io-util"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(windows)))'.dependencies]
open = "5"

[target.'cfg(windows)'.dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSWindow", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
