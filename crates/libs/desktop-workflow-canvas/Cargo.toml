[package]
name = "desktop-workflow-canvas"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-workflow-model = { path = "../desktop-workflow-model" }
desktop-workflow-state = { path = "../desktop-workflow-state" }
desktop-i18n = { path = "../desktop-i18n" }
desktop-assets = { path = "../desktop-assets" }
iced = { version = "0.14", features = ["image", "advanced"] }
serde_yaml = "0.9"
unicode-width = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
