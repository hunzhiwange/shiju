[package]
name = "desktop-workflow-ui"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
desktop-workflow-state = { path = "../desktop-workflow-state", version = "0.6.0" }
desktop-workflow-model = { path = "../desktop-workflow-model", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }
desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
vw-api-workflow = { path = "../api-workflow", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
gateway-workflow = { path = "../gateway-workflow", version = "0.6.0" }
iced = { version = "0.14", features = ["advanced", "svg"] }
serde_json = "1"
chrono = "0.4"
serde_yaml = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
image = "0.25.9"
