[package]
name = "desktop-workflow-ui"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
desktop-workflow-canvas = { path = "../desktop-workflow-canvas" }
desktop-task-model = { path = "../desktop-task-model" }
desktop-chat-view = { path = "../desktop-chat-view" }
vw-api-task-lifecycle = { path = "../api-task-lifecycle" }
gateway-task-lifecycle = { path = "../gateway-task-lifecycle" }
desktop-assets = { path = "../desktop-assets" }
desktop-workflow-state = { path = "../desktop-workflow-state" }
desktop-workflow-model = { path = "../desktop-workflow-model" }
desktop-ui-controls = { path = "../desktop-ui-controls" }
desktop-i18n = { path = "../desktop-i18n" }
vw-api-workflow = { path = "../api-workflow" }
vw-api-transport = { path = "../api-transport" }
gateway-workflow = { path = "../gateway-workflow" }
iced = { version = "0.14", features = ["advanced", "svg", "canvas"] }
serde_json = "1"
chrono = "0.4"
serde_yaml = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"
resvg = "0.46.0"
tiny-skia = "0.11.4"
image = "0.25.9"
open = { version = "5", features = ["shellexecute-on-windows"] }

[dev-dependencies]
urlencoding = "2"
config-ui = { path = "../config-ui" }
iced_runtime = "0.14"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros"] }
image = "0.25.9"
