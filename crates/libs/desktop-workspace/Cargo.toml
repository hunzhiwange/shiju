[package]
name = "desktop-workspace"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
config-ui = { path = "../config-ui", version = "0.6.0" }
display-format = { path = "../display-format", version = "0.6.0" }
desktop-assets = { path = "../desktop-assets", version = "0.6.0" }
desktop-theme = { path = "../desktop-theme", version = "0.6.0" }

desktop-task-model = { path = "../desktop-task-model", version = "0.6.0" }
iced = { version = "0.14", features = ["advanced", "image", "svg"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
vw-api-file = { path = "../api-file", version = "0.6.0" }
vw-api-project-profiles = { path = "../api-project-profiles", version = "0.6.0" }
desktop-file-tree = { path = "../desktop-file-tree", version = "0.6.0" }
desktop-ui-controls = { path = "../desktop-ui-controls", version = "0.6.0" }

desktop-i18n = { path = "../desktop-i18n", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
directories = "5"
sha2 = "0.11"
hex = "0.4"
regex = "1"

vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-project = { path = "../api-project", version = "0.6.0" }
vw-api-worktree = { path = "../api-worktree", version = "0.6.0" }
gateway-project = { path = "../gateway-project", version = "0.6.0" }
gateway-files = { path = "../gateway-files", version = "0.6.0" }
gateway-session = { path = "../gateway-session", version = "0.6.0" }
session-info = { path = "../session-info", version = "0.6.0" }
runtime-time = { path = "../runtime-time", version = "0.6.0" }

project-types = { path = "../project-types", version = "0.6.0" }

message-types = { path = "../message-types", version = "0.6.0" }
session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
serde_json = "1"

gateway-project-profile = { path = "../gateway-project-profile", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.17", features = ["file-handle-inner"] }
image = "0.25.9"
