[package]
name = "desktop-workspace"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
file-index = { path = "../file-index" }
config-ui = { path = "../config-ui" }
display-format = { path = "../display-format" }
desktop-assets = { path = "../desktop-assets" }
desktop-theme = { path = "../desktop-theme" }

desktop-task-model = { path = "../desktop-task-model" }
iced = { version = "0.14", features = ["advanced", "image", "svg"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
vw-api-file = { path = "../api-file" }
vw-api-project-profiles = { path = "../api-project-profiles" }
desktop-file-tree = { path = "../desktop-file-tree" }
desktop-ui-controls = { path = "../desktop-ui-controls" }

desktop-i18n = { path = "../desktop-i18n" }
config-runtime-paths = { path = "../config-runtime-paths" }
directories = "5"
sha2 = "0.11"
hex = "0.4"
regex = "1"

vw-gateway-client = { path = "../../vw-gateway-client" }
vw-api-transport = { path = "../api-transport" }
vw-api-project = { path = "../api-project" }
vw-api-worktree = { path = "../api-worktree" }
gateway-project = { path = "../gateway-project" }
gateway-files = { path = "../gateway-files" }
gateway-session = { path = "../gateway-session" }
session-info = { path = "../session-info" }
runtime-time = { path = "../runtime-time" }

project-types = { path = "../project-types" }

message-types = { path = "../message-types" }
session-ui-types = { path = "../session-ui-types" }
serde_json = "1"

gateway-project-profile = { path = "../gateway-project-profile" }
vw-api-app-identity = { path = "../api-app-identity" }
tokio = { version = "1", features = ["time", "rt"] }

chrono = "0.4"
session-text = { path = "../session-text" }

[dev-dependencies]
iced_runtime = "0.14"
desktop-task-model = { path = "../desktop-task-model", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.17", features = ["file-handle-inner"] }
image = "0.25.9"
