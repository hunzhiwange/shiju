[package]
name = "gateway-agent-app"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-types = { path = "../../vw-api-types" }
agent-database = { path = "../agent-database" }
agent-app-services = { path = "../agent-app-services" }
app-access-service = { path = "../app-access-service" }
vw-agent-apps = { path = "../../vw-agent-apps" }
vw-api-transport = { path = "../api-transport" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-operations = { path = "../api-app-operations" }
anyhow = "1"
axum = { version = "0.8.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1.11", features = ["v4", "js"] }
