[package]
name = "gateway-agent-apps"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
vw-api-app-skills = { path = "../api-app-skills", version = "0.6.0" }
app-diagnostics-runtime = { path = "../app-diagnostics-runtime", version = "0.6.0" }
vw-api-app-diagnostics = { path = "../api-app-diagnostics", version = "0.6.0" }
vw-api-mcp-management = { path = "../api-mcp-management", version = "0.6.0" }
anyhow = "1"
local-app-auth = { path = "../local-app-auth", version = "0.6.0" }
app-access-service = { path = "../app-access-service", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
agent-app-services = { path = "../agent-app-services", version = "0.6.0" }
app-provider-services = { path = "../app-provider-services", version = "0.6.0" }
app-settings-store = { path = "../app-settings-store", version = "0.6.0" }
vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-app-auth = { path = "../api-app-auth", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-types = { path = "../../vw-api-types", version = "0.6.0" }
axum = { version = "0.8.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
vw-api-app-provider-base = { path = "../api-app-provider-base", version = "0.6.0" }
uuid = { version = "1.11", features = ["v4", "js"] }

gateway-types = { path = "../gateway-types", version = "0.6.0" }
vw-api-app-operations = { path = "../api-app-operations", version = "0.6.0" }
vw-api-task = { path = "../api-task", version = "0.6.0" }
agent-project = { path = "../agent-project", version = "0.6.0" }
model-transport = { path = "../model-transport", version = "0.6.0" }
agent-usage = { path = "../agent-usage", version = "0.6.0" }
vw-api-apps-usage = { path = "../api-apps-usage", version = "0.6.0" }
futures-util = "0.3.32"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
sha2 = "0.11"
chrono = "0.4"
tracing = "0.1"
hex = "0.4"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
rusqlite = "0.37.0"

[dev-dependencies]
gateway-app-providers = { path = "../gateway-app-providers", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
base64 = "0.23"
hex = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "test-util"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume"] }
app-routing-services = { path = "../app-routing-services", version = "0.6.0" }
gateway-app-diagnostics = { path = "../gateway-app-diagnostics", version = "0.6.0" }
gateway-app-settings = { path = "../gateway-app-settings", version = "0.6.0" }
libc = "0.2"
mcp-client = { path = "../mcp-client", version = "0.6.0" }
plugin-mcp = { path = "../plugin-mcp", version = "0.6.0" }
tool-mcp = { path = "../tool-mcp", version = "0.6.0" }
tokio-util = { version = "0.7", features = ["rt"] }
vw-api-app-failover = { path = "../api-app-failover", version = "0.6.0" }
vw-api-tools = { path = "../api-tools", version = "0.6.0" }

zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
gateway-app-usage = { path = "../gateway-app-usage", version = "0.6.0" }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1.14.0"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
