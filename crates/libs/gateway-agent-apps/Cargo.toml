[package]
name = "gateway-agent-apps"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["dep:gateway-app-read", "dep:gateway-http", "dep:gateway-endpoint", "dep:tower", "tokio/net", "tokio/io-util"]

[dependencies]
tower = { version = "0.5", features = ["util"], optional = true }
gateway-app-read = { path = "../gateway-app-read", optional = true }
gateway-http = { path = "../gateway-http", optional = true }
gateway-endpoint = { path = "../gateway-endpoint", optional = true }
vw-api-app-skills = { path = "../api-app-skills" }
app-diagnostics-runtime = { path = "../app-diagnostics-runtime" }
vw-api-app-diagnostics = { path = "../api-app-diagnostics" }
vw-api-mcp-management = { path = "../api-mcp-management" }
anyhow = "1"
local-app-auth = { path = "../local-app-auth" }
app-access-service = { path = "../app-access-service" }
agent-database = { path = "../agent-database" }
agent-paths = { path = "../agent-paths" }
agent-app-services = { path = "../agent-app-services" }
app-provider-services = { path = "../app-provider-services" }
app-settings-store = { path = "../app-settings-store" }
vw-agent-apps = { path = "../../vw-agent-apps" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-auth = { path = "../api-app-auth" }
vw-api-transport = { path = "../api-transport" }
vw-api-types = { path = "../../vw-api-types" }
axum = { version = "0.8.8", features = ["json", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
vw-api-app-provider-base = { path = "../api-app-provider-base" }
uuid = { version = "1.11", features = ["v4", "js"] }

gateway-types = { path = "../gateway-types" }
vw-api-app-operations = { path = "../api-app-operations" }
vw-api-task = { path = "../api-task" }
agent-project = { path = "../agent-project" }
model-transport = { path = "../model-transport" }
agent-usage = { path = "../agent-usage" }
vw-api-apps-usage = { path = "../api-apps-usage" }
futures-util = "0.3.32"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
sha2 = "0.11"
chrono = "0.4"
tracing = "0.1"
hex = "0.4"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
config-runtime-paths = { path = "../config-runtime-paths" }
rusqlite = "0.37.0"

[dev-dependencies]
gateway-app-read = { path = "../gateway-app-read" }
gateway-app-skills = { path = "../gateway-app-skills" }
serde_yaml = "0.9"
gateway-http = { path = "../gateway-http" }
gateway-app-lifecycle = { path = "../gateway-app-lifecycle" }
gateway-app-settings = { path = "../gateway-app-settings" }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-app-providers = { path = "../gateway-app-providers" }
agent-database = { path = "../agent-database", features = ["test-support"] }
base64 = "0.23"
hex = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "test-util"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
reqwest_012 = { package = "reqwest", version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rmcp = { version = "0.8.0", default-features = false, features = ["client"] }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume"] }
app-routing-services = { path = "../app-routing-services" }
gateway-app-diagnostics = { path = "../gateway-app-diagnostics" }
libc = "0.2"
mcp-client = { path = "../mcp-client" }
plugin-mcp = { path = "../plugin-mcp" }
tool-mcp = { path = "../tool-mcp" }
tokio-util = { version = "0.7", features = ["rt"] }
vw-api-app-failover = { path = "../api-app-failover" }
vw-api-tools = { path = "../api-tools" }

agent-gateway = { path = "../agent-gateway", features = ["test-support"] }
gateway-app-auth = { path = "../gateway-app-auth" }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
gateway-app-usage = { path = "../gateway-app-usage" }
vw-gateway-client = { path = "../../vw-gateway-client" }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1.14.0"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
gateway-app-provider = { path = "../gateway-app-provider" }
vw-api-app-provider-profiles = { path = "../api-app-provider-profiles" }
