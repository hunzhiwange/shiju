[package]
name = "gateway-agent-scheduler"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
vw-api-agent-scheduler = { path = "../api-agent-scheduler", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.8", features = ["json"] }
futures-util = "0.3.32"
serde_json = "1"
agent-project = { path = "../agent-project", version = "0.6.0" }
gateway-types = { path = "../gateway-types", version = "0.6.0" }
task-scheduler-core = { path = "../task-scheduler-core", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-project = { path = "../agent-project", version = "0.6.0", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
