[package]
name = "gateway-agent-scheduler"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
vw-api-agent-scheduler = { path = "../api-agent-scheduler" }
vw-api-transport = { path = "../api-transport" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
task-scheduler = { path = "../task-scheduler" }
vw-api-chat-identity = { path = "../api-chat-identity" }
vw-api-task = { path = "../api-task" }
tokio = { version = "1", features = ["sync", "rt"] }
runtime-time = { path = "../runtime-time" }
tracing = "0.1"
async-trait = "0.1"
axum = { version = "0.8.8", features = ["json"] }
futures-util = "0.3.32"
serde_json = "1"
agent-project = { path = "../agent-project" }
gateway-types = { path = "../gateway-types" }
task-scheduler-core = { path = "../task-scheduler-core" }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-database = { path = "../agent-database", features = ["test-support"] }
gateway-task = { path = "../gateway-task" }
agent-project = { path = "../agent-project", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

shell-command = { path = "../shell-command" }
tool-context = { path = "../tool-context" }
tool-types = { path = "../tool-types" }
permission-types = { path = "../permission-types" }
tokio-util = "0.7"
vw-api-chat = { path = "../api-chat" }
session-port = { path = "../session-port" }
task-scheduler = { path = "../task-scheduler", features = ["test-support"] }
