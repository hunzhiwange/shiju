[package]
name = "gateway-aggregation-native"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
gateway-aggregation = { path = "../gateway-aggregation" }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-http = { path = "../gateway-http" }
vw-api-app-aggregation = { path = "../api-app-aggregation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[dev-dependencies]
vw-api-transport = { path = "../api-transport" }
vw-api-app-provider-terminal = { path = "../api-app-provider-terminal" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
