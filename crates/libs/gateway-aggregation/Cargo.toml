[package]
name = "gateway-aggregation"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-http = { path = "../gateway-http" }
vw-api-app-aggregation = { path = "../api-app-aggregation" }
vw-api-app-identity = { path = "../api-app-identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
app-provider-services = { path = "../app-provider-services" }
vw-api-app-auth = { path = "../api-app-auth" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment" }
app-settings-store = { path = "../app-settings-store" }
model-catalog = { path = "../model-catalog" }
vw-api-model-catalog = { path = "../api-model-catalog" }
vw-api-app-failover = { path = "../api-app-failover" }
vw-api-app-provider-terminal = { path = "../api-app-provider-terminal" }
ring = "0.17.14"
hex = "0.4"
base64 = "0.23"
getrandom = "0.4"
runtime-time = { path = "../runtime-time" }
vw-api-app-provider-edit = { path = "../api-app-provider-edit" }
vw-api-app-provider-profiles = { path = "../api-app-provider-profiles" }
sha2 = "0.11"
agent-database = { path = "../agent-database" }
app-access-service = { path = "../app-access-service" }
vw-api-transport = { path = "../api-transport" }
vw-agent-apps = { path = "../../vw-agent-apps" }
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
libc = "0.2"


[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-app-provider = { path = "../gateway-app-provider" }
vw-api-transport = { path = "../api-transport" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
