[package]
name = "gateway-app-auth"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
vw-api-app-auth = { path = "../api-app-auth" }
gateway-http = { path = "../gateway-http" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[dev-dependencies]
vw-api-transport = { path = "../api-transport" }
serde_json = "1"
tracing = "0.1"
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
