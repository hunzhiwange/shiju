[package]
name = "gateway-app-data"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
gateway-http = { path = "../gateway-http" }
gateway-endpoint = { path = "../gateway-endpoint" }
vw-api-app-operations = { path = "../api-app-operations" }
vw-api-transport = { path = "../api-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query", "stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
