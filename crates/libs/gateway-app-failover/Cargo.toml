[package]
name = "gateway-app-failover"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
vw-api-app-failover = { path = "../api-app-failover" }
gateway-http = { path = "../gateway-http" }
vw-api-types = { path = "../../vw-api-types" }
vw-api-transport = { path = "../api-transport" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[dev-dependencies]
vw-api-app-identity = { path = "../api-app-identity" }
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
