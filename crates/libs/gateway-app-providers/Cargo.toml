[package]
name = "gateway-app-providers"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-task = { path = "../api-task", version = "0.6.0" }
vw-api-app-provider-extended = { path = "../api-app-provider-extended", version = "0.6.0" }
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
vw-api-app-provider-terminal = { path = "../api-app-provider-terminal", version = "0.6.0" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0" }
app-access-service = { path = "../app-access-service", version = "0.6.0" }
app-provider-services = { path = "../app-provider-services", version = "0.6.0" }
agent-app-services = { path = "../agent-app-services", version = "0.6.0" }
model-catalog = { path = "../model-catalog", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-app-provider-base = { path = "../api-app-provider-base", version = "0.6.0" }
vw-api-app-provider-edit = { path = "../api-app-provider-edit", version = "0.6.0" }
vw-api-app-provider-profiles = { path = "../api-app-provider-profiles", version = "0.6.0" }
vw-api-app-aggregation = { path = "../api-app-aggregation", version = "0.6.0" }
vw-api-app-auth = { path = "../api-app-auth", version = "0.6.0" }
vw-api-app-operations = { path = "../api-app-operations", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0" }

[dev-dependencies]
gateway-aggregation = { path = "../gateway-aggregation", version = "0.6.0" }
gateway-types = { path = "../gateway-types", version = "0.6.0" }
hex = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }

app-settings-store = { path = "../app-settings-store", version = "0.6.0" }
gateway-app-routing = { path = "../gateway-app-routing", version = "0.6.0" }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
gateway-app-provider = { path = "../gateway-app-provider", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
vw-gateway-client = { path = "../../vw-gateway-client", version = "0.6.0" }
vw-api-model-catalog = { path = "../api-model-catalog", version = "0.6.0" }
base64 = "0.22"
agent-gateway = { path = "../agent-gateway", version = "0.6.0" }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
