[package]
name = "gateway-app-routing"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
vw-api-app-diagnostics = { path = "../api-app-diagnostics" }
vw-api-app-routing = { path = "../api-app-routing" }
gateway-http = { path = "../gateway-http" }
gateway-endpoint = { path = "../gateway-endpoint" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-transport = { path = "../api-transport" }
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
product-version = { path = "../product-version" }
gateway-app-failover = { path = "../gateway-app-failover" }
vw-api-app-provider-edit = { path = "../api-app-provider-edit" }
tempfile = "3"
hex = "0.4"
model-http-client = { path = "../model-http-client" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
agent-gateway = { path = "../agent-gateway", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
sha2 = "0.11"
gateway-agent-apps = { path = "../gateway-agent-apps" }
gateway-app-providers = { path = "../gateway-app-providers" }
gateway-aggregation = { path = "../gateway-aggregation" }
gateway-mcp = { path = "../gateway-mcp" }
agent-app-services = { path = "../agent-app-services" }
vw-api-app-operations = { path = "../api-app-operations" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment" }
vw-api-app-aggregation = { path = "../api-app-aggregation" }
vw-api-app-auth = { path = "../api-app-auth" }
agent-paths = { path = "../agent-paths" }
axum = { version = "0.8.8", default-features = false, features = ["json"] }
agent-gateway = { path = "../agent-gateway" }
app-routing-policy = { path = "../app-routing-policy" }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
desktop-release = { path = "../desktop-release" }
app-routing-services = { path = "../app-routing-services" }
app-access-service = { path = "../app-access-service" }
agent-database = { path = "../agent-database" }
vw-agent-apps = { path = "../../vw-agent-apps" }
vw-api-app-failover = { path = "../api-app-failover" }
app-provider-services = { path = "../app-provider-services" }
app-settings-store = { path = "../app-settings-store" }
uuid = { version = "1.11", features = ["v4", "js"] }
secret-store = { path = "../secret-store" }
anyhow = "1"
tracing = "0.1"

[dev-dependencies.tower]
version = "0.5"
features = ["util"]
[dev-dependencies.vw-api-app-provider-base]
path = "../api-app-provider-base"
[dev-dependencies.vw-api-app-provider-profiles]
path = "../api-app-provider-profiles"
