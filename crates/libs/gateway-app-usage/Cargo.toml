[package]
name = "gateway-app-usage"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-app-lifecycle = { path = "../gateway-app-lifecycle" }
vw-api-apps-usage = { path = "../api-apps-usage" }
vw-api-app-auth = { path = "../api-app-auth" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-operations = { path = "../api-app-operations" }
vw-api-task = { path = "../api-task" }
gateway-http = { path = "../gateway-http" }
vw-api-transport = { path = "../api-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query", "stream"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
