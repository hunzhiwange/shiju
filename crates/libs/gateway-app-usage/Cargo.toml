[package]
name = "gateway-app-usage"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
gateway-app-lifecycle = { path = "../gateway-app-lifecycle", version = "0.6.0" }
vw-api-apps-usage = { path = "../api-apps-usage", version = "0.6.0" }
vw-api-app-auth = { path = "../api-app-auth", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-app-operations = { path = "../api-app-operations", version = "0.6.0" }
vw-api-task = { path = "../api-task", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query", "stream"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
