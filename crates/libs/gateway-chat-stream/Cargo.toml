[package]
name = "gateway-chat-stream"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
vw-api-chat = { path = "../api-chat" }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-http = { path = "../gateway-http" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "stream", "rustls"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query", "stream"] }

[dev-dependencies]
vw-api-transport = { path = "../api-transport" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
