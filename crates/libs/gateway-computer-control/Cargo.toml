[package]
name = "gateway-computer-control"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
vw-api-computer-control = { path = "../api-computer-control" }
gateway-http = { path = "../gateway-http" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query", "stream"] }

[dev-dependencies]
serde_json = "1"
vw-api-transport = { path = "../api-transport" }
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }

[lib]
doctest = false

[target.'cfg(unix)'.dependencies]
axum = { version = "0.8.8", features = ["json"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
libc = "0.2"
tokio = { version = "1", features = ["sync"] }
agent-config = { path = "../agent-config" }
computer-control = { path = "../computer-control" }
config-computer-control = { path = "../config-computer-control" }
gateway-pairing = { path = "../gateway-pairing" }
gateway-types = { path = "../gateway-types" }
tool-computer = { path = "../tool-computer" }
vw-api-transport = { path = "../api-transport" }

[target.'cfg(unix)'.dev-dependencies]
tower = { version = "0.5", features = ["util"] }
