[package]
name = "gateway-config"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-http = { path = "../gateway-http" }
vw-api-transport = { path = "../api-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
gateway-endpoint = { path = "../gateway-endpoint" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-config = { path = "../agent-config" }
agent-provider = { path = "../agent-provider" }
gateway-types = { path = "../gateway-types" }
gateway-pairing = { path = "../gateway-pairing" }
axum = "0.8"
parking_lot = "0.12"
toml = "0.9"
config-agent = { path = "../config-agent" }
acp-agent-registry = { path = "../acp-agent-registry" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-database = { path = "../agent-database" }
agent-gateway = { path = "../agent-gateway" }
config-agent-profile = { path = "../config-agent-profile" }
config-gateway = { path = "../config-gateway" }

[features]
host-test-support = ["dep:agent-database"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.agent-database]
path = "../agent-database"
optional = true
