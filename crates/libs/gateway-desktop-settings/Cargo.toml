[package]
name = "gateway-desktop-settings"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
gateway-http = { path = "../gateway-http" }
gateway-config = { path = "../gateway-config" }
vw-api-file = { path = "../api-file" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skill-market-types = { path = "../skill-market-types" }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
vw-api-transport = { path = "../api-transport" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
