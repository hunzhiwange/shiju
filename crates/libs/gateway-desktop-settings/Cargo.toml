[package]
name = "gateway-desktop-settings"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-config = { path = "../gateway-config", version = "0.6.0" }
vw-api-file = { path = "../api-file", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
