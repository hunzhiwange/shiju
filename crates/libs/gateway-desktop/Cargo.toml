[package]
name = "gateway-desktop"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
urlencoding = "2"
agent-skills = { path = "../agent-skills" }
agent-plugins = { path = "../agent-plugins" }
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
tool-browser = { path = "../tool-browser" }
once_cell = "1"
serde_yaml.workspace = true
toml = "0.9"
gateway-types = { path = "../gateway-types" }
agent-config = { path = "../agent-config" }
app-settings-store = { path = "../app-settings-store" }
agent-database = { path = "../agent-database" }
agent-storage = { path = "../agent-storage" }
agent-paths = { path = "../agent-paths" }
acp-types = { path = "../acp-types" }
acp-client = { path = "../acp-client" }
acp-agent-registry = { path = "../acp-agent-registry" }
config-acp-install = { path = "../config-acp-install" }
config-runtime-paths = { path = "../config-runtime-paths" }
config-tools = { path = "../config-tools" }
directories = "6"
flate2 = "1"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
semver = "1"
sha2 = "0.11"
shell-command = { path = "../shell-command" }
tar = "0.4"
tempfile = "3"
vw-api-file = { path = "../api-file" }
vw-api-transport = { path = "../api-transport" }
axum = { version = "0.8.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
tokio-util = "0.7.18"

[target.'cfg(windows)'.dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
agent-database = { path = "../agent-database", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
