[package]
name = "gateway-device-sync"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-http = { path = "../gateway-http", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
vw-api-app-operations = { path = "../api-app-operations", version = "0.6.0" }
vw-api-device-sync = { path = "../api-device-sync", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-database = { path = "../agent-database", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
device-sync = { path = "../device-sync", version = "0.6.0" }
app-access-service = { path = "../app-access-service", version = "0.6.0" }
agent-app-services = { path = "../agent-app-services", version = "0.6.0" }
app-settings-store = { path = "../app-settings-store", version = "0.6.0" }
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["rt", "macros"] }
vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0" }
axum = { version = "0.8.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }
