[package]
name = "gateway-dynamic-tools"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gateway-types = { path = "../gateway-types" }
session-port = { path = "../session-port" }
session-info = { path = "../session-info" }
vw-api-transport = { path = "../api-transport" }
vw-api-tools = { path = "../api-tools" }
axum = { version = "0.8.8", features = ["json"] }
futures-util = "0.3.32"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.session-engine]
path = "../session-engine"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.session-store]
path = "../session-store"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.agent-gateway]
path = "../agent-gateway"
