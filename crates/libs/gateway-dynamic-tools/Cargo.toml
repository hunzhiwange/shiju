[package]
name = "gateway-dynamic-tools"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gateway-types = { path = "../gateway-types", version = "0.6.0" }
session-port = { path = "../session-port", version = "0.6.0" }
session-info = { path = "../session-info", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-tools = { path = "../api-tools", version = "0.6.0" }
axum = { version = "0.8.8", features = ["json"] }
futures-util = "0.3.32"
serde = { version = "1", features = ["derive"] }
