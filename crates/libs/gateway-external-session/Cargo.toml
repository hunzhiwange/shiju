[package]
name = "gateway-external-session"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
gateway-app-read = { path = "../gateway-app-read" }
gateway-http = { path = "../gateway-http" }
vw-api-external-session = { path = "../api-external-session" }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
