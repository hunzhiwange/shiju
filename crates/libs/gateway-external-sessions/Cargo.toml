[package]
name = "gateway-external-sessions"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hex = "0.4"
app-access-service = { path = "../app-access-service" }
agent-database = { path = "../agent-database" }
agent-paths = { path = "../agent-paths" }
agent-usage = { path = "../agent-usage" }
vw-api-external-session = { path = "../api-external-session" }
vw-api-transport = { path = "../api-transport" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-agent-apps = { path = "../../vw-agent-apps" }
anyhow = "1"
axum = { version = "0.8.8", features = ["json"] }
chrono = "0.4"
futures-util = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
app-settings-store = { path = "../app-settings-store" }
app-provider-services = { path = "../app-provider-services" }
agent-app-services = { path = "../agent-app-services" }
vw-api-app-auth = { path = "../api-app-auth" }
vw-api-task = { path = "../api-task" }
sha2 = "0.11"
libc = "0.2"

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"
