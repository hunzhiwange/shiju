[package]
name = "gateway-file"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
walkdir = "2"
gateway-types = { path = "../gateway-types" }
agent-files = { path = "../agent-files" }
agent-project = { path = "../agent-project" }
session-instructions = { path = "../session-instructions" }
worktree-core = { path = "../worktree-core" }
vw-api-file = { path = "../api-file" }
vw-api-transport = { path = "../api-transport" }
axum = { version = "0.8.8", features = ["json"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
url = "2"
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-project = { path = "../agent-project", features = ["test-support"] }
worktree-core = { path = "../worktree-core", features = ["test-support"] }
encoding_rs = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.11", features = ["v4", "js"] }

[dev-dependencies]
config-runtime-paths = { path = "../config-runtime-paths" }
