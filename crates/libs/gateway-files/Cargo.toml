[package]
name = "gateway-files"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
vw-api-file = { path = "../api-file" }
gateway-http = { path = "../gateway-http" }
vw-api-transport = { path = "../api-transport" }
gateway-project = { path = "../gateway-project" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
