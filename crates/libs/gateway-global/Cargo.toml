[package]
name = "gateway-global"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-bus = { path = "../agent-bus", version = "0.6.0" }
agent-config = { path = "../agent-config", version = "0.6.0" }
agent-health = { path = "../agent-health", version = "0.6.0" }
agent-installation = { path = "../agent-installation", version = "0.6.0" }
agent-project = { path = "../agent-project", version = "0.6.0" }
gateway-types = { path = "../gateway-types", version = "0.6.0" }
acp-agent-registry = { path = "../acp-agent-registry", version = "0.6.0" }
shell-command = { path = "../shell-command", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-stream = "0.1"
