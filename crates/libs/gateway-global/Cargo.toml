[package]
name = "gateway-global"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-bus = { path = "../agent-bus" }
agent-config = { path = "../agent-config" }
agent-health = { path = "../agent-health" }
agent-installation = { path = "../agent-installation" }
agent-project = { path = "../agent-project" }
gateway-types = { path = "../gateway-types" }
acp-agent-registry = { path = "../acp-agent-registry" }
shell-command = { path = "../shell-command" }
vw-api-transport = { path = "../api-transport" }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-stream = "0.1"
