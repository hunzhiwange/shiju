[package]
name = "gateway-hermes-dashboard"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt", "macros", "process", "sync"] }
uuid = { version = "1.11", features = ["v4"] }
libc = "0.2"
app-access-service = { path = "../app-access-service" }
app-lifecycle = { path = "../app-lifecycle" }
app-discovery = { path = "../app-discovery" }
app-launch = { path = "../app-launch" }
app-workspace-memory = { path = "../app-workspace-memory" }
vw-api-hermes-dashboard = { path = "../api-hermes-dashboard" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-app-operations = { path = "../api-app-operations" }
vw-api-transport = { path = "../api-transport" }
