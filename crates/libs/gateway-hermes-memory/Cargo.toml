[package]
name = "gateway-hermes-memory"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
vw-api-hermes-dashboard = { path = "../api-hermes-dashboard" }
vw-api-hermes-memory = { path = "../api-hermes-memory" }
gateway-http = { path = "../gateway-http" }
vw-api-transport = { path = "../api-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query", "stream"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
vw-api-app-identity = { path = "../api-app-identity" }
app-provider-native = { path = "../app-provider-native" }
app-auth = { path = "../app-auth" }
app-config-write = { path = "../app-config-write" }
app-workspace-memory = { path = "../app-workspace-memory" }
app-workspace-paths = { path = "../app-workspace-paths" }
