[package]
name = "gateway-hermes-memory"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
vw-api-hermes-dashboard = { path = "../api-hermes-dashboard", version = "0.6.0" }
vw-api-hermes-memory = { path = "../api-hermes-memory", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query", "stream"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
app-provider-native = { path = "../app-provider-native", version = "0.6.0" }
app-auth = { path = "../app-auth", version = "0.6.0" }
app-config-write = { path = "../app-config-write", version = "0.6.0" }
app-workspace-memory = { path = "../app-workspace-memory", version = "0.6.0" }
app-workspace-paths = { path = "../app-workspace-paths", version = "0.6.0" }
