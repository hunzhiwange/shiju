[package]
name = "gateway-hooks"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-config = { path = "../agent-config" }
agent-hooks = { path = "../agent-hooks" }
agent-plugins = { path = "../agent-plugins" }
plugin-types = { path = "../plugin-types" }
gateway-types = { path = "../gateway-types" }
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
anyhow = "1"
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
