[package]
name = "gateway-hooks"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
agent-hooks = { path = "../agent-hooks", version = "0.6.0" }
agent-plugins = { path = "../agent-plugins", version = "0.6.0" }
plugin-types = { path = "../plugin-types", version = "0.6.0" }
gateway-types = { path = "../gateway-types", version = "0.6.0" }
gateway-desktop-settings = { path = "../gateway-desktop-settings", version = "0.6.0" }
anyhow = "1"
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
