[package]
name = "gateway-host-tools"
version = "0.6.0"
edition = "2024"
license = "MIT"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-chat-stream = { path = "../gateway-chat-stream", version = "0.6.0" }
vw-api-tools = { path = "../api-tools", version = "0.6.0" }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
serde_json = "1"

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
