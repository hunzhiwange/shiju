[package]
name = "gateway-inference"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-chat-stream = { path = "../gateway-chat-stream", version = "0.6.0" }
vw-api-agent-scheduler = { path = "../api-agent-scheduler", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
