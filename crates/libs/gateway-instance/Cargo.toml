[package]
name = "gateway-instance"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-bus = { path = "../agent-bus" }
agent-paths = { path = "../agent-paths" }
agent-project = { path = "../agent-project" }
config-runtime-paths = { path = "../config-runtime-paths" }
gateway-types = { path = "../gateway-types" }
git-discovery = { path = "../git-discovery" }
axum = "0.8"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-stream = "0.1"
