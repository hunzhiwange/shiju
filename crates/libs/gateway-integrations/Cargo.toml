[package]
name = "gateway-integrations"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-config = { path = "../agent-config" }
agent-integrations = { path = "../agent-integrations" }
axum = { version = "0.8.8", features = ["json"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
