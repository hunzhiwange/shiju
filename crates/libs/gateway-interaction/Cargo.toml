[package]
name = "gateway-interaction"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
gateway-http = { path = "../gateway-http" }
serde = { version = "1", features = ["derive"] }

serde_json = "1"
question-types = { path = "../question-types" }
vw-api-tools = { path = "../api-tools" }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
vw-api-transport = { path = "../api-transport" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
