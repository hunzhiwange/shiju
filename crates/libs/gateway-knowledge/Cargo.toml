[package]
name = "gateway-knowledge"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-http = { path = "../gateway-http", version = "0.6.0" }
vw-api-knowledge = { path = "../api-knowledge", version = "0.6.0" }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gateway-types = { path = "../gateway-types", version = "0.6.0" }
agent-config = { path = "../agent-config", version = "0.6.0" }
agent-memory = { path = "../agent-memory", version = "0.6.0" }
agent-knowledge = { path = "../agent-knowledge", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gateway-pairing = { path = "../gateway-pairing", version = "0.6.0" }
observer-backends = { path = "../observer-backends", version = "0.6.0" }
model-types = { path = "../model-types", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
parking_lot = "0.12"
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dev-dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dev-dependencies]
rusqlite = "0.37.0"
