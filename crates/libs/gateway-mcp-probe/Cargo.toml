[package]
name = "gateway-mcp-probe"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
vw-api-app-diagnostics = { path = "../api-app-diagnostics" }
vw-api-transport = { path = "../api-transport" }
gateway-http = { path = "../gateway-http" }
gateway-app-settings = { path = "../gateway-app-settings" }
vw-api-mcp-management = { path = "../api-mcp-management" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
