[package]
name = "gateway-memory"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gateway-types = { path = "../gateway-types" }
memory-types = { path = "../memory-types" }
axum = { version = "0.8.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-config = { path = "../agent-config" }
gateway-pairing = { path = "../gateway-pairing" }
model-types = { path = "../model-types" }
observer-backends = { path = "../observer-backends" }
anyhow = "1"
async-trait = "0.1"
parking_lot = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
