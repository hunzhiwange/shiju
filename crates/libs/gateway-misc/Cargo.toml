[package]
name = "gateway-misc"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
config-agent = { path = "../config-agent", version = "0.6.0" }
agent-commands = { path = "../agent-commands", version = "0.6.0" }
gateway-types = { path = "../gateway-types", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
test-support = ["dep:tempfile"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tempfile]
version = "3"
optional = true
