[package]
name = "gateway-model-catalog"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
vw-api-model-catalog = { path = "../api-model-catalog" }
gateway-http = { path = "../gateway-http" }
vw-api-app-identity = { path = "../api-app-identity" }
vw-api-transport = { path = "../api-transport" }
vw-api-types = { path = "../../vw-api-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
