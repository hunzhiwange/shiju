[package]
name = "gateway-model-provider"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
model-types = { path = "../model-types", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
vw-shared = { path = "../../vw-shared", version = "0.6.0" }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
