[package]
name = "gateway-model-provider"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
model-types = { path = "../model-types" }
gateway-http = { path = "../gateway-http" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
vw-api-transport = { path = "../api-transport" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
