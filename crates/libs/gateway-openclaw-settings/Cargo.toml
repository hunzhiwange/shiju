[package]
name = "gateway-openclaw-settings"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
vw-api-openclaw-settings = { path = "../api-openclaw-settings", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query", "stream"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }
app-openclaw-config-rules = { path = "../app-openclaw-config-rules", version = "0.6.0" }
vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0" }

app-access-service = { path = "../app-access-service", version = "0.6.0" }
[target.'cfg(target_os = "macos")'.dev-dependencies]
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
