[package]
name = "gateway-pairing"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
parking_lot = "0.12"
rand = "0.10.3"
sha2 = "0.11"
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }
vw-config-types = { path = "../../vw-config-types", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util", "process", "signal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "time", "rt", "process", "signal"] }
