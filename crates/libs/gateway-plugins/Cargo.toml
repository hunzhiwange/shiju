[package]
name = "gateway-plugins"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-config = { path = "../agent-config" }
agent-plugins = { path = "../agent-plugins" }
config-plugins = { path = "../config-plugins" }
gateway-types = { path = "../gateway-types" }
gateway-desktop-settings = { path = "../gateway-desktop-settings" }
plugin-install = { path = "../plugin-install" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
plugin-hooks = { path = "../plugin-hooks" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
gateway-endpoint = { path = "../gateway-endpoint" }
vw-gateway-client = { path = "../../vw-gateway-client" }
plugin-mcp = { path = "../plugin-mcp" }
