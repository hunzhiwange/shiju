[package]
name = "gateway-project-profile"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
vw-api-project-profiles = { path = "../api-project-profiles", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-project = { path = "../gateway-project", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }
