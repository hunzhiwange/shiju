[package]
name = "gateway-project"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-project = { path = "../agent-project" }
agent-files = { path = "../agent-files" }
agent-database = { path = "../agent-database" }
gateway-types = { path = "../gateway-types" }
worktree-core = { path = "../worktree-core" }
git-discovery = { path = "../git-discovery" }
app-settings-store = { path = "../app-settings-store" }
app-project-profiles = { path = "../app-project-profiles" }
app-operations = { path = "../app-operations" }
vw-api-project-profiles = { path = "../api-project-profiles" }
vw-api-app-provider-environment = { path = "../api-app-provider-environment" }
vw-agent-apps = { path = "../../vw-agent-apps" }
axum = "0.8.8"
base64 = "0.23"
anyhow = "1"
runtime-time = { path = "../runtime-time" }
uuid = { version = "1.11", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }


[dependencies]
vw-api-git = { path = "../api-git" }
vw-api-project = { path = "../api-project" }
vw-api-worktree = { path = "../api-worktree" }
gateway-http = { path = "../gateway-http" }
vw-api-transport = { path = "../api-transport" }
serde_json = "1"

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
