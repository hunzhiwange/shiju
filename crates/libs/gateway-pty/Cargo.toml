[package]
name = "gateway-pty"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-http = { path = "../gateway-http" }
vw-api-transport = { path = "../api-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-pty = { path = "../agent-pty" }
gateway-types = { path = "../gateway-types" }
axum = { version = "0.8.8", features = ["json", "ws"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
