[package]
name = "gateway-session"
version = "0.7.10"
edition = "2024"
license = "MIT"

[features]
test-support = ["dep:acp-agent-registry", "tokio/process", "tokio/rt-multi-thread", "tokio/net", "tokio/time", "dep:url", "dep:rusqlite", "dep:reqwest", "dep:parking_lot", "dep:llm-runtime", "dep:tower", "dep:futures-util", "dep:hex", "dep:sha2", "dep:uuid", "dep:agent-storage", "dep:tempfile", "dep:vw-api-todo", "dep:agent-env", "dep:agent-config", "dep:model-types", "dep:async-trait"]

[lib]
doctest = false

[dependencies]
acp-agent-registry = { path = "../acp-agent-registry", optional = true }
anyhow = "1"
session-info = { path = "../session-info" }
session-ui-types = { path = "../session-ui-types" }
vw-api-session = { path = "../api-session" }
todo-types = { path = "../todo-types" }
gateway-http = { path = "../gateway-http" }
gateway-chat-stream = { path = "../gateway-chat-stream" }
vw-api-transport = { path = "../api-transport" }
vw-api-acp-model = { path = "../api-acp-model" }
vw-api-chat-identity = { path = "../api-chat-identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
url = { version = "2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"], optional = true }
parking_lot = { version = "0.12", optional = true }
llm-runtime = { path = "../llm-runtime", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
futures-util = { version = "0.3", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
agent-storage = { path = "../agent-storage", optional = true }
agent-env = { path = "../agent-env", optional = true }
agent-config = { path = "../agent-config", optional = true }
model-types = { path = "../model-types", optional = true }
async-trait = { version = "0.1", optional = true }
agent-paths = { path = "../agent-paths" }
tempfile = { version = "3", optional = true }
vw-api-todo = { path = "../api-todo", optional = true }
tool-context = { path = "../tool-context" }
tool-assembly = { path = "../tool-assembly" }
ordered-id = { path = "../ordered-id" }
agent-provider = { path = "../agent-provider" }
agent-snapshot = { path = "../agent-snapshot" }
agent-installation = { path = "../agent-installation" }
session-text = { path = "../session-text" }
config-aggregate = { path = "../config-aggregate" }
config-reliability = { path = "../config-reliability" }
config-agent-profile = { path = "../config-agent-profile" }
vw-api-chat = { path = "../api-chat" }
gateway-resumable-stream = { path = "../gateway-resumable-stream" }
runtime-time = { path = "../runtime-time" }
web-time = "1"
tokio-util = { version = "0.7", features = ["rt"] }
agent-project = { path = "../agent-project" }
agent-database = { path = "../agent-database" }
snapshot-types = { path = "../snapshot-types" }
permission-types = { path = "../permission-types" }
storage-types = { path = "../storage-types" }
worktree-core = { path = "../worktree-core" }
tokio = { version = "1", features = ["rt", "sync", "fs"] }
tracing = "0.1"
config-agent = { path = "../config-agent" }
gateway-types = { path = "../gateway-types" }
gateway-instance = { path = "../gateway-instance" }
session-engine = { path = "../session-engine" }
axum = "0.8"
session-port = { path = "../session-port" }
session-store = { path = "../session-store" }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dev-dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dev-dependencies]
rusqlite.workspace = true

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
vw-api-todo = { path = "../api-todo" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-gateway = { path = "../agent-gateway" }
agent-storage = { path = "../agent-storage" }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
config-runtime-paths = { path = "../config-runtime-paths" }
session-paths = { path = "../session-paths" }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"], optional = true }
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = { workspace = true, optional = true }
