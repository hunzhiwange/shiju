[package]
name = "gateway-session"
version = "0.6.0"
edition = "2024"
license = "MIT"

[features]
test-support = ["dep:tempfile", "dep:vw-api-todo", "dep:agent-env", "dep:agent-config", "dep:model-types", "dep:async-trait"]

[lib]
doctest = false

[dependencies]
anyhow = "1"
session-info = { path = "../session-info", version = "0.6.0" }
session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
vw-api-session = { path = "../api-session", version = "0.6.0" }
todo-types = { path = "../todo-types", version = "0.6.0" }
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-chat-stream = { path = "../gateway-chat-stream", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-acp-model = { path = "../api-acp-model", version = "0.6.0" }
vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-env = { path = "../agent-env", version = "0.6.0", optional = true }
agent-config = { path = "../agent-config", version = "0.6.0", optional = true }
model-types = { path = "../model-types", version = "0.6.0", optional = true }
async-trait = { version = "0.1", optional = true }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
tempfile = { version = "3", optional = true }
vw-api-todo = { path = "../api-todo", version = "0.6.0", optional = true }
tool-context = { path = "../tool-context", version = "0.6.0" }
tool-assembly = { path = "../tool-assembly", version = "0.6.0" }
ordered-id = { path = "../ordered-id", version = "0.6.0" }
agent-provider = { path = "../agent-provider", version = "0.6.0" }
agent-snapshot = { path = "../agent-snapshot", version = "0.6.0" }
agent-installation = { path = "../agent-installation", version = "0.6.0" }
session-text = { path = "../session-text", version = "0.6.0" }
config-aggregate = { path = "../config-aggregate", version = "0.6.0" }
config-reliability = { path = "../config-reliability", version = "0.6.0" }
config-agent-profile = { path = "../config-agent-profile", version = "0.6.0" }
vw-api-chat = { path = "../api-chat", version = "0.6.0" }
gateway-resumable-stream = { path = "../gateway-resumable-stream", version = "0.6.0" }
runtime-time = { path = "../runtime-time", version = "0.6.0" }
web-time = "1"
tokio-util = { version = "0.7", features = ["rt"] }
agent-project = { path = "../agent-project", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0" }
snapshot-types = { path = "../snapshot-types", version = "0.6.0" }
permission-types = { path = "../permission-types", version = "0.6.0" }
storage-types = { path = "../storage-types", version = "0.6.0" }
worktree-core = { path = "../worktree-core", version = "0.6.0" }
tokio = { version = "1", features = ["rt", "sync", "fs"] }
tracing = "0.1"
config-agent = { path = "../config-agent", version = "0.6.0" }
gateway-types = { path = "../gateway-types", version = "0.6.0" }
gateway-instance = { path = "../gateway-instance", version = "0.6.0" }
session-engine = { path = "../session-engine", version = "0.6.0" }
axum = "0.8"
session-port = { path = "../session-port", version = "0.6.0" }
session-store = { path = "../session-store", version = "0.6.0" }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dev-dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dev-dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-todo = { path = "../api-todo", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-gateway = { path = "../agent-gateway", version = "0.6.0" }
agent-storage = { path = "../agent-storage", version = "0.6.0" }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
session-paths = { path = "../session-paths", version = "0.6.0" }
tower = { version = "0.5", features = ["util"] }
