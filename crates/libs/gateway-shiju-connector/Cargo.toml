[package]
name = "gateway-shiju-connector"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
serde_json = "1"
gateway-http = { path = "../gateway-http", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
gateway-shiju-account = { path = "../gateway-shiju-account", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
