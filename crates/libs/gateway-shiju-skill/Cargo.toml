[package]
name = "gateway-shiju-skill"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
gateway-http = { path = "../gateway-http" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
gateway-shiju-account = { path = "../gateway-shiju-account" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[dev-dependencies]
gateway-endpoint = { path = "../gateway-endpoint" }
vw-api-transport = { path = "../api-transport" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
