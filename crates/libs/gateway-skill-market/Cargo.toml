[package]
name = "gateway-skill-market"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
fixture-support = ["server", "dep:base64", "dep:ring", "dep:sha2", "dep:hex", "dep:zip", "dep:async-trait", "dep:tower"]
server = ["dep:agent-skills", "dep:config-skills", "dep:config-runtime-paths", "dep:gateway-desktop-settings", "dep:axum", "dep:directories", "dep:url", "dep:tokio"]

[dependencies]
skill-market-types = { path = "../skill-market-types", version = "0.6.0" }
serde_json = "1"
gateway-http = { path = "../gateway-http", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-skills = { path = "../agent-skills", version = "0.6.0", optional = true }
config-skills = { path = "../config-skills", version = "0.6.0", optional = true }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0", optional = true }
gateway-desktop-settings = { path = "../gateway-desktop-settings", version = "0.6.0", optional = true }
axum = { version = "0.8.8", features = ["json"], optional = true }
directories = { version = "5", optional = true }
url = { version = "2", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
async-trait = "0.1.89"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.base64]
version = "0.22"
optional = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ring]
version = "0.17"
optional = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.sha2]
version = "0.11"
optional = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hex]
version = "0.4"
optional = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.zip]
version = "8.6"
default-features = false
features = ["deflate-flate2-zlib-rs"]
optional = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.async-trait]
version = "0.1"
optional = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tower]
version = "0.5"
features = ["util"]
optional = true
