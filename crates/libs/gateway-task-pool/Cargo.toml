[package]
name = "gateway-task-pool"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
gateway-chat-stream = { path = "../gateway-chat-stream", version = "0.6.0" }
vw-api-task = { path = "../api-task", version = "0.6.0" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }

[dev-dependencies]
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
