[package]
name = "gateway-task-pool"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
gateway-http = { path = "../gateway-http" }
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-chat-stream = { path = "../gateway-chat-stream" }
vw-api-task = { path = "../api-task" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }

[dev-dependencies]
vw-api-transport = { path = "../api-transport" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
