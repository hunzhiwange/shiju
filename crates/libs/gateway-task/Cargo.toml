[package]
name = "gateway-task"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-types = { path = "../gateway-types" }
gateway-resumable-stream = { path = "../gateway-resumable-stream" }
agent-database = { path = "../agent-database" }
agent-paths = { path = "../agent-paths" }
agent-project = { path = "../agent-project" }
task-lifecycle = { path = "../task-lifecycle" }
task-worktree-pool = { path = "../task-worktree-pool" }
vw-api-task = { path = "../api-task" }
vw-api-task-lifecycle = { path = "../api-task-lifecycle" }
vw-api-transport = { path = "../api-transport" }
anyhow = "1"
axum = { version = "0.8.8", features = ["json"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
agent-project = { path = "../agent-project", features = ["test-support"] }
agent-database = { path = "../agent-database", features = ["test-support"] }
config-runtime-paths = { path = "../config-runtime-paths" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
