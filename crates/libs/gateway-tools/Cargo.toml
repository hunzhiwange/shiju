[package]
name = "gateway-tools"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
gateway-types = { path = "../gateway-types", version = "0.6.0" }
vw-api-tools = { path = "../api-tools", version = "0.6.0" }
axum = { version = "0.8.8", features = ["json"] }
serde = "1"
serde_json = "1"
