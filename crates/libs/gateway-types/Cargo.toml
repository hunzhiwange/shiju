[package]
name = "gateway-types"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-config = { path = "../agent-config" }
gateway-error = { path = "../gateway-error" }
memory-types = { path = "../memory-types" }
observer-types = { path = "../observer-types" }
model-types = { path = "../model-types" }
gateway-pairing = { path = "../gateway-pairing" }
tool-types = { path = "../tool-types" }
channel-linq = { path = "../channel-linq" }
channel-nextcloud-talk = { path = "../channel-nextcloud-talk" }
channel-qq = { path = "../channel-qq" }
channel-wati = { path = "../channel-wati" }
channel-whatsapp = { path = "../channel-whatsapp" }
axum = { version = "0.8.8", features = ["json"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

vw-agent-apps = { path = "../../vw-agent-apps" }
vw-api-transport = { path = "../api-transport" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies.tower]
version = "0.5"
features = ["util"]
