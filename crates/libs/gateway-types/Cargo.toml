[package]
name = "gateway-types"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-config = { path = "../agent-config", version = "0.6.0" }
gateway-error = { path = "../gateway-error", version = "0.6.0" }
memory-types = { path = "../memory-types", version = "0.6.0" }
observer-types = { path = "../observer-types", version = "0.6.0" }
model-types = { path = "../model-types", version = "0.6.0" }
gateway-pairing = { path = "../gateway-pairing", version = "0.6.0" }
tool-types = { path = "../tool-types", version = "0.6.0" }
channel-linq = { path = "../channel-linq", version = "0.6.0" }
channel-nextcloud-talk = { path = "../channel-nextcloud-talk", version = "0.6.0" }
channel-qq = { path = "../channel-qq", version = "0.6.0" }
channel-wati = { path = "../channel-wati", version = "0.6.0" }
channel-whatsapp = { path = "../channel-whatsapp", version = "0.6.0" }
axum = { version = "0.8.8", features = ["json"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
