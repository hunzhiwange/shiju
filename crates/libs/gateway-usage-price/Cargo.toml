[package]
name = "gateway-usage-price"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
gateway-http = { path = "../gateway-http" }
vw-api-transport = { path = "../api-transport" }
gateway-usage-scan = { path = "../gateway-usage-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }
