[package]
name = "gateway-usage-read"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
gateway-http = { path = "../gateway-http", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-usage = { path = "../api-usage", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }

[dev-dependencies]
app-usage-store = { path = "../app-usage-store" }
rusqlite = { version = "0.37.0", features = ["bundled"] }
