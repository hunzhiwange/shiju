[package]
name = "gateway-usage"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-usage = { path = "../agent-usage" }
agent-database = { path = "../agent-database" }
vw-api-transport = { path = "../api-transport" }
vw-api-usage = { path = "../api-usage" }
vw-api-external-session = { path = "../api-external-session" }
provider-model-cache = { path = "../provider-model-cache" }
app-usage = { path = "../app-usage" }
app-usage-core = { path = "../app-usage-core" }
app-usage-store = { path = "../app-usage-store" }
app-usage-codex = { path = "../app-usage-codex" }
app-lifecycle = { path = "../app-lifecycle" }
anyhow = "1"
axum = { version = "0.8.8", features = ["json"] }
runtime-time = { path = "../runtime-time" }
futures-util = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
uuid = { version = "1.11", features = ["v4", "js"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite.workspace = true
