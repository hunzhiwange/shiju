[package]
name = "gateway-workflow"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-http = { path = "../gateway-http" }
gateway-chat-stream = { path = "../gateway-chat-stream" }
vw-api-workflow = { path = "../api-workflow" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
gateway-endpoint = { path = "../gateway-endpoint" }
vw-api-transport = { path = "../api-transport" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = "0.1"
tool-context = { path = "../tool-context" }
tool-assembly = { path = "../tool-assembly" }
session-store = { path = "../session-store" }
gateway-types = { path = "../gateway-types" }
workflow-engine = { path = "../workflow-engine" }
workflow-core = { path = "../workflow-core" }
agent-database = { path = "../agent-database" }
agent-paths = { path = "../agent-paths" }
vw-api-transport = { path = "../api-transport" }
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-stream = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-database = { path = "../agent-database", features = ["test-support"] }
workflow-template-contract = { path = "../workflow-template-contract" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
hex = "0.4"
sha2 = "0.11"
rusqlite = "0.37.0"
