[package]
name = "gateway-workflow"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-chat-stream = { path = "../gateway-chat-stream", version = "0.6.0" }
vw-api-workflow = { path = "../api-workflow", version = "0.6.0" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
gateway-endpoint = { path = "../gateway-endpoint", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = "0.1"
tool-context = { path = "../tool-context", version = "0.6.0" }
tool-assembly = { path = "../tool-assembly", version = "0.6.0" }
session-store = { path = "../session-store", version = "0.6.0" }
gateway-types = { path = "../gateway-types", version = "0.6.0" }
workflow-engine = { path = "../workflow-engine", version = "0.6.0" }
workflow-core = { path = "../workflow-core", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-stream = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
workflow-template-contract = { path = "../workflow-template-contract", version = "0.6.0" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
hex = "0.4"
sha2 = "0.11"
rusqlite = "0.37.0"
