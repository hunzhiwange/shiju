[package]
name = "gateway-workspace"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
axum = { version = "0.8.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
app-workspace-paths = { path = "../app-workspace-paths" }
app-lifecycle = { path = "../app-lifecycle" }
app-workspace-memory = { path = "../app-workspace-memory" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-workspace-memory = { path = "../api-workspace-memory", version = "0.6.0" }
vw-api-app-operations = { path = "../api-app-operations", version = "0.6.0" }
