[package]
name = "gateway-workspace"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
axum = { version = "0.8.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
app-workspace-paths = { path = "../app-workspace-paths" }
app-lifecycle = { path = "../app-lifecycle" }
app-workspace-memory = { path = "../app-workspace-memory" }
vw-api-transport = { path = "../api-transport" }
vw-api-workspace-memory = { path = "../api-workspace-memory" }
vw-api-app-operations = { path = "../api-app-operations" }

app-access-service = { path = "../app-access-service" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
vw-agent-apps = { path = "../../vw-agent-apps" }
serde_json = "1"
