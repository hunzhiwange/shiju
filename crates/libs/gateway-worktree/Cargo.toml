[package]
name = "gateway-worktree"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.8", features = ["json"] }
gateway-types = { path = "../gateway-types" }
worktree-core = { path = "../worktree-core" }
config-worktree = { path = "../config-worktree" }
vw-api-transport = { path = "../api-transport" }
vw-api-worktree = { path = "../api-worktree" }

gateway-project = { path = "../gateway-project" }
agent-config = { path = "../agent-config" }

[dev-dependencies]
worktree-core = { path = "../worktree-core", features = ["test-support"] }
session-info = { path = "../session-info" }
agent-paths = { path = "../agent-paths" }
agent-storage = { path = "../agent-storage" }
config-runtime-paths = { path = "../config-runtime-paths" }
tokio-util = { version = "0.7.18", features = ["rt"] }
agent-project = { path = "../agent-project", features = ["test-support"] }
agent-database = { path = "../agent-database", features = ["test-support"] }
session-store = { path = "../session-store" }
session-engine = { path = "../session-engine" }
tool-shell = { path = "../tool-shell" }
anyhow = "1"
tempfile = "3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
