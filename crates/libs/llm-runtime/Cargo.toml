[package]
name = "llm-runtime"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-provider = { path = "../agent-provider" }
model-selection = { path = "../model-selection" }
permission-runtime = { path = "../permission-runtime" }
web-time = "1"
tool-types = { path = "../tool-types" }
agent-skills = { path = "../agent-skills" }
config-skills = { path = "../config-skills" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "net", "time", "rt-multi-thread", "macros"] }
sha2 = "0.11"
hex = "0.4"
ring = "0.17.14"
app-settings-store = { path = "../app-settings-store" }
acp-types = { path = "../acp-types" }
vw-api-acp-model = { path = "../api-acp-model" }
vw-api-transport = { path = "../api-transport" }

acp-host-io = { path = "../acp-host-io" }
tokio-util = "0.7.18"

reqwest = { version = "0.13", default-features = false }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
tracing = "0.1"
acp-client = { path = "../acp-client" }
acp-storage = { path = "../acp-storage" }
acp-access-policy = { path = "../acp-access-policy" }
acp-agent-registry = { path = "../acp-agent-registry" }
acp-cli-model = { path = "../acp-cli-model" }
agent-config = { path = "../agent-config" }
model-types = { path = "../model-types" }
agent-multimodal = { path = "../agent-multimodal" }
message-types = { path = "../message-types" }
session-ui-types = { path = "../session-ui-types" }
vw-api-tools = { path = "../api-tools" }
vw-api-usage = { path = "../api-usage" }
acp-lifecycle = { path = "../acp-lifecycle" }
agent-auth = { path = "../agent-auth" }
agent-installation = { path = "../agent-installation" }
plugin-hooks = { path = "../plugin-hooks" }
storage-types = { path = "../storage-types" }
agent-env = { path = "../agent-env" }
agent-log = { path = "../agent-log" }
vw-api-chat-identity = { path = "../api-chat-identity" }

model-transport = { path = "../model-transport" }
model-relay-http = { path = "../model-relay-http" }
model-protocol = { path = "../model-protocol" }
model-protocols = { path = "../model-protocols" }
provider-protocol-routes = { path = "../provider-protocol-routes" }
model-state = { path = "../model-state" }
model-reasoning = { path = "../model-reasoning" }
tempfile = "3"
libc = "0.2"
toml = "0.9"
url = "2"
getrandom = "0.4"
shell-command = { path = "../shell-command" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aisdk = { workspace = true, features = ["full"] }
futures-util = "0.3.32"
uuid = { version = "1.11", features = ["v4", "js"] }
axum = "0.8"
tool-types = { path = "../tool-types" }
tool-catalog = { path = "../tool-catalog" }
agent-usage = { path = "../agent-usage" }

regex = "1"

[dev-dependencies]
async-trait = "0.1.89"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
agent-database = { path = "../agent-database", features = ["test-support"] }
tempfile = "3"
