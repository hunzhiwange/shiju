[package]
name = "llm-runtime"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-provider = { path = "../agent-provider", version = "0.6.0" }
model-selection = { path = "../model-selection", version = "0.6.0" }
permission-runtime = { path = "../permission-runtime", version = "0.6.0" }
web-time = "1"
tool-types = { path = "../tool-types", version = "0.6.0" }
agent-skills = { path = "../agent-skills", version = "0.6.0" }
config-skills = { path = "../config-skills", version = "0.6.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "net", "time", "rt-multi-thread", "macros"] }
sha2 = "0.11"
hex = "0.4"
ring = "0.17.14"
app-settings-store = { path = "../app-settings-store", version = "0.6.0" }
acp-types = { path = "../acp-types", version = "0.6.0" }
vw-api-acp-model = { path = "../api-acp-model", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }

acp-host-io = { path = "../acp-host-io", version = "0.6.0" }
tokio-util = "0.7.18"

reqwest = { version = "0.13", default-features = false }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
tracing = "0.1"
acp-client = { path = "../acp-client", version = "0.6.0" }
acp-storage = { path = "../acp-storage", version = "0.6.0" }
acp-access-policy = { path = "../acp-access-policy", version = "0.6.0" }
acp-agent-registry = { path = "../acp-agent-registry", version = "0.6.0" }
acp-cli-model = { path = "../acp-cli-model", version = "0.6.0" }
agent-config = { path = "../agent-config", version = "0.6.0" }
model-types = { path = "../model-types", version = "0.6.0" }
agent-multimodal = { path = "../agent-multimodal", version = "0.6.0" }
message-types = { path = "../message-types", version = "0.6.0" }
session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
vw-api-tools = { path = "../api-tools", version = "0.6.0" }
vw-api-usage = { path = "../api-usage", version = "0.6.0" }
acp-lifecycle = { path = "../acp-lifecycle", version = "0.6.0" }
agent-auth = { path = "../agent-auth", version = "0.6.0" }
agent-installation = { path = "../agent-installation", version = "0.6.0" }
plugin-hooks = { path = "../plugin-hooks", version = "0.6.0" }
storage-types = { path = "../storage-types", version = "0.6.0" }
agent-env = { path = "../agent-env", version = "0.6.0" }
agent-log = { path = "../agent-log", version = "0.6.0" }
vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }

model-transport = { path = "../model-transport", version = "0.6.0" }
model-relay-http = { path = "../model-relay-http", version = "0.6.0" }
model-protocol = { path = "../model-protocol", version = "0.6.0" }
model-protocols = { path = "../model-protocols", version = "0.6.0" }
provider-protocol-routes = { path = "../provider-protocol-routes", version = "0.6.0" }
model-state = { path = "../model-state", version = "0.6.0" }
model-reasoning = { path = "../model-reasoning", version = "0.6.0" }
tempfile = "3"
libc = "0.2"
toml = "0.9"
url = "2"
getrandom = "0.4"
shell-command = { path = "../shell-command", version = "0.6.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aisdk = { git = "https://github.com/hunzhiwange/aisdk.git", rev = "3401d28a7353c6e90cf4372f52c682cb2d02986b", package = "vibewindow-aisdk", version = ">=0.7.1", features = ["full"] }
futures-util = "0.3.32"
uuid = { version = "1.11", features = ["v4", "js"] }
axum = "0.8"
tool-types = { path = "../tool-types", version = "0.6.0" }
tool-catalog = { path = "../tool-catalog", version = "0.6.0" }
agent-usage = { path = "../agent-usage", version = "0.6.0" }

[dev-dependencies]
async-trait = "0.1.89"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
tempfile = "3"
