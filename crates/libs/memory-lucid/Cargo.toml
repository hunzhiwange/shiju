[package]
name = "memory-lucid"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
memory-types = { path = "../memory-types", version = "0.6.0" }
memory-sqlite = { path = "../memory-sqlite", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util", "process", "signal"] }

[dev-dependencies]
tempfile = "3"
