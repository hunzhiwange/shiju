[package]
name = "model-protocol"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
regex = "1"
axum = { version = "0.8.8", default-features = false, features = ["json"] }
serde_json = "1"
model-types = { path = "../model-types", version = "0.6.0" }
vw-agent-apps = { path = "../../vw-agent-apps", version = "0.6.0" }
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
futures-util = "0.3.32"
model-protocols = { path = "../model-protocols", version = "0.6.0" }
tokio-util = "0.7.18"
tokio = { version = "1", features = ["macros"] }

model-relay-state = { path = "../model-relay-state", version = "0.6.0" }
model-reasoning = { path = "../model-reasoning", version = "0.6.0" }
parking_lot = "0.12"
uuid = { version = "1.11", features = ["v4", "js"] }
base64 = "0.23"
chrono = "0.4"
provider-model-discovery = { path = "../provider-model-discovery", version = "0.6.0" }

vw-api-model-catalog = { path = "../api-model-catalog", version = "0.6.0" }
vw-api-app-identity = { path = "../api-app-identity", version = "0.6.0" }

[dev-dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt"] }
