[package]
name = "model-protocol"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
url = "2"
regex = "1"
axum = { version = "0.8.8", default-features = false, features = ["json"] }
serde_json = "1"
model-types = { path = "../model-types" }
vw-agent-apps = { path = "../../vw-agent-apps" }
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
futures-util = "0.3.32"
model-protocols = { path = "../model-protocols" }
tokio-util = "0.7.18"
tokio = { version = "1", features = ["macros"] }

model-relay-state = { path = "../model-relay-state" }
model-reasoning = { path = "../model-reasoning" }
parking_lot = "0.12"
uuid = { version = "1.11", features = ["v4", "js"] }
base64 = "0.23"
runtime-time = { path = "../runtime-time" }
ring = "0.17.14"
getrandom = "0.4"
vw-api-transport = { path = "../api-transport" }
provider-model-discovery = { path = "../provider-model-discovery" }

vw-api-model-catalog = { path = "../api-model-catalog" }
vw-api-app-identity = { path = "../api-app-identity" }

[dev-dependencies]
model-state = { path = "../model-state" }
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
