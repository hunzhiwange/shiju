[package]
name = "model-relay-http"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
acceptance-diagnostics = []

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["json", "tokio", "http1"] }
futures-util = "0.3.32"
parking_lot = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tokio-util = "0.7.18"
agent-usage = { path = "../agent-usage", version = "0.6.0" }
model-transport = { path = "../model-transport", version = "0.6.0" }
model-protocol = { path = "../model-protocol", version = "0.6.0" }
model-protocols = { path = "../model-protocols", version = "0.6.0" }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
provider-protocol-routes = { path = "../provider-protocol-routes", version = "0.6.0" }
model-relay-state = { path = "../model-relay-state", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
tokio = { version = "1", features = ["io-util"] }
agent-auth = { path = "../agent-auth", version = "0.6.0" }
agent-provider = { path = "../agent-provider", version = "0.6.0" }
model-reasoning = { path = "../model-reasoning", version = "0.6.0" }
chrono = "0.4"
