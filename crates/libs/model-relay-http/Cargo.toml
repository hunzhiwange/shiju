[package]
name = "model-relay-http"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
acceptance-diagnostics = []
test-support = ["dep:reqwest", "dep:sha2", "dep:hex", "tokio/test-util", "tokio/process", "tokio/io-util"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
anyhow = "1"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["json", "tokio", "http1"] }
futures-util = "0.3.32"
parking_lot = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
tokio-util = "0.7.18"
agent-usage = { path = "../agent-usage" }
model-transport = { path = "../model-transport" }
model-protocol = { path = "../model-protocol" }
model-protocols = { path = "../model-protocols" }

[dev-dependencies]
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
provider-protocol-routes = { path = "../provider-protocol-routes" }
model-relay-state = { path = "../model-relay-state" }
vw-api-transport = { path = "../api-transport" }
tokio = { version = "1", features = ["io-util", "process", "test-util"] }
agent-auth = { path = "../agent-auth" }
agent-provider = { path = "../agent-provider" }
model-reasoning = { path = "../model-reasoning" }
runtime-time = { path = "../runtime-time" }
agent-config = { path = "../agent-config", features = ["test-support"] }
agent-project = { path = "../agent-project", features = ["test-support"] }
agent-database = { path = "../agent-database", features = ["test-support"] }
agent-paths = { path = "../agent-paths" }
agent-env = { path = "../agent-env" }
app-provider-services = { path = "../app-provider-services" }
app-models = { path = "../app-models" }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
tempfile = "3"
