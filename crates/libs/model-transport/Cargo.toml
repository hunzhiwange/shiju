[package]
name = "model-transport"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
model-http-client = { path = "../model-http-client" }
agent-provider = { path = "../agent-provider" }
agent-auth = { path = "../agent-auth" }
vw-agent-apps = { path = "../../vw-agent-apps" }
model-protocols = { path = "../model-protocols" }
provider-protocol-routes = { path = "../provider-protocol-routes" }
serde_json = "1"
model-relay-state = { path = "../model-relay-state" }
model-types = { path = "../model-types" }
auth-types = { path = "../auth-types" }
agent-env = { path = "../agent-env" }
anyhow = "1"
axum = { version = "0.8.8", default-features = false }
chrono = "0.4"
futures-util = "0.3.32"
model-protocol = { path = "../model-protocol" }
getrandom = "0.4"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "socks", "gzip", "brotli", "deflate", "zstd", "http2", "rustls"] }
ring = "0.17.14"
tokio = { version = "1", features = ["macros", "time"] }
tokio-util = "0.7.18"
vw-api-transport = { path = "../api-transport" }
vw-api-apps-usage = { path = "../api-apps-usage" }

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "time", "rt"] }
