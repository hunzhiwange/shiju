[package]
name = "model-types"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
model-protocols = { path = "../model-protocols", version = "0.6.0" }
model-reasoning = { path = "../model-reasoning", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1.89"
futures-util = "0.3.32"
thiserror = "2.0.18"
tool-types = { path = "../tool-types", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
