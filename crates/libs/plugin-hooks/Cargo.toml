[package]
name = "plugin-hooks"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-hooks = { path = "../agent-hooks" }
plugin-types = { path = "../plugin-types" }
anyhow = "1"
serde_json = "1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
tool-context = { path = "../tool-context", version = "0.6.0" }
tool-mcp = { path = "../tool-mcp", version = "0.6.0" }
tool-types = { path = "../tool-types", version = "0.6.0" }
mcp-client = { path = "../mcp-client", version = "0.6.0" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume"] }
tempfile = "3"
rmcp = { version = "0.8.0", default-features = false, features = ["client"] }
