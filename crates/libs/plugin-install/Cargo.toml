[package]
name = "plugin-install"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-skills = { path = "../agent-skills", version = "0.6.0" }
plugin-mcp = { path = "../plugin-mcp", version = "0.6.0" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume"] }
plugin-types = { path = "../plugin-types", version = "0.6.0" }
anyhow = "1"
config-skills = { path = "../config-skills", version = "0.6.0" }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
which = "6.0"
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
