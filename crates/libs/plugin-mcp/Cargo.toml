[package]
name = "plugin-mcp"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["dep:acp-types"]

[dependencies]
tracing = "0.1"
acp-types = { path = "../acp-types", optional = true }
session-port = { path = "../session-port" }
anyhow = "1"
serde_json = "1"
rmcp = { version = "0.8.0", features = ["client"] }
tokio = { version = "1", features = ["time", "macros", "net", "rt-multi-thread", "sync", "io-util"] }
tokio-util = "0.7.18"
chrono = "0.4"
url = "2"
agent-question = { path = "../agent-question" }
question-types = { path = "../question-types" }
network-policy = { path = "../network-policy" }
tool-types = { path = "../tool-types" }
vw-api-tools = { path = "../api-tools" }
vw-api-transport = { path = "../api-transport" }
mcp-client = { path = "../mcp-client" }
serde = { version = "1", features = ["derive"] }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume"] }
base64 = "0.23"
reqwest_012 = { package = "reqwest", version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
acp-config = { path = "../acp-config" }
sha2 = "0.10"
hex = "0.4"
tool-catalog = { path = "../tool-catalog" }
plugin-types = { path = "../plugin-types" }
agent-config = { path = "../agent-config" }
secret-store = { path = "../secret-store" }

uuid = { version = "1.11", features = ["v4", "js"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3"
