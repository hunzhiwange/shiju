[package]
name = "project-storage-paths"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
directories = "5"
git-discovery = { path = "../git-discovery", version = "0.6.0" }
hex = "0.4"
sha2 = "0.11"
vw-config-types = { path = "../../vw-config-types", version = "0.6.0" }

[dev-dependencies]
tempfile = "3"
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
