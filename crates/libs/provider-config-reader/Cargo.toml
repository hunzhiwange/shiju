[package]
name = "provider-config-reader"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
config-aggregate = { path = "../config-aggregate" }
config-gateway = { path = "../config-gateway" }
serde_json = "1"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
once_cell = "1"
gateway-endpoint = { path = "../gateway-endpoint" }
gateway-config = { path = "../gateway-config" }
vw-gateway-client = { path = "../../vw-gateway-client" }
web-sys = { version = "0.3", features = ["Window", "Location"] }
