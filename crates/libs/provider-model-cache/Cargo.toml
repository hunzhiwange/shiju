[package]
name = "provider-model-cache"
version = "0.7.10"
edition = "2024"
license = "MIT"

[dependencies]
model-reasoning = { path = "../model-reasoning" }
provider-model-catalog = { path = "../provider-model-catalog" }
provider-request-identity = { path = "../provider-request-identity" }
provider-runtime-paths = { path = "../provider-runtime-paths" }
once_cell = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
tempfile = "3"
tracing = "0.1"

[dev-dependencies]
model-state = { path = "../model-state" }
serde_json = "1"
