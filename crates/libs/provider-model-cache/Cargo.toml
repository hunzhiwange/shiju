[package]
name = "provider-model-cache"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
model-reasoning = { path = "../model-reasoning", version = "0.6.0" }
provider-model-catalog = { path = "../provider-model-catalog", version = "0.6.0" }
provider-request-identity = { path = "../provider-request-identity", version = "0.6.0" }
provider-runtime-paths = { path = "../provider-runtime-paths", version = "0.6.0" }
once_cell = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
