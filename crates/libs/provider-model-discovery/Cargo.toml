[package]
name = "provider-model-discovery"
version = "0.7.10"
edition = "2024"
license = "MIT"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
model-types = { path = "../model-types" }
model-state = { path = "../model-state" }
provider-model-cache = { path = "../provider-model-cache" }
provider-model-catalog = { path = "../provider-model-catalog" }
auth-types = { path = "../auth-types" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
