[package]
name = "provider-model-discovery"
version = "0.6.0"
edition = "2024"
license = "MIT"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
model-state = { path = "../model-state", version = "0.6.0" }
provider-model-cache = { path = "../provider-model-cache", version = "0.6.0" }
provider-model-catalog = { path = "../provider-model-catalog", version = "0.6.0" }
vw-shared = { path = "../../vw-shared", version = "0.6.0" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
