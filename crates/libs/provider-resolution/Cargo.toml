[package]
name = "provider-resolution"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
model-state = { path = "../model-state" }
model-types = { path = "../model-types" }
model-reasoning = { path = "../model-reasoning" }
provider-state-cache = { path = "../provider-state-cache" }
provider-config-reader = { path = "../provider-config-reader" }
provider-model-cache = { path = "../provider-model-cache" }
once_cell = "1"
strsim = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
auth-types = { path = "../auth-types" }
provider-auth-reader = { path = "../provider-auth-reader" }
provider-model-discovery = { path = "../provider-model-discovery" }
serde_json = "1"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gateway-model-provider = { path = "../gateway-model-provider" }
