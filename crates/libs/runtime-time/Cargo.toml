[package]
name = "runtime-time"
version = "0.7.10"
edition = "2024"
license = "MIT"

[features]
named-time-zones = ["dep:chrono", "dep:tz-rs", "dep:tzdb"]

[dependencies]
chrono = { version = "0.4", default-features = false, optional = true }
tz-rs = { version = "0.7.3", default-features = false, features = ["alloc"], optional = true }
tzdb = { version = "0.7.3", default-features = false, optional = true }
web-time = "1.1.0"
