[package]
name = "secret-store"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
config-runtime-paths = { path = "../config-runtime-paths" }
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-database = { path = "../agent-database" }
vw-api-transport = { path = "../api-transport" }
config-gateway = { path = "../config-gateway" }
gateway-pairing = { path = "../gateway-pairing" }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
postgres = "0.19.12"

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-database = { path = "../agent-database", features = ["test-support"] }
