[package]
name = "security-audit"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.11", features = ["v4", "js"] }
vw-config-types = { path = "../../vw-config-types", version = "0.6.0" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "fs"] }
