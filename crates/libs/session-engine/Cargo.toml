[package]
name = "session-engine"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
llm-runtime = { path = "../llm-runtime", version = "0.6.0" }
tool-catalog = { path = "../tool-catalog", version = "0.6.0" }
config-tools = { path = "../config-tools", version = "0.6.0" }
agent-multimodal = { path = "../agent-multimodal", version = "0.6.0" }
agent-hooks = { path = "../agent-hooks", version = "0.6.0" }
gateway-error = { path = "../gateway-error", version = "0.6.0" }
vw-api-chat = { path = "../api-chat", version = "0.6.0" }
plugin-hooks = { path = "../plugin-hooks", version = "0.6.0" }
tool-context = { path = "../tool-context", version = "0.6.0" }
agent-text = { path = "../agent-text", version = "0.6.0" }
web-time = "1.1.0"
sha2 = "0.11"
hex = "0.4"
agent-skills = { path = "../agent-skills", version = "0.6.0" }
ordered-id = { path = "../ordered-id", version = "0.6.0" }
tool-types = { path = "../tool-types", version = "0.6.0" }
agent-util = { path = "../agent-util", version = "0.6.0" }
model-state = { path = "../model-state", version = "0.6.0" }
model-types = { path = "../model-types", version = "0.6.0" }
session-instructions = { path = "../session-instructions", version = "0.6.0" }
anyhow = "1"
config-agent = { path = "../config-agent", version = "0.6.0" }
config-agent-profile = { path = "../config-agent-profile", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }
serde_json = "1"
regex = "1"
session-port = { path = "../session-port", version = "0.6.0" }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
agent-database = { path = "../agent-database", version = "0.6.0" }
app-settings-store = { path = "../app-settings-store", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
agent-defaults = { path = "../agent-defaults", version = "0.6.0" }
agent-config = { path = "../agent-config", version = "0.6.0" }
permission-runtime = { path = "../permission-runtime", version = "0.6.0" }
agent-bus = { path = "../agent-bus", version = "0.6.0" }
agent-storage = { path = "../agent-storage", version = "0.6.0" }
agent-project = { path = "../agent-project", version = "0.6.0" }
message-types = { path = "../message-types", version = "0.6.0" }
session-info = { path = "../session-info", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aisdk = { git = "https://github.com/hunzhiwange/aisdk.git", rev = "3401d28a7353c6e90cf4372f52c682cb2d02986b", package = "vibewindow-aisdk", version = ">=0.7.1", features = ["full"] }

[dev-dependencies]
uuid = { version = "1.11", features = ["v4", "js"] }
