agent-database = { path = "../agent-database", version = "0.6.0" }
app-settings-store = { path = "../app-settings-store", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
agent-defaults = { path = "../agent-defaults", version = "0.6.0" }
agent-config = { path = "../agent-config", version = "0.6.0" }
permission-runtime = { path = "../permission-runtime", version = "0.6.0" }
agent-bus = { path = "../agent-bus", version = "0.6.0" }
agent-storage = { path = "../agent-storage", version = "0.6.0" }
agent-project = { path = "../agent-project", version = "0.6.0" }
message-types = { path = "../message-types", version = "0.6.0" }
session-info = { path = "../session-info", version = "0.6.0" }
agent-security = { path = "../agent-security", version = "0.6.0" }
runtime-flags = { path = "../runtime-flags", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gateway-http = { path = "../gateway-http", version = "0.6.0" }
gateway-host-tools = { path = "../gateway-host-tools", version = "0.6.0" }
acp-config = { path = "../acp-config", version = "0.6.0" }
acp-types = { path = "../acp-types", version = "0.6.0" }
mcp-client = { path = "../mcp-client", version = "0.6.0" }
aisdk = { git = "https://github.com/hunzhiwange/aisdk.git", rev = "3401d28a7353c6e90cf4372f52c682cb2d02986b", package = "vibewindow-aisdk", version = ">=0.7.1", features = ["full"] }

[dev-dependencies]
acp-client = { path = "../acp-client", version = "0.6.0" }
agent-project = { path = "../agent-project", version = "0.6.0", features = ["test-support"] }
shell-command = { path = "../shell-command", version = "0.6.0" }
tempfile = "3"
uuid = { version = "1.11", features = ["v4", "js"] }
async-trait = "0.1.89"
