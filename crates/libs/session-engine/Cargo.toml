[package]
name = "session-engine"
version = "0.7.10"
edition = "2024"
license = "MIT"

[features]
test-support = []

[lib]
doctest = false

[dependencies]
vw-api-session = { path = "../api-session" }
vw-api-todo = { path = "../api-todo" }
agent-log = { path = "../agent-log" }
agent-provider = { path = "../agent-provider" }
session-text = { path = "../session-text" }
time = "0.3"
agent-snapshot = { path = "../agent-snapshot" }
worktree-core = { path = "../worktree-core" }
tool-shell = { path = "../tool-shell" }
thiserror = "2"
tool-services = { path = "../tool-services" }
uuid = { version = "1.11", features = ["v4", "js"] }
tool-agents = { path = "../tool-agents" }
session-store = { path = "../session-store" }
vw-api-tools = { path = "../api-tools" }
tool-assembly = { path = "../tool-assembly" }
model-selection = { path = "../model-selection" }
todo-types = { path = "../todo-types" }
vw-api-acp-model = { path = "../api-acp-model" }
tracing = "0.1"
llm-runtime = { path = "../llm-runtime" }
tool-catalog = { path = "../tool-catalog" }
config-tools = { path = "../config-tools" }
agent-multimodal = { path = "../agent-multimodal" }
agent-hooks = { path = "../agent-hooks" }
gateway-error = { path = "../gateway-error" }
vw-api-chat = { path = "../api-chat" }
plugin-hooks = { path = "../plugin-hooks" }
tool-context = { path = "../tool-context" }
agent-text = { path = "../agent-text" }
web-time = "1.1.0"
sha2 = "0.11"
hex = "0.4"
agent-skills = { path = "../agent-skills" }
ordered-id = { path = "../ordered-id" }
tool-types = { path = "../tool-types" }
agent-util = { path = "../agent-util" }
model-state = { path = "../model-state" }
model-types = { path = "../model-types" }
session-instructions = { path = "../session-instructions" }
anyhow = "1"
config-agent = { path = "../config-agent" }
config-agent-profile = { path = "../config-agent-profile" }
serde = { version = "1", features = ["derive"] }
vw-api-chat-identity = { path = "../api-chat-identity" }
serde_json = "1"
regex = "1"
session-port = { path = "../session-port" }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
agent-database = { path = "../agent-database" }
app-settings-store = { path = "../app-settings-store" }
vw-api-transport = { path = "../api-transport" }
agent-defaults = { path = "../agent-defaults" }
agent-config = { path = "../agent-config" }
permission-runtime = { path = "../permission-runtime" }
agent-bus = { path = "../agent-bus" }
agent-storage = { path = "../agent-storage" }
agent-project = { path = "../agent-project" }
message-types = { path = "../message-types" }
session-info = { path = "../session-info" }
agent-security = { path = "../agent-security" }
runtime-flags = { path = "../runtime-flags" }
agent-paths = { path = "../agent-paths" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gateway-http = { path = "../gateway-http" }
gateway-host-tools = { path = "../gateway-host-tools" }
acp-config = { path = "../acp-config" }
acp-types = { path = "../acp-types" }
mcp-client = { path = "../mcp-client" }
aisdk = { git = "https://github.com/hunzhiwange/aisdk.git", rev = "3401d28a7353c6e90cf4372f52c682cb2d02986b", package = "vibewindow-aisdk", version = ">=0.7.1", features = ["full"] }

[dev-dependencies]
session-store = { path = "../session-store", features = ["test-support"] }
futures-util = "0.3"
acp-client = { path = "../acp-client" }
agent-project = { path = "../agent-project", features = ["test-support"] }
shell-command = { path = "../shell-command" }
tempfile = "3"
uuid = { version = "1.11", features = ["v4", "js"] }
async-trait = "0.1.89"
