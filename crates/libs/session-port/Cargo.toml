[package]
name = "session-port"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
tokio-util = { version = "0.7", features = ["rt"] }
tool-types = { path = "../tool-types" }
permission-types = { path = "../permission-types" }
project-types = { path = "../project-types" }
session-info = { path = "../session-info" }
message-types = { path = "../message-types" }
vw-api-transport = { path = "../api-transport" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
session-ui-types = { path = "../session-ui-types" }
vw-api-chat-identity = { path = "../api-chat-identity" }
config-agent = { path = "../config-agent" }

[dev-dependencies]
tempfile = "3"
uuid = { version = "1.11", features = ["v4", "js"] }
