[package]
name = "session-port"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
tokio-util = { version = "0.7", features = ["rt"] }
tool-types = { path = "../tool-types", version = "0.6.0" }
permission-types = { path = "../permission-types", version = "0.6.0" }
project-types = { path = "../project-types", version = "0.6.0" }
session-info = { path = "../session-info", version = "0.6.0" }
message-types = { path = "../message-types", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }
config-agent = { path = "../config-agent", version = "0.6.0" }

[dev-dependencies]
tempfile = "3"
uuid = { version = "1.11", features = ["v4", "js"] }
