[package]
name = "session-store"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["agent-project/test-support"]

[dependencies]
agent-project = { path = "../agent-project" }
agent-paths = { path = "../agent-paths" }
app-settings-store = { path = "../app-settings-store" }
session-paths = { path = "../session-paths" }
session-artifact-store = { path = "../session-artifact-store" }
config-runtime-paths = { path = "../config-runtime-paths" }
vw-api-acp-model = { path = "../api-acp-model" }
agent-multimodal = { path = "../agent-multimodal" }
worktree-core = { path = "../worktree-core" }
tracing = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }
agent-database = { path = "../agent-database" }
session-port = { path = "../session-port" }
session-info = { path = "../session-info" }
session-ui-types = { path = "../session-ui-types" }
message-types = { path = "../message-types" }
tool-catalog = { path = "../tool-catalog" }
tool-types = { path = "../tool-types" }
runtime-time = { path = "../runtime-time" }
vw-api-transport = { path = "../api-transport" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
agent-database = { path = "../agent-database", features = ["test-support"] }
agent-project = { path = "../agent-project" }
project-types = { path = "../project-types" }
async-trait = "0.1.89"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
