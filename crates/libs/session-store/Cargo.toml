[package]
name = "session-store"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["agent-project/test-support"]

[dependencies]
agent-project = { path = "../agent-project", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
app-settings-store = { path = "../app-settings-store", version = "0.6.0" }
session-paths = { path = "../session-paths", version = "0.6.0" }
session-artifact-store = { path = "../session-artifact-store", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
vw-api-acp-model = { path = "../api-acp-model", version = "0.6.0" }
agent-multimodal = { path = "../agent-multimodal", version = "0.6.0" }
worktree-core = { path = "../worktree-core", version = "0.6.0" }
tracing = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }
agent-database = { path = "../agent-database", version = "0.6.0" }
session-port = { path = "../session-port", version = "0.6.0" }
session-info = { path = "../session-info", version = "0.6.0" }
session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
message-types = { path = "../message-types", version = "0.6.0" }
tool-catalog = { path = "../tool-catalog", version = "0.6.0" }
tool-types = { path = "../tool-types", version = "0.6.0" }
runtime-time = { path = "../runtime-time", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
agent-project = { path = "../agent-project", version = "0.6.0" }
project-types = { path = "../project-types", version = "0.6.0" }
async-trait = "0.1.89"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
