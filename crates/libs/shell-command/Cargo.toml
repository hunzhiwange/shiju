[package]
name = "shell-command"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
once_cell = "1"
tokio = { version = "1", features = ["process"], optional = true }

[features]
shell-tokio = ["dep:tokio"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(windows))'.dev-dependencies]
libc = "0.2"
