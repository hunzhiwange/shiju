[package]
name = "shiju-client"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
chrono = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "brotli", "deflate", "zstd", "http2", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gateway-shiju-account = { path = "../gateway-shiju-account", version = "0.6.0" }
gateway-shiju-app = { path = "../gateway-shiju-app", version = "0.6.0" }
gateway-shiju-connector = { path = "../gateway-shiju-connector", version = "0.6.0" }
gateway-shiju-knowledge = { path = "../gateway-shiju-knowledge", version = "0.6.0" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
