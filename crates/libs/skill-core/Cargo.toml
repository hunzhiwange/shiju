[package]
name = "skill-core"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
tracing = "0.1"
clap = { version = "4.5", features = ["derive"] }
shell-command = { path = "../shell-command", version = "0.6.0" }
agent-log = { path = "../agent-log", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
config-skills = { path = "../config-skills", version = "0.6.0" }
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glob = "0.3"
serde_yaml = "0.9"
dialoguer = "0.11"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream", "socks", "blocking", "json", "gzip", "brotli", "deflate", "zstd", "http2", "rustls"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }

[dependencies.agent-cli-types]
path = "../agent-cli-types"
version = "0.6.0"
