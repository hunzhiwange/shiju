[package]
name = "syscall-anomaly"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
config-security = { path = "../config-security" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
regex = "1"
security-audit = { path = "../security-audit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
