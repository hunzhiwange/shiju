[package]
name = "task-file-store"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
task-types = { path = "../task-types", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
runtime-time = { path = "../runtime-time", version = "0.6.0" }
time = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
tempfile = "3"
