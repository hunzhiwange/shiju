[package]
name = "task-scheduler-core"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
serde_json = "1"
vw-api-agent-scheduler = { path = "../api-agent-scheduler" }
vw-api-transport = { path = "../api-transport" }
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
vw-api-task = { path = "../api-task" }
project-types = { path = "../project-types" }
task-worktree-pool = { path = "../task-worktree-pool" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
task-worktree-pool = { path = "../task-worktree-pool", features = ["test-support"] }
