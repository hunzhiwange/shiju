[package]
name = "task-scheduler"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["dep:tempfile", "agent-database/test-support", "agent-project/test-support"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
task-scheduler-core = { path = "../task-scheduler-core", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }

agent-database = { path = "../agent-database", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
agent-project = { path = "../agent-project", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
task-lifecycle = { path = "../task-lifecycle", version = "0.6.0" }
task-types = { path = "../task-types", version = "0.6.0" }
project-types = { path = "../project-types", version = "0.6.0" }
vw-api-task = { path = "../api-task", version = "0.6.0" }
vw-api-task-lifecycle = { path = "../api-task-lifecycle", version = "0.6.0" }
vw-api-agent-scheduler = { path = "../api-agent-scheduler", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }
tracing = "0.1"
session-port = { path = "../session-port", version = "0.6.0" }
tool-context = { path = "../tool-context", version = "0.6.0" }
task-worktree-pool = { path = "../task-worktree-pool", version = "0.6.0" }
tokio = { version = "1", features = ["rt", "time", "macros"] }
tokio-util = "0.7"
agent-cron = { path = "../agent-cron", version = "0.6.0" }
shell-command = { path = "../shell-command", version = "0.6.0" }
vw-api-chat = { path = "../api-chat", version = "0.6.0" }
vw-api-acp-model = { path = "../api-acp-model", version = "0.6.0" }
vw-api-chat-identity = { path = "../api-chat-identity", version = "0.6.0" }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
directories = "5"
tempfile = { version = "3", optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
agent-project = { path = "../agent-project", version = "0.6.0", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
