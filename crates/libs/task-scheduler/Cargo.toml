[package]
name = "task-scheduler"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = ["dep:tempfile", "agent-database/test-support", "agent-project/test-support"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
task-scheduler-core = { path = "../task-scheduler-core" }
vw-api-transport = { path = "../api-transport" }

agent-database = { path = "../agent-database" }
agent-paths = { path = "../agent-paths" }
agent-project = { path = "../agent-project" }
config-runtime-paths = { path = "../config-runtime-paths" }
task-lifecycle = { path = "../task-lifecycle" }
task-types = { path = "../task-types" }
project-types = { path = "../project-types" }
vw-api-task = { path = "../api-task" }
vw-api-task-lifecycle = { path = "../api-task-lifecycle" }
vw-api-agent-scheduler = { path = "../api-agent-scheduler" }
serde = { version = "1", features = ["derive"] }
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }
tracing = "0.1"
session-port = { path = "../session-port" }
tool-context = { path = "../tool-context" }
url = "2"
task-worktree-pool = { path = "../task-worktree-pool" }
tokio = { version = "1", features = ["rt", "time", "macros"] }
tokio-util = "0.7"
agent-cron = { path = "../agent-cron" }
shell-command = { path = "../shell-command" }
vw-api-chat = { path = "../api-chat" }
vw-api-acp-model = { path = "../api-acp-model" }
vw-api-chat-identity = { path = "../api-chat-identity" }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
directories = "6"
tempfile = { version = "3", optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-database = { path = "../agent-database", features = ["test-support"] }
agent-project = { path = "../agent-project", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
session-info = { path = "../session-info" }
session-ui-types = { path = "../session-ui-types" }
parking_lot = "0.12"
