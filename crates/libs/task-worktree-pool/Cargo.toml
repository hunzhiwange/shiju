[package]
name = "task-worktree-pool"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
# Existing host scheduler tests construct pools with an isolated root.
test-support = []

[dependencies]
anyhow = "1"
project-types = { path = "../project-types" }
vw-api-transport = { path = "../api-transport" }
vw-api-task = { path = "../api-task" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
