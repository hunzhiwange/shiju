[package]
name = "theme-store"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
serde_json = "1"
theme-model = { path = "../theme-model" }
tracing = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
