[package]
name = "tool-agents"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
futures-util = "0.3.32"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tool-types = { path = "../tool-types" }
tool-context = { path = "../tool-context" }
session-port = { path = "../session-port" }
session-info = { path = "../session-info" }
session-text = { path = "../session-text" }
config-agent = { path = "../config-agent" }
config-tools = { path = "../config-tools" }
agent-providers = { path = "../agent-providers" }
agent-security = { path = "../agent-security" }
model-types = { path = "../model-types" }
observer-types = { path = "../observer-types" }
vw-api-transport = { path = "../api-transport" }
vw-api-chat = { path = "../api-chat" }

[dev-dependencies]
permission-types = { path = "../permission-types" }
