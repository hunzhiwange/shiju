[package]
name = "tool-assembly"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
tempfile = { version = "3", optional = true }
anyhow = "1"
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tool-types = { path = "../tool-types" }
tool-context = { path = "../tool-context" }
vw-api-tools = { path = "../api-tools" }
model-types = { path = "../model-types" }
tool-web = { path = "../tool-web" }
tool-catalog = { path = "../tool-catalog" }
agent-config = { path = "../agent-config" }
agent-hooks = { path = "../agent-hooks" }
agent-security = { path = "../agent-security" }
plugin-mcp = { path = "../plugin-mcp" }
tool-mcp = { path = "../tool-mcp" }
mcp-client = { path = "../mcp-client" }
acp-config = { path = "../acp-config" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume"] }
tracing = "0.1"
config-agent = { path = "../config-agent" }
config-agent-profile = { path = "../config-agent-profile" }
agent-runtime = { path = "../agent-runtime" }
agent-memory = { path = "../agent-memory" }
runtime-types = { path = "../runtime-types" }
tool-agents = { path = "../tool-agents" }
syscall-anomaly = { path = "../syscall-anomaly" }
session-port = { path = "../session-port" }
vw-api-transport = { path = "../api-transport" }

permission-types = { path = "../permission-types" }
tool-files = { path = "../tool-files" }
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rmcp = { version = "0.8.0", default-features = false, features = ["client", "server", "transport-io"] }
reqwest_012 = { package = "reqwest", version = "0.12", default-features = false }

tool-shell = { path = "../tool-shell" }
tool-memory = { path = "../tool-memory" }
tool-services = { path = "../tool-services" }

tool-browser = { path = "../tool-browser" }

[features]
default = []
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3"
agent-paths = { path = "../agent-paths" }
tool-git = { path = "../tool-git" }
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
acp-types = { path = "../acp-types" }
agent-defaults = { path = "../agent-defaults" }
permission-runtime = { path = "../permission-runtime" }
agent-approval = { path = "../agent-approval" }
config-security = { path = "../config-security" }
agent-observability = { path = "../agent-observability" }

agent-skills = { path = "../agent-skills" }
