[package]
name = "tool-computer"
version.workspace = true
edition = "2024"
license = "MIT"

[features]
test-support = ["computer-control/test-support"]

[lib]
doctest = false

[target.'cfg(unix)'.dependencies]
computer-control = { path = "../computer-control" }
config-computer-control = { path = "../config-computer-control" }
tool-types = { path = "../tool-types" }
tool-context = { path = "../tool-context" }
vw-api-computer-control = { path = "../api-computer-control" }
vw-api-transport = { path = "../api-transport" }
vw-api-tools = { path = "../api-tools" }
anyhow = "1"
async-trait = "0.1.89"
base64 = "0.23"
hex = "0.4"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "io-util"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1.11", features = ["v4", "js"] }
