[package]
name = "tool-context"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
serde_json = "1"
tool-types = { path = "../tool-types", version = "0.6.0" }
vw-api-tools = { path = "../api-tools", version = "0.6.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tokio-util = "0.7"
model-types = { path = "../model-types", version = "0.6.0" }
permission-types = { path = "../permission-types", version = "0.6.0" }
config-agent = { path = "../config-agent", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }

[dev-dependencies]
tempfile = "3"
