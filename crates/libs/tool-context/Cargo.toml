[package]
name = "tool-context"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
serde_json = "1"
tool-types = { path = "../tool-types" }
vw-api-tools = { path = "../api-tools" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tokio-util = "0.7"
model-types = { path = "../model-types" }
permission-types = { path = "../permission-types" }
config-agent = { path = "../config-agent" }
vw-api-transport = { path = "../api-transport" }

[dev-dependencies]
tempfile = "3"
