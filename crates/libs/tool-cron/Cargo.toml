[package]
name = "tool-cron"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-config = { path = "../agent-config" }
agent-cron = { path = "../agent-cron" }
agent-security = { path = "../agent-security" }
tool-types = { path = "../tool-types" }
anyhow = "1"
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tempfile = { version = "3", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt", "fs", "net", "io-util", "time"] }

[features]
test-support = ["dep:tempfile", "dep:tokio"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "fs", "net", "io-util", "time"] }
