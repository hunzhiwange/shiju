[package]
name = "tool-files"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
rag-pdf = ["dep:pdf-extract"]

[dependencies]
glob = "0.3"
agent-multimodal = { path = "../agent-multimodal", version = "0.6.0" }
base64 = "0.23"
image = "0.25.9"
pdf-extract = { version = "0.12.0", optional = true }
anyhow = "1"
async-trait = "0.1.89"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["fs", "process", "time", "rt", "sync", "macros"] }
agent-security = { path = "../agent-security", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
agent-util = { path = "../agent-util", version = "0.6.0" }
agent-files = { path = "../agent-files", version = "0.6.0" }
shell-command = { path = "../shell-command", version = "0.6.0" }
tool-types = { path = "../tool-types", version = "0.6.0" }
tool-context = { path = "../tool-context", version = "0.6.0" }
vw-api-tools = { path = "../api-tools", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
which = "6.0"

[dev-dependencies]
tempfile = "3"
