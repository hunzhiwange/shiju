[package]
name = "tool-files"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
rag-pdf = []

[dependencies]
tracing = "0.1"
glob = "0.3"
agent-multimodal = { path = "../agent-multimodal" }
base64 = "0.23"
image = "0.25.9"
pdf-extract = "0.12.0"
anyhow = "1"
async-trait = "0.1.89"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["fs", "process", "time", "rt", "sync", "macros"] }
agent-security = { path = "../agent-security" }
agent-paths = { path = "../agent-paths" }
agent-util = { path = "../agent-util" }
agent-files = { path = "../agent-files" }
shell-command = { path = "../shell-command" }
tool-types = { path = "../tool-types" }
tool-context = { path = "../tool-context" }
vw-api-tools = { path = "../api-tools" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
which = "6.0"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
permission-types = { path = "../permission-types" }
vw-api-transport = { path = "../api-transport" }
tokio-util = "0.7"
