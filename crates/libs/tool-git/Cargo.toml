[package]
name = "tool-git"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
agent-security = { path = "../agent-security" }
worktree-core = { path = "../worktree-core" }
tool-types = { path = "../tool-types" }
tool-context = { path = "../tool-context" }
vw-api-tools = { path = "../api-tools" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tokio-util = "0.7"
permission-types = { path = "../permission-types" }
vw-api-transport = { path = "../api-transport" }
tempfile = "3"
