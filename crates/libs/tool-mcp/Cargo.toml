[package]
name = "tool-mcp"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
acp-config = { path = "../acp-config", version = "0.6.0" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume"] }
anyhow = "1"
async-trait = "0.1.89"
hex = "0.4"
mcp-client = { path = "../mcp-client", version = "0.6.0" }
plugin-mcp = { path = "../plugin-mcp", version = "0.6.0" }
rmcp = { version = "0.8.0", default-features = false, features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tool-context = { path = "../tool-context", version = "0.6.0" }
tool-types = { path = "../tool-types", version = "0.6.0" }
vw-api-tools = { path = "../api-tools", version = "0.6.0" }
vw-api-mcp-inspect = { path = "../api-mcp-inspect", version = "0.6.0" }
