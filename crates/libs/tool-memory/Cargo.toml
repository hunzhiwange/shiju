[package]
name = "tool-memory"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
agent-security = { path = "../agent-security", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
memory-types = { path = "../memory-types", version = "0.6.0" }
