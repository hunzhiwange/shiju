[package]
name = "tool-office"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(unix)'.dependencies]
anyhow = "1"
async-trait = "0.1.89"
computer-control = { path = "../computer-control", version = "0.6.0" }
config-computer-control = { path = "../config-computer-control", version = "0.6.0" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros"] }
tool-computer = { path = "../tool-computer", version = "0.6.0" }
tool-context = { path = "../tool-context", version = "0.6.0" }
tool-types = { path = "../tool-types", version = "0.6.0" }
uuid = { version = "1.11", features = ["v4", "js"] }
vw-api-computer-control = { path = "../api-computer-control", version = "0.6.0" }

[dev-dependencies]
agent-security = { path = "../agent-security", version = "0.6.0" }
permission-types = { path = "../permission-types", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
tempfile = "3"
parking_lot = "0.12"
futures-util = "0.3.32"
rustls-pki-types = "1.14.0"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = "0.7"
