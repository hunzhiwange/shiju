[package]
name = "tool-services"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
directories = "6"

[dev-dependencies]
config-security = { path = "../config-security" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
agent-config = { path = "../agent-config", features = ["test-support"] }

[dependencies]
session-store = { path = "../session-store" }
agent-skills = { path = "../agent-skills" }
permission-runtime = { path = "../permission-runtime" }
question-types = { path = "../question-types" }
todo-types = { path = "../todo-types" }
session-artifact-store = { path = "../session-artifact-store" }
session-ui-types = { path = "../session-ui-types" }
agent-project = { path = "../agent-project" }
agent-cron = { path = "../agent-cron" }
chrono = { version = "0.4", features = ["serde"] }
agent-config = { path = "../agent-config" }
config-agent = { path = "../config-agent" }
config-tools = { path = "../config-tools" }
tool-types = { path = "../tool-types" }
tool-context = { path = "../tool-context" }
tool-files = { path = "../tool-files" }
agent-security = { path = "../agent-security" }
agent-files = { path = "../agent-files" }
patch = { path = "../patch" }
plugin-install = { path = "../plugin-install" }
vw-api-tools = { path = "../api-tools" }
vw-api-transport = { path = "../api-transport" }
anyhow = "1"
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
agent-question = { path = "../agent-question" }
shell-command = { path = "../shell-command", features = ["shell-tokio"] }
agent-util = { path = "../agent-util" }
base64 = "0.23"
image = "0.25.9"
