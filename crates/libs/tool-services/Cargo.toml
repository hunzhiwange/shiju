[package]
name = "tool-services"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
directories = "6"

[dev-dependencies]
config-security = { path = "../config-security", version = "0.6.0" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
agent-config = { path = "../agent-config", version = "0.6.0", features = ["test-support"] }

[dependencies]
session-store = { path = "../session-store", version = "0.6.0" }
agent-skills = { path = "../agent-skills", version = "0.6.0" }
permission-runtime = { path = "../permission-runtime", version = "0.6.0" }
question-types = { path = "../question-types", version = "0.6.0" }
todo-types = { path = "../todo-types", version = "0.6.0" }
session-artifact-store = { path = "../session-artifact-store", version = "0.6.0" }
session-ui-types = { path = "../session-ui-types", version = "0.6.0" }
agent-project = { path = "../agent-project", version = "0.6.0" }
agent-cron = { path = "../agent-cron", version = "0.6.0" }
chrono = { version = "0.4", features = ["serde"] }
agent-config = { path = "../agent-config", version = "0.6.0" }
config-agent = { path = "../config-agent", version = "0.6.0" }
config-tools = { path = "../config-tools", version = "0.6.0" }
tool-types = { path = "../tool-types", version = "0.6.0" }
tool-context = { path = "../tool-context", version = "0.6.0" }
tool-files = { path = "../tool-files", version = "0.6.0" }
agent-security = { path = "../agent-security", version = "0.6.0" }
agent-files = { path = "../agent-files", version = "0.6.0" }
patch = { path = "../patch", version = "0.6.0" }
plugin-install = { path = "../plugin-install", version = "0.6.0" }
vw-api-tools = { path = "../api-tools", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
anyhow = "1"
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
agent-question = { path = "../agent-question", version = "0.6.0" }
shell-command = { path = "../shell-command", version = "0.6.0", features = ["shell-tokio"] }
agent-util = { path = "../agent-util", version = "0.6.0" }
base64 = "0.23"
image = "0.25.9"
