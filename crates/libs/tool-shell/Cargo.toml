[package]
name = "tool-shell"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
shell-words = "1"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-security = { path = "../agent-security" }
agent-runtime = { path = "../agent-runtime" }
runtime-types = { path = "../runtime-types" }
tool-types = { path = "../tool-types" }
tool-context = { path = "../tool-context" }
syscall-anomaly = { path = "../syscall-anomaly" }
shell-command = { path = "../shell-command" }
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
config-security = { path = "../config-security" }
permission-types = { path = "../permission-types" }
vw-api-transport = { path = "../api-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
tempfile = "3"

[features]
default = []
test-support = []
shell-ast = ["agent-security/shell-ast"]
sandbox-bubblewrap = ["agent-security/sandbox-bubblewrap"]
sandbox-landlock = ["agent-security/sandbox-landlock"]
