[package]
name = "tool-types"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vw-api-tools = { path = "../api-tools", version = "0.6.0" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
