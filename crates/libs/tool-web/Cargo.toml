[package]
name = "tool-web"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
doctest = false

[features]
default = []
firecrawl = []
web-fetch-html2md = ["dep:html2md"]
web-fetch-plaintext = ["dep:nanohtml2text"]

[dependencies]
agent-security = { path = "../agent-security" }
agent-config = { path = "../agent-config" }
config-tools = { path = "../config-tools" }
network-policy = { path = "../network-policy" }
tool-types = { path = "../tool-types" }
vw-api-tools = { path = "../api-tools" }
regex = "1"
urlencoding = "2.1"
anyhow = "1"
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
tracing = "0.1"
html2md = { version = "0.2.15", optional = true }
nanohtml2text = { version = "0.2.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "brotli", "deflate", "zstd", "http2", "rustls", "socks"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
