[package]
name = "tui-cells"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
tui-contracts = { path = "../tui-contracts" }
tui-markdown = { path = "../tui-markdown" }
tui-text = { path = "../tui-text" }
tui-render = { path = "../tui-render" }
tui-theme = { path = "../tui-theme" }
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
supports-color = "3.0.2"
unicode-segmentation = "1.12.0"

[dev-dependencies]
insta = "1.46.3"
pretty_assertions = "1.4.1"
