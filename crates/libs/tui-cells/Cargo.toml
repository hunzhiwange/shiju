[package]
name = "tui-cells"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
tui-text = { path = "../tui-text", version = "0.6.0" }
tui-render = { path = "../tui-render", version = "0.6.0" }
tui-theme = { path = "../tui-theme", version = "0.6.0" }
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
supports-color = "3.0.2"
unicode-segmentation = "1.12.0"

[dev-dependencies]
insta = "1.46.3"
pretty_assertions = "1.4.1"
