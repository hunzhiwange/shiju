[package]
name = "tui-chat"
version = "0.7.10"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
tui-exec-state = { path = "../tui-exec-state" }
tui-chat-state = { path = "../tui-chat-state" }
tui-transcript = { path = "../tui-transcript" }
tui-bottom-pane = { path = "../tui-bottom-pane" }
tui-user-input = { path = "../tui-user-input" }
tui-approval = { path = "../tui-approval" }
tui-widgets = { path = "../tui-widgets" }
tui-cells = { path = "../tui-cells" }
tui-render = { path = "../tui-render" }
tui-text = { path = "../tui-text" }
tui-contracts = { path = "../tui-contracts" }
tui-clipboard = { path = "../tui-clipboard" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }

[dev-dependencies]
tui-transcript = { path = "../tui-transcript", features = ["test-support"] }
insta = "1.46.3"
