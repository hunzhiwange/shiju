[package]
name = "tui-chat"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
tui-exec-state = { path = "../tui-exec-state", version = "0.6.0" }
tui-chat-state = { path = "../tui-chat-state", version = "0.6.0" }
tui-transcript = { path = "../tui-transcript", version = "0.6.0" }
tui-bottom-pane = { path = "../tui-bottom-pane", version = "0.6.0" }
tui-user-input = { path = "../tui-user-input", version = "0.6.0" }
tui-approval = { path = "../tui-approval", version = "0.6.0" }
tui-widgets = { path = "../tui-widgets", version = "0.6.0" }
tui-cells = { path = "../tui-cells", version = "0.6.0" }
tui-render = { path = "../tui-render", version = "0.6.0" }
tui-text = { path = "../tui-text", version = "0.6.0" }
tui-contracts = { path = "../tui-contracts", version = "0.6.0" }
tui-clipboard = { path = "../tui-clipboard", version = "0.6.0" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }

[dev-dependencies]
tui-transcript = { path = "../tui-transcript", version = "0.6.0", features = ["test-support"] }
insta = "1.46.3"
