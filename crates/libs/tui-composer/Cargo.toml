[package]
name = "tui-composer"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
tui-text = { path = "../tui-text", version = "0.6.0" }
tui-input = { path = "../tui-input", version = "0.6.0" }
tui-contracts = { path = "../tui-contracts", version = "0.6.0" }
tui-render = { path = "../tui-render", version = "0.6.0" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
unicode-width = "0.2"

[dev-dependencies]
insta = "1.46.3"
pretty_assertions = "1.4.1"
