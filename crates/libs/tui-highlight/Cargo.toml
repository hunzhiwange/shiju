[package]
name = "tui-highlight"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
syntect = "5"
tracing = "0.1"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
tui-theme = { path = "../tui-theme", version = "0.6.0" }

[dev-dependencies]
insta = "1.46.3"
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
