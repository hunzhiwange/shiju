[package]
name = "tui-input"
version = "0.7.10"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
tracing = "0.1"
tui-text = { path = "../tui-text" }
textwrap = "0.16.2"
unicode-segmentation = "1.12.0"
crossterm = "0.29"
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }

[dev-dependencies]
insta = "1.46.3"
pretty_assertions = "1.4.1"
