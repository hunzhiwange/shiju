[package]
name = "tui-markdown"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
dirs = "6"
pulldown-cmark = "0.13.4"
ratatui = { version = "0.30.2", default-features = false }
regex-lite = "0.1.8"
url = "2"
urlencoding = "2.1.3"
tui-text = { path = "../tui-text" }
tui-render = { path = "../tui-render" }
tui-theme = { path = "../tui-theme" }
tui-highlight = { path = "../tui-highlight" }

[dev-dependencies]
insta = "1.46.3"
pretty_assertions = "1.4.1"
