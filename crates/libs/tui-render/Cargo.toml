[package]
name = "tui-render"
version = "0.7.10"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
tui-text = { path = "../tui-text" }
crossterm = "0.29"
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
url = "2"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
