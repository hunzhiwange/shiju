[package]
name = "tui-stream"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
tracing = "0.1"
tui-markdown = { path = "../tui-markdown" }
tui-render = { path = "../tui-render" }
tui-theme = { path = "../tui-theme" }
tui-highlight = { path = "../tui-highlight" }

[dev-dependencies]
tui-text = { path = "../tui-text" }
insta = "1.46.3"
pretty_assertions = "1.4.1"
tokio = { version = "1", features = ["macros", "rt"] }
