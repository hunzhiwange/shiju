[package]
name = "tui-stream"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
tracing = "0.1"
tui-markdown = { path = "../tui-markdown", version = "0.6.0" }
tui-render = { path = "../tui-render", version = "0.6.0" }
tui-theme = { path = "../tui-theme", version = "0.6.0" }
tui-highlight = { path = "../tui-highlight", version = "0.6.0" }

[dev-dependencies]
tui-text = { path = "../tui-text", version = "0.6.0" }
insta = "1.46.3"
pretty_assertions = "1.4.1"
tokio = { version = "1", features = ["macros", "rt"] }
