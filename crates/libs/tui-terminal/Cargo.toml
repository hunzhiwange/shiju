[package]
name = "tui-terminal"
version = "0.7.10"
edition = "2024"
license = "Apache-2.0 AND MIT"

[lib]
doctest = false

[dependencies]
tui-render = { path = "../tui-render" }
tui-text = { path = "../tui-text" }
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
crossterm = "0.29"
libc = "0.2"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
insta = "1.46.3"
vt100 = "0.16.2"
pretty_assertions = "1.4.1"
