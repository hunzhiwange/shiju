[package]
name = "tui-text"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
serde_json = { version = "1", features = ["preserve_order"] }
textwrap = "0.16.2"
tracing = "0.1"
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
itertools = "0.15.0"
pretty_assertions = "1.4.1"
