[package]
name = "tui-transcript"
version = "0.7.10"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[features]
# Retain the existing viewport projection assertion in vw-tui's tests.
test-support = []

[dependencies]
tui-cells = { path = "../tui-cells" }
tui-contracts = { path = "../tui-contracts" }
tui-highlight = { path = "../tui-highlight" }
crossterm = "0.29"
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
