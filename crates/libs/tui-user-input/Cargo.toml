[package]
name = "tui-user-input"
version = "0.7.10"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
tui-composer = { path = "../tui-composer" }
tui-widgets = { path = "../tui-widgets" }
tui-contracts = { path = "../tui-contracts" }
tui-render = { path = "../tui-render" }
crossterm = "0.29"
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
unicode-width = "0.2"
textwrap = "0.16.2"
