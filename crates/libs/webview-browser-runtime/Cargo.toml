[package]
name = "webview-browser-runtime"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
config-ui = { path = "../config-ui" }
webview-browser-views = { path = "../webview-browser-views" }
webview-popup = { path = "../webview-popup" }
webview-media-permissions = { path = "../webview-media-permissions" }
webview-downloads = { path = "../webview-downloads" }
webview-native-menu = { path = "../webview-native-menu" }
webview-external-protocol = { path = "../webview-external-protocol" }
webview-runtime-cookie = { path = "../webview-runtime-cookie" }
webview-init-script = { path = "../webview-init-script" }
webview-toolbar = { path = "../webview-toolbar" }
webview-local-content = { path = "../webview-local-content" }
webview-ipc = { path = "../webview-ipc" }
webview-launch = { path = "../webview-launch" }
webview-core = { path = "../webview-core" }
webview-storage = { path = "../webview-storage" }
open = "5"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
tao = { version = "0.34" }
wry = { version = "=0.56.1" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
