[package]
name = "webview-browser-runtime"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
webview-browser-views = { path = "../webview-browser-views", version = "0.6.0" }
webview-popup = { path = "../webview-popup", version = "0.6.0" }
webview-media-permissions = { path = "../webview-media-permissions", version = "0.6.0" }
webview-downloads = { path = "../webview-downloads", version = "0.6.0" }
webview-native-menu = { path = "../webview-native-menu", version = "0.6.0" }
webview-external-protocol = { path = "../webview-external-protocol", version = "0.6.0" }
webview-runtime-cookie = { path = "../webview-runtime-cookie", version = "0.6.0" }
webview-init-script = { path = "../webview-init-script", version = "0.6.0" }
webview-toolbar = { path = "../webview-toolbar", version = "0.6.0" }
webview-local-content = { path = "../webview-local-content", version = "0.6.0" }
webview-ipc = { path = "../webview-ipc", version = "0.6.0" }
webview-launch = { path = "../webview-launch", version = "0.6.0" }
webview-core = { path = "../webview-core", version = "0.6.0" }
webview-storage = { path = "../webview-storage", version = "0.6.0" }
open = "5"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
tao = { version = "0.34" }
wry = { version = "=0.56.1" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
