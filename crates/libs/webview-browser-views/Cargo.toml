[package]
name = "webview-browser-views"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
config-ui = { path = "../config-ui" }
webview-core = { path = "../webview-core" }
webview-toolbar = { path = "../webview-toolbar" }
webview-ipc = { path = "../webview-ipc" }
webview-local-content = { path = "../webview-local-content" }
webview-popup = { path = "../webview-popup" }
webview-downloads = { path = "../webview-downloads" }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
tao = { version = "0.34" }
wry = { version = "=0.56.1" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
