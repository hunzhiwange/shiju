[package]
name = "webview-downloads"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[target.'cfg(unix)'.dependencies]
webview-storage = { path = "../webview-storage", version = "0.6.0" }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
wry = { version = "=0.56.1" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception", "disable-encoding-assertions"] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
    "std",
    "NSString",
    "NSObject",
    "NSURLResponse",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKWebView",
] }
