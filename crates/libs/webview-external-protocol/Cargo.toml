[package]
name = "webview-external-protocol"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
webview-core = { path = "../webview-core", version = "0.6.0" }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
tao = { version = "0.34" }
wry = { version = "=0.56.1" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception", "disable-encoding-assertions"] }
objc2-app-kit = { version = "0.3.0", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSAlert",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
    "std",
    "NSString",
    "NSObject",
    "NSURL",
] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.17"
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
