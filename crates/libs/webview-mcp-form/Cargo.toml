[package]
name = "webview-mcp-form"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
desktop-i18n = { path = "../desktop-i18n" }
webview-mcp-policy = { path = "../webview-mcp-policy" }
webview-external-protocol = { path = "../webview-external-protocol" }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
wry = { version = "=0.56.1" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception", "disable-encoding-assertions"] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKNavigationDelegate",
    "WKUIDelegate",
    "WKUserContentController",
    "WKWebView",
    "WKWebViewConfiguration",
] }

[dev-dependencies]
config-ui = { path = "../config-ui" }
