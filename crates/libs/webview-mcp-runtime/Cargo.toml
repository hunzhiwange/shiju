[package]
name = "webview-mcp-runtime"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
getrandom = "0.4"
serde_json = "1"
vw-api-mcp-network = { path = "../api-mcp-network" }
webview-mcp-policy = { path = "../webview-mcp-policy" }
webview-mcp-assets = { path = "../webview-mcp-assets" }
webview-mcp-form = { path = "../webview-mcp-form" }
webview-external-protocol = { path = "../webview-external-protocol" }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
tao = { version = "0.34" }
wry = { version = "=0.56.1" }
