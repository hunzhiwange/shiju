[package]
name = "webview-mcp-runtime"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
getrandom = "0.4"
serde_json = "1"
vw-api-types = { path = "../../vw-api-types", version = "0.6.0" }
webview-mcp-policy = { path = "../webview-mcp-policy", version = "0.6.0" }
webview-mcp-assets = { path = "../webview-mcp-assets", version = "0.6.0" }
webview-mcp-form = { path = "../webview-mcp-form", version = "0.6.0" }
webview-external-protocol = { path = "../webview-external-protocol", version = "0.6.0" }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
tao = { version = "0.34" }
wry = { version = "=0.56.1" }
