[package]
name = "workflow-core"
version = "0.7.10"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
minijinja = { version = "2.20.0", features = ["json", "loop_controls"] }
regex = "1"
serde_json = "1"
serde_yaml.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agent-database = { path = "../agent-database" }
vw-api-transport = { path = "../api-transport" }
vw-api-workflow = { path = "../api-workflow" }
anyhow = "1"
postgres = { version = "0.19.12", features = ["with-chrono-0_4"] }
thiserror = "2"
uuid = { version = "1.11", features = ["v4", "js"] }
tokio = { version = "1", features = ["rt"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
agent-database = { path = "../agent-database", features = ["test-support"] }
config-runtime-paths = { path = "../config-runtime-paths" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
