[package]
name = "worktree-core"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
agent-bus = { path = "../agent-bus", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
libc = "0.2"
anyhow = "1"
directories = "5"
hex = "0.4"
sha2 = "0.11"
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "js"] }
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "process", "macros"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
agent-project = { path = "../agent-project", version = "0.6.0" }
agent-storage = { path = "../agent-storage", version = "0.6.0" }
agent-paths = { path = "../agent-paths", version = "0.6.0" }
agent-database = { path = "../agent-database", version = "0.6.0" }
agent-config = { path = "../agent-config", version = "0.6.0" }
shell-command = { path = "../shell-command", version = "0.6.0", features = ["shell-tokio"] }
git-discovery = { path = "../git-discovery", version = "0.6.0" }
session-info = { path = "../session-info", version = "0.6.0" }
config-runtime-paths = { path = "../config-runtime-paths", version = "0.6.0" }
config-worktree = { path = "../config-worktree", version = "0.6.0" }
vw-api-transport = { path = "../api-transport", version = "0.6.0" }
vw-api-worktree = { path = "../api-worktree", version = "0.6.0" }

[dev-dependencies]
session-store = { path = "../session-store", version = "0.6.0" }
session-engine = { path = "../session-engine", version = "0.6.0" }
tool-shell = { path = "../tool-shell", version = "0.6.0" }
agent-project = { path = "../agent-project", version = "0.6.0", features = ["test-support"] }
agent-database = { path = "../agent-database", version = "0.6.0", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[features]
test-support = ["agent-project/test-support", "agent-database/test-support"]
