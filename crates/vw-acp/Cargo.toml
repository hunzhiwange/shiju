[package]
name = "vw-acp"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Agent Client Protocol bridge for ShiJu"
license = "MIT"

[[bin]]
name = "acp"
path = "src/main.rs"
test = false

[dependencies]
acp-owner-process = { path = "../libs/acp-owner-process", version = "0.6.0" }
acp-session-connect = { path = "../libs/acp-session-connect", version = "0.6.0" }
acp-client = { path = "../libs/acp-client", version = "0.6.0" }
acp-async-control = { path = "../libs/acp-async-control", version = "0.6.0" }
acp-lifecycle = { path = "../libs/acp-lifecycle", version = "0.6.0" }
acp-queue = { path = "../libs/acp-queue", version = "0.6.0" }
acp-config = { path = "../libs/acp-config", version = "0.6.0" }
acp-agent-registry = { path = "../libs/acp-agent-registry", version = "0.6.0" }
vw-api-tools = { path = "../libs/api-tools", version = "0.6.0" }
acp-host-io = { path = "../libs/acp-host-io", version = "0.6.0" }
acp-output = { path = "../libs/acp-output", version = "0.6.0" }
acp-storage = { path = "../libs/acp-storage", version = "0.6.0" }
acp-lease = { path = "../libs/acp-lease", version = "0.6.0" }
config-acp-install = { path = "../libs/config-acp-install", version = "0.6.0" }
acp-metrics = { path = "../libs/acp-metrics", version = "0.6.0" }
acp-access-policy = { path = "../libs/acp-access-policy", version = "0.6.0" }
vw-api-transport = { path = "../libs/api-transport", version = "0.6.0" }
config-runtime-paths = { path = "../libs/config-runtime-paths", version = "0.6.0" }
acp-types = { path = "../libs/acp-types", version = "0.6.0" }
acp-paths = { path = "../libs/acp-paths", version = "0.6.0" }
clap = { version = "4.5", features = ["derive"] }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
async-trait = "0.1.89"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
tracing = "0.1"
vw-api-types = { path = "../vw-api-types", version = "0.6.0" }
vw-config-types = { path = "../vw-config-types", version = "0.6.0" }
vw-shared = { path = "../vw-shared", version = "0.6.0", features = ["shell-tokio"] }

[dev-dependencies]
tempfile = "3"
