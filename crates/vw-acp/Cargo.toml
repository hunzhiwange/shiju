[package]
name = "vw-acp"
version.workspace = true
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Agent Client Protocol bridge for ShiJu"
license = "MIT"

[[bin]]
name = "acp"
path = "src/main.rs"
test = false

[[bin]]
name = "aionrs-acp"
path = "src/bin/aionrs_acp.rs"
test = false

[dependencies]
acp-cli-app = { path = "../libs/acp-cli-app" }
acp-cli-commands = { path = "../libs/acp-cli-commands" }
acp-cli-render = { path = "../libs/acp-cli-render" }
acp-cli-model = { path = "../libs/acp-cli-model" }
acp-session-runtime = { path = "../libs/acp-session-runtime" }
acp-prompt-runner = { path = "../libs/acp-prompt-runner" }
acp-owner-process = { path = "../libs/acp-owner-process" }
acp-session-connect = { path = "../libs/acp-session-connect" }
acp-client = { path = "../libs/acp-client" }
acp-async-control = { path = "../libs/acp-async-control" }
acp-lifecycle = { path = "../libs/acp-lifecycle" }
acp-server = { path = "../libs/acp-server" }
acp-queue = { path = "../libs/acp-queue" }
acp-config = { path = "../libs/acp-config" }
acp-agent-registry = { path = "../libs/acp-agent-registry" }
acp-host-io = { path = "../libs/acp-host-io" }
acp-output = { path = "../libs/acp-output" }
acp-storage = { path = "../libs/acp-storage" }
acp-lease = { path = "../libs/acp-lease" }
acp-metrics = { path = "../libs/acp-metrics" }
acp-access-policy = { path = "../libs/acp-access-policy" }
acp-types = { path = "../libs/acp-types" }
acp-paths = { path = "../libs/acp-paths" }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
vw-api-tools = { path = "../libs/api-tools" }
config-acp-install = { path = "../libs/config-acp-install" }
config-runtime-paths = { path = "../libs/config-runtime-paths" }
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_usage", "unstable_session_resume", "unstable_session_model", "unstable_boolean_config"] }
serde_json = "1"
tempfile = "3"
