[package]
name = "vw-agent-apps"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Native application business logic for VibeWindow"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
semver = "1"
base64 = "0.23"
tempfile = "3"
png = "0.18"
vw-api-types = { path = "../vw-api-types" }
vw-acp = { path = "../vw-acp" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
