[package]
name = "vw-agent-apps"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Native application business logic for VibeWindow"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
toml_edit = "0.22"
semver = "1"
hmac = "0.13.0"
sha2 = "0.11"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1.11", features = ["v4", "js"] }
tempfile = "3"
png = "0.18"
vw-api-types = { path = "../vw-api-types" }
vw-acp = { path = "../vw-acp" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
httparse = "1"
vw-provider-resolver = { path = "../vw-provider-resolver", version = "0.6.0" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
tokio = { version = "1", features = ["io-util", "process", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "time"] }
