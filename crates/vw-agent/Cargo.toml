tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util", "process", "signal", "fs", "io-util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-serial = "5.4.5"
tokio-stream = { version = "0.1.18", features = ["fs", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
wa-rs = { version = "0.2.0", optional = true, default-features = false, features = ["tokio-native", "tokio-transport", "ureq-client"] }
wa-rs-binary = { version = "0.2.0", optional = true }
wa-rs-core = { version = "0.2.0", optional = true }
wa-rs-proto = { version = "0.2.0", optional = true }
wa-rs-tokio-transport = { version = "0.2.0", optional = true }
wa-rs-ureq-http = { version = "0.2.0", optional = true }
which = { version = "6.0" }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gateway-openclaw-settings = { path = "../libs/gateway-openclaw-settings" }
gateway-hermes-memory = { path = "../libs/gateway-hermes-memory" }
gateway-hermes-dashboard = { path = "../libs/gateway-hermes-dashboard" }
app-workspace-paths = { path = "../libs/app-workspace-paths" }
system-configuration = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console = "0.16"
console_error_panic_hook = "0.1"
console_log = "1"
fern = "0.7"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = { version = "0.3", default-features = false }
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["sync", "macros", "time", "rt", "process", "signal"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", default-features = false, features = ["Window"] }

[features]
employee-acp-test-support = ["acp-client/employee-acp-test-support", "shiju-client/employee-acp-test-support"]
default = [
  "rag-pdf",
  "firecrawl",
  "web-fetch-html2md",
  "web-fetch-plaintext",
  "shell-ast",
  "channel-lark",
]
"browser-native" = ["tool-browser/browser-native"]
"rag-pdf" = ["agent-knowledge/rag-pdf", "tool-files/rag-pdf"]
firecrawl = ["tool-web/firecrawl"]
"web-fetch-html2md" = ["tool-web/web-fetch-html2md"]
"web-fetch-plaintext" = ["tool-web/web-fetch-plaintext"]
probe = ["dep:probe-rs"]
memory-postgres = ["dep:memory-postgres", "agent-memory/memory-postgres"]
memory-mariadb = ["dep:memory-mariadb", "agent-memory/memory-mariadb"]
observability-otel = ["agent-observability/observability-otel", "agent-daemon/observability-otel"]
sandbox-bubblewrap = ["process-sandbox/sandbox-bubblewrap", "agent-security/sandbox-bubblewrap", "tool-shell/sandbox-bubblewrap"]
sandbox-landlock = ["process-sandbox/sandbox-landlock", "agent-security/sandbox-landlock", "tool-shell/sandbox-landlock"]
shell-ast = ["dep:tree-sitter", "dep:tree-sitter-bash", "agent-security/shell-ast", "tool-shell/shell-ast"]
channel-lark = ["dep:channel-lark", "channel-runtime/channel-lark"]
whatsapp-web = ["channel-whatsapp-web/whatsapp-web", "dep:prost", "dep:wa-rs", "dep:wa-rs-core", "dep:wa-rs-binary", "dep:wa-rs-proto", "dep:wa-rs-ureq-http", "dep:wa-rs-tokio-transport", "dep:channel-whatsapp-storage", "channel-whatsapp-storage/whatsapp-web", "channel-runtime/whatsapp-web"]

[[test]]
name = "cc04_accept_transactions"
path = "tests/cc04_accept_transactions.rs"

[[test]]
name = "cc_route_030_outbound_scan"
path = "tests/cc_route_030_outbound_scan.rs"

[[test]]
name = "model_protocol_014_messages"
path = "tests/model_protocol_014_messages.rs"

[[test]]
name = "model_protocol_015_messages"
path = "tests/model_protocol_015_messages.rs"

[[test]]
name = "acp_gemini_chat"
path = "tests/acp_gemini_chat.rs"

[[test]]
name = "gateway_legacy_handlers"
path = "tests/gateway_legacy_handlers.rs"

[[test]]
name = "media_end_to_end"
path = "tests/media_end_to_end.rs"

[target.'cfg(unix)'.dependencies]
tool-computer = { path = "../libs/tool-computer" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
workflow-engine = { path = "../libs/workflow-engine", features = ["test-support"] }
agent-gateway = { path = "../libs/agent-gateway", features = ["test-support"] }
gateway-agent-apps = { path = "../libs/gateway-agent-apps", features = ["test-support"] }
gateway-project = { path = "../libs/gateway-project", features = ["test-support"] }
channel-wecom = { path = "../libs/channel-wecom", features = ["test-support"] }
task-scheduler = { path = "../libs/task-scheduler", features = ["test-support"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tool-cron = { path = "../libs/tool-cron", features = ["test-support"] }
gateway-cron = { path = "../libs/gateway-cron", features = ["test-support"] }
agent-app-services = { path = "../libs/agent-app-services", features = ["test-support"] }
plugin-mcp = { path = "../libs/plugin-mcp", features = ["test-support"] }
session-engine = { path = "../libs/session-engine", features = ["test-support"] }
gateway-session = { path = "../libs/gateway-session", features = ["test-support"] }
gateway-agent-scheduler = { path = "../libs/gateway-agent-scheduler", features = ["test-support"] }
session-store = { path = "../libs/session-store", features = ["test-support"] }
channel-runtime = { path = "../libs/channel-runtime", features = ["test-support"] }
model-relay-http = { path = "../libs/model-relay-http", features = ["acceptance-diagnostics", "test-support"] }
tool-git = { path = "../libs/tool-git", features = ["test-support"] }
tool-assembly = { path = "../libs/tool-assembly", features = ["test-support"] }
channel-qq = { path = "../libs/channel-qq", features = ["test-support"] }
agent-loop = { path = "../libs/agent-loop", features = ["test-support"] }
tool-mcp = { path = "../libs/tool-mcp", features = ["test-support"] }
tool-shell = { path = "../libs/tool-shell", features = ["test-support"] }
shiju-client = { path = "../libs/shiju-client", features = ["test-support"] }
worktree-core = { path = "../libs/worktree-core", features = ["test-support"] }
agent-provider = { path = "../libs/agent-provider", features = ["test-support"] }
agent-project = { path = "../libs/agent-project", features = ["test-support"] }
agent-runtime = { path = "../libs/agent-runtime", features = ["test-support"] }
agent-config = { path = "../libs/agent-config", features = ["test-support"] }
agent-approval = { path = "../libs/agent-approval", features = ["test-support"] }
agent-acp = { path = "../libs/agent-acp", features = ["test-support"] }
gateway-host-tools = { path = "../libs/gateway-host-tools" }
gateway-inference = { path = "../libs/gateway-inference" }
gateway-model-provider = { path = "../libs/gateway-model-provider" }
gateway-model-catalog = { path = "../libs/gateway-model-catalog" }
gateway-files = { path = "../libs/gateway-files" }
gateway-http = { path = "../libs/gateway-http" }
provider-runtime-paths = { path = "../libs/provider-runtime-paths" }
agent-database = { path = "../libs/agent-database", features = ["test-support"] }

[dev-dependencies.gateway-skill-market]
path = "../libs/gateway-skill-market"
features = ["fixture-support"]

[dev-dependencies.gateway-misc]
path = "../libs/gateway-misc"
features = ["test-support"]

[dev-dependencies.gateway-config]
path = "../libs/gateway-config"
features = ["host-test-support"]

[dev-dependencies.computer-control]
path = "../libs/computer-control"
features = ["test-support"]

[dev-dependencies.tool-computer]
path = "../libs/tool-computer"
features = ["test-support"]
