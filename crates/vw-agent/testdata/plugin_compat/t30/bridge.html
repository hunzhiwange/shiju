<!doctype html><meta charset="utf-8"><style>body{font:18px system-ui;padding:24px;background:#fff;color:#111}body.dark{background:#171717;color:#eee}button{padding:10px;margin:8px}p{max-width:600px}</style><h1>MCP 应用桥接验收</h1><button id="theme">切换明暗</button><button id="cancel">取消</button><p id="state">正在初始化</p><div id="long"></div><script>
let next=1;function send(method,params,id=next++){parent.postMessage({jsonrpc:'2.0',id,method,params},'*')}
addEventListener('message',e=>{if(e.source!==parent)return;if(e.data.id===1){parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');document.querySelector('#state').textContent='初始化完成 · 中文渲染正常';send('tools/call',{name:'forbidden',arguments:{}})}if(e.data.id===2)document.querySelector('#state').textContent+=' · 越权调用已拒绝';});
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#cancel').onclick=()=>{document.querySelector('#state').textContent='已取消';parent.postMessage({jsonrpc:'2.0',method:'fixture/cancel'},'*')};document.querySelector('#long').textContent='中文长内容滚动验证。'.repeat(400);send('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'fixture',version:'1'},appCapabilities:{}});
</script>
