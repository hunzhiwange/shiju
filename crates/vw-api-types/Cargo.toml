[package]
name = "vw-api-types"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "API types for VibeWindow"
license = "MIT"

[dependencies]
vw-api-chat = { path = "../libs/api-chat", version = "0.6.0" }
vw-api-session = { path = "../libs/api-session", version = "0.6.0" }
vw-api-todo = { path = "../libs/api-todo", version = "0.6.0" }
vw-api-acp-model = { path = "../libs/api-acp-model", version = "0.6.0" }
vw-api-mcp-network = { path = "../libs/api-mcp-network", version = "0.6.0" }
vw-api-tools = { path = "../libs/api-tools", version = "0.6.0" }
vw-api-app-identity = { path = "../libs/api-app-identity", version = "0.6.0" }
vw-api-chat-identity = { path = "../libs/api-chat-identity", version = "0.6.0" }
vw-api-transport = { path = "../libs/api-transport", version = "0.6.0" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
url = "2"
uuid = "1.11"
