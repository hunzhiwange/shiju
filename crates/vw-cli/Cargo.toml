[package]
name = "vw-cli"
version = "0.5.9"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Rust-first autonomous agent runtime CLI"
license = "MIT"
default-run = "shiju"
autobins = false

[[bin]]
name = "shiju"
path = "src/main.rs"

[[bin]]
name = "vibe-agent"
path = "src/bin/vibe-agent.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
dialoguer = "0.11"
libc = "0.2"
pulldown-cmark = "0.13"
ratatui = "0.30.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["io-std", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "fmt", "ansi"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
unicode-width = "0.2"
unicode-segmentation = "1"
vw-agent = { path = "../vw-agent", version = "0.5.9", default-features = false }
vw-acp = { path = "../vw-acp", version = "0.5.9" }
vw-config-types = { path = "../vw-config-types", version = "0.5.9" }
vw-gateway-client = { path = "../vw-gateway-client", version = "0.5.9" }
vw-shared = { path = "../vw-shared", version = "0.5.9" }
vw-tui = { path = "../vw-tui", version = "0.5.9" }

[dev-dependencies]
async-trait = "0.1.89"
tempfile = "3"
tokio-tungstenite = "0.29"

[features]
default = ["agent-defaults", "memory-postgres", "memory-mariadb", "channel-lark"]
agent-defaults = [
  "vw-agent/rag-pdf",
  "vw-agent/firecrawl",
  "vw-agent/web-fetch-html2md",
  "vw-agent/web-fetch-plaintext",
  "vw-agent/shell-ast",
]
memory-postgres = ["vw-agent/memory-postgres"]
memory-mariadb = ["vw-agent/memory-mariadb"]
channel-lark = ["vw-agent/channel-lark"]
