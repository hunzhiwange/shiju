[package]
name = "vw-cli"
version = "0.4.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/vibewindow"
homepage = "https://github.com/hunzhiwange/vibewindow"
description = "Rust-first autonomous agent runtime CLI"
license = "MIT"
default-run = "shiju"
autobins = false

[package.metadata.dist]
dist = true
npm-package = "shiju"
# Enable this when Homebrew publishing is enabled in dist-workspace.toml.
# formula = "shiju"

[[bin]]
name = "shiju"
path = "src/main.rs"

[[bin]]
name = "vibe-agent"
path = "src/bin/vibe-agent.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
dialoguer = "0.11"
libc = "0.2"
pulldown-cmark = "0.9"
ratatui = "0.30.0"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "fmt", "ansi"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
unicode-width = "0.1"
unicode-segmentation = "1"
vw-agent = { path = "../vw-agent", version = "0.4.0" }
vw-acp = { path = "../vw-acp", version = "0.4.0" }
vw-config-types = { path = "../vw-config-types", version = "0.4.0" }
vw-gateway-client = { path = "../vw-gateway-client", version = "0.4.0" }
vw-shared = { path = "../vw-shared", version = "0.4.0" }
vw-tui-v3 = { path = "../vw-tui-v3", version = "0.4.0" }

[dev-dependencies]
async-trait = "0.1.89"
tempfile = "3"

[features]
default = ["memory-postgres", "memory-mariadb", "channel-matrix", "channel-lark"]
memory-postgres = ["vw-agent/memory-postgres"]
memory-mariadb = ["vw-agent/memory-mariadb"]
channel-matrix = ["vw-agent/channel-matrix"]
channel-lark = ["vw-agent/channel-lark"]
