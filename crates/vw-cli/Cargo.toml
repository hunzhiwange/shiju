[package]
name = "vw-cli"
version.workspace = true
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Rust-first autonomous agent runtime CLI"
license = "MIT"
default-run = "shiju"
autobins = false

[[bin]]
name = "shiju"
path = "src/main.rs"

[[bin]]
name = "vibe-agent"
path = "src/bin/vibe-agent.rs"

[dependencies]
cli-bootstrap = { path = "../libs/cli-bootstrap", default-features = false }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
employee-acp-test-support = ["cli-bootstrap/employee-acp-test-support"]
default = ["agent-defaults", "memory-postgres", "memory-mariadb", "channel-lark"]
agent-defaults = ["cli-bootstrap/agent-defaults"]
memory-postgres = ["cli-bootstrap/memory-postgres"]
memory-mariadb = ["cli-bootstrap/memory-mariadb"]
channel-lark = ["cli-bootstrap/channel-lark"]

[dev-dependencies]
axum = "0.8"
agent-config = { path = "../libs/agent-config" }
config-gateway = { path = "../libs/config-gateway" }
gateway-pairing = { path = "../libs/gateway-pairing" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
vw-agent = { path = "../vw-agent", default-features = false }
vw-api-transport = { path = "../libs/api-transport" }
