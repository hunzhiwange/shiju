[package]
name = "vw-config-types"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Configuration types for VibeWindow"
license = "MIT"

[dependencies]
config-acp-install = { path = "../libs/config-acp-install", version = "0.6.0" }
config-runtime-paths = { path = "../libs/config-runtime-paths", version = "0.6.0" }
chrono-tz = "0.10.4"
directories = "5"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3.1"
tracing = "0.1"
