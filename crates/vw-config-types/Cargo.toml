[package]
name = "vw-config-types"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Configuration types for VibeWindow"
license = "MIT"

[dependencies]
config-agent = { path = "../libs/config-agent", version = "0.6.0" }
config-agent-profile = { path = "../libs/config-agent-profile", version = "0.6.0" }
config-tools = { path = "../libs/config-tools", version = "0.6.0" }
config-plugins = { path = "../libs/config-plugins", version = "0.6.0" }
config-voice = { path = "../libs/config-voice", version = "0.6.0" }
config-computer-control = { path = "../libs/config-computer-control", version = "0.6.0" }
config-proxy = { path = "../libs/config-proxy", version = "0.6.0" }
config-skills = { path = "../libs/config-skills", version = "0.6.0" }
config-gateway = { path = "../libs/config-gateway", version = "0.6.0" }
config-memory = { path = "../libs/config-memory", version = "0.6.0" }
config-runtime = { path = "../libs/config-runtime", version = "0.6.0" }
config-observability = { path = "../libs/config-observability", version = "0.6.0" }
config-hooks = { path = "../libs/config-hooks", version = "0.6.0" }
config-automation = { path = "../libs/config-automation", version = "0.6.0" }
config-reliability = { path = "../libs/config-reliability", version = "0.6.0" }
config-routing = { path = "../libs/config-routing", version = "0.6.0" }
config-provider = { path = "../libs/config-provider", version = "0.6.0" }
config-acp-install = { path = "../libs/config-acp-install", version = "0.6.0" }
config-runtime-paths = { path = "../libs/config-runtime-paths", version = "0.6.0" }
chrono-tz = "0.10.4"
directories = "5"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3.1"
tracing = "0.1"
