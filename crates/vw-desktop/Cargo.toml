arboard = "3.4"
cpal = { version = "0.18.2", default-features = false }
auto-launch = "0.6"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
# Pin the shutdown fix: older builds panic when the terminal channel closes.
iced_term = { path = "../../vendor/iced_term" }
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream", "socks", "blocking", "json", "rustls"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
reqwest = { version = "0.13", features = ["json"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "ClipboardEvent",
    "CompositionEvent",
    "DataTransfer",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "Node",
    "Storage",
    "Window",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
mac-usernotifications = "0.3.1"
muda = { version = "0.19", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphics", "NSImage", "NSImageView", "NSPanel", "NSPasteboard", "NSResponder", "NSScreen", "NSTextField", "NSWindow", "NSView", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }
notify-rust = { version = "4.18.2", default-features = false }
winreg = "0.55"

[features]
default = []

[dev-dependencies]
desktop-session = { path = "../libs/desktop-session", features = ["test-support"] }
desktop-settings-sessions = { path = "../libs/desktop-settings-sessions", features = ["acceptance-fixture"] }
desktop-account = { path = "../libs/desktop-account", features = ["test-support"] }
tokio-tungstenite = "0.29"
toml = "0.9"
iced_runtime = "0.14"

# 显式运行的原生窗口验收；不加入默认测试，避免无显示器 CI 弹窗。
[[test]]
name = "recovery-window"
path = "src/recovery_window_main.rs"
harness = false
test = false

[[test]]
name = "plugin-compat-window"
path = "src/plugin_compat_window_main.rs"
harness = false
test = false

[[test]]
name = "acp-options-window"
path = "src/acp_options_window_main.rs"
harness = false
test = false

# 显式资料弹窗交互验收，固定隔离 bootstrap，不连接用户网关。
[[test]]
name = "agent-profile-window"
path = "src/agent_profile_window_main.rs"
harness = false
test = false

# 显式运行原生 Dock / 托盘恢复验收，不随默认测试启动窗口。
[[test]]
name = "tray-window"
path = "tests/tray_window.rs"
harness = false
test = false

[[test]]
name = "apps-catalog-window"
path = "src/apps_catalog_window_main.rs"
harness = false
test = false

[[test]]
name = "apps-lifecycle-window"
path = "src/apps_lifecycle_window_main.rs"
harness = false
test = false

[[test]]
name = "apps-uninstall-window"
path = "src/apps_uninstall_window_main.rs"
harness = false
test = false

[[test]]
name = "apps-preferences-window"
path = "src/apps_preferences_window_main.rs"
harness = false
test = false

[[test]]
name = "apps-launch-window"
path = "src/apps_launch_window_main.rs"
harness = false
test = false

[[test]]
name = "cc04-provider-window"
path = "src/cc04_provider_window_main.rs"
harness = false
test = false

# Explicit companion native acceptance, excluded from default test runs.
[[test]]
name = "companion-window"
path = "src/companion_window_main.rs"
harness = false
test = false

# Explicit voice acceptance; never opens a window in default test runs.
[[test]]
name = "voice-window"
path = "src/voice_window_main.rs"
harness = false
test = false

# Explicit macOS main-run-loop probe; never requests permission or downloads assets.
[[test]]
name = "local-speech-system"
path = "src/local_speech_system_main.rs"
harness = false
test = false

# Explicit archive rendering acceptance with temporary data and loopback HTTP only.
[[test]]
name = "archived-chats-window"
path = "src/archived_chats_window_main.rs"
harness = false
test = false

# 显式日期时间选择器窗口验收，不执行启动任务或保存用户配置。
[[test]]
name = "cron-picker-window"
path = "src/cron_picker_window_main.rs"
harness = false
test = false

# Explicit native worktree acceptance, excluded from default tests.
[[test]]
name = "worktree-management-window"
path = "tests/worktree_management_window.rs"
harness = false
test = false

# Explicit native editor configuration acceptance with an isolated in-memory document.
[[test]]
name = "editor-config-window"
path = "src/editor_config_acceptance_main.rs"
harness = false
test = false

[dev-dependencies.desktop-task-model]
path = "../libs/desktop-task-model"
