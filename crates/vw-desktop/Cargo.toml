[package]
name = "vw-desktop"
version = "0.5.3"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Desktop application for ShiJu"
license = "MIT"
default-run = "shi-ju"
build = "build.rs"

[package.metadata.bundle]
name = "ShiJu"
identifier = "com.rsung.shiju"
icon = ["../../assets/logo/icon.icns"]
resources = []

[package.metadata.bundle.bin.shi-ju]
name = "ShiJu"
identifier = "com.rsung.shiju"
icon = ["../../assets/logo/icon.icns"]

[[bin]]
name = "shi-ju"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
glob = "0.3"
hex = "0.4"
iced = { version = "0.14", features = ["image", "svg", "advanced", "tokio", "highlighter", "markdown"] }
iced-code-editor = { git = "https://github.com/doyouhaobaby/iced-code-editor.git", tag = "v0.4.2", features = ["lsp-process"] }
iced_highlighter = "0.14"
image = "0.25.9"
include_dir = "0.7"
libc = "0.2"
once_cell = "1"
parking_lot = "0.12"
pinyin = "0.11"
regex = "1"
rand = "0.10.3"
resvg = "0.46.0"
rfd = "0.17"
rusqlite = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
similar = "2"
strsim = "0.11"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tiny-skia = "0.11.4"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "fmt", "ansi"] }
unicode-width = "0.2"
urlencoding = "2.1"
walkdir = "2"
web-time = "1.1.0"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
vw-provider-resolver = { path = "../vw-provider-resolver", version = "0.5.3" }
vw-config-types = { path = "../vw-config-types", version = "0.5.3" }
vw-gateway-client = { path = "../vw-gateway-client", version = "0.5.3" }
vw-shared = { path = "../vw-shared", version = "0.5.3" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.4"
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
iced_term = { git = "https://github.com/Harzu/iced_term", branch = "master" }
open = "5"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream", "socks", "blocking", "json", "rustls"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
reqwest = { version = "0.13", features = ["json"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "ClipboardEvent",
    "CompositionEvent",
    "DataTransfer",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "Storage",
    "Window",
] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false }

[features]
default = []

[build-dependencies]
serde_json = "1"

[dev-dependencies]
iced_runtime = "0.14"
