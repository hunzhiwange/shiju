<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>识矩</title>
    <base data-trunk-public-url />
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-bin="shi-ju" />
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #shiju-viewport {
            position: absolute;
            left: var(--viewport-left, 0px);
            top: var(--viewport-top, 0px);
            width: var(--viewport-width, 100%);
            height: 100%;
            height: var(--viewport-height, 100dvh);
            box-sizing: border-box;
            padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                     env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        }
        /* iced_winit replaces the mount node with its canvas. Keep the safe-area
           box outside that node; winit observes the canvas content size and owns DPR. */
        #vibe-window-app-container, #shiju-viewport > canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="shiju-viewport"><div id="vibe-window-app-container"></div></div>
    <script>
        (() => {
            const root = document.documentElement;
            const viewport = window.visualViewport;
            let frame = 0;
            let listening = false;
            const update = () => {
                frame = 0;
                // Pinch zoom remains browser-owned; do not reflow the app while zooming.
                if (viewport && Math.abs(viewport.scale - 1) > 0.01) return;
                const width = viewport ? viewport.width : window.innerWidth;
                const height = viewport ? viewport.height : window.innerHeight;
                if (width <= 0 || height <= 0) return;
                root.style.setProperty('--viewport-width', `${width}px`);
                root.style.setProperty('--viewport-height', `${height}px`);
                root.style.setProperty('--viewport-left', `${viewport ? viewport.pageLeft : window.scrollX}px`);
                root.style.setProperty('--viewport-top', `${viewport ? viewport.pageTop : window.scrollY}px`);
            };
            const schedule = () => {
                if (!frame) frame = requestAnimationFrame(update);
            };
            const start = () => {
                if (listening) return;
                listening = true;
                window.addEventListener('resize', schedule);
                viewport?.addEventListener('resize', schedule);
                viewport?.addEventListener('scroll', schedule);
                update();
            };
            const stop = () => {
                window.removeEventListener('resize', schedule);
                viewport?.removeEventListener('resize', schedule);
                viewport?.removeEventListener('scroll', schedule);
                cancelAnimationFrame(frame);
                frame = 0;
                listening = false;
            };
            // Restore listeners when a page returns from the back/forward cache.
            window.addEventListener('pagehide', stop);
            window.addEventListener('pageshow', start);
            start();
        })();
    </script>
</body>
</html>
