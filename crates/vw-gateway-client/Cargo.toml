gateway-endpoint = { path = "../libs/gateway-endpoint", version = "0.6.0" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
vw-api-types = { path = "../vw-api-types", version = "0.6.0" }
vw-shared = { path = "../vw-shared", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "query", "stream", "rustls"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json", "query", "stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
