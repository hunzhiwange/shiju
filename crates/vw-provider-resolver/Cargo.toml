[package]
name = "vw-provider-resolver"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Provider and model resolver for VibeWindow"
license = "MIT"

[dependencies]
provider-config-reader = { path = "../libs/provider-config-reader", version = "0.6.0" }
provider-model-cache = { path = "../libs/provider-model-cache", version = "0.6.0" }
provider-model-catalog = { path = "../libs/provider-model-catalog", version = "0.6.0" }
provider-request-identity = { path = "../libs/provider-request-identity", version = "0.6.0" }
provider-state-cache = { path = "../libs/provider-state-cache", version = "0.6.0" }
provider-runtime-paths = { path = "../libs/provider-runtime-paths", version = "0.6.0" }
provider-protocol-routes = { path = "../libs/provider-protocol-routes", version = "0.6.0" }
provider-errors = { path = "../libs/provider-errors", version = "0.6.0" }
anyhow = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
strsim = "0.11"
vw-shared = { path = "../vw-shared", version = "0.6.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
config-runtime-paths = { path = "../libs/config-runtime-paths", version = "0.6.0" }
