[package]
name = "vw-provider-resolver"
version.workspace = true
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Provider and model resolver for VibeWindow"
license = "MIT"

[dependencies]
model-protocols = { path = "../libs/model-protocols" }
provider-resolution = { path = "../libs/provider-resolution" }
provider-auth-reader = { path = "../libs/provider-auth-reader" }
provider-config-reader = { path = "../libs/provider-config-reader" }
provider-model-cache = { path = "../libs/provider-model-cache" }
provider-request-identity = { path = "../libs/provider-request-identity" }
provider-state-cache = { path = "../libs/provider-state-cache" }
provider-runtime-paths = { path = "../libs/provider-runtime-paths" }
provider-protocol-routes = { path = "../libs/provider-protocol-routes" }
provider-errors = { path = "../libs/provider-errors" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
provider-model-discovery = { path = "../libs/provider-model-discovery" }

[dev-dependencies]
provider-model-catalog = { path = "../libs/provider-model-catalog" }
serde_json = "1"
