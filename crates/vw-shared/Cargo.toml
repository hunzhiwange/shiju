[package]
name = "vw-shared"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Shared utilities for VibeWindow crates"
license = "MIT"

[dependencies]
shell-command = { path = "../libs/shell-command", version = "0.6.0" }
local-app-auth = { path = "../libs/local-app-auth", version = "0.6.0" }
runtime-log = { path = "../libs/runtime-log", version = "0.6.0" }
pasted-text-cache = { path = "../libs/pasted-text-cache", version = "0.6.0" }
task-file-store = { path = "../libs/task-file-store", version = "0.6.0" }
session-artifact-store = { path = "../libs/session-artifact-store", version = "0.6.0" }
task-types = { path = "../libs/task-types", version = "0.6.0" }
ordered-id = { path = "../libs/ordered-id", version = "0.6.0" }
session-text = { path = "../libs/session-text", version = "0.6.0" }
session-ui-types = { path = "../libs/session-ui-types", version = "0.6.0" }
session-info = { path = "../libs/session-info", version = "0.6.0" }
message-types = { path = "../libs/message-types", version = "0.6.0" }
auth-file-store = { path = "../libs/auth-file-store", version = "0.6.0" }
model-state = { path = "../libs/model-state", version = "0.6.0" }
model-types = { path = "../libs/model-types", version = "0.6.0" }
model-catalog-types = { path = "../libs/model-catalog-types", version = "0.6.0" }
model-reasoning = { path = "../libs/model-reasoning", version = "0.6.0" }
model-protocols = { path = "../libs/model-protocols", version = "0.6.0" }
session-paths = { path = "../libs/session-paths", version = "0.6.0" }
build-identity = { path = "../libs/build-identity", version = "0.6.0" }
runtime-time = { path = "../libs/runtime-time", version = "0.6.0" }
display-format = { path = "../libs/display-format", version = "0.6.0" }
json-extract = { path = "../libs/json-extract", version = "0.6.0" }
todo-types = { path = "../libs/todo-types", version = "0.6.0" }
project-types = { path = "../libs/project-types", version = "0.6.0" }
question-types = { path = "../libs/question-types", version = "0.6.0" }
permission-types = { path = "../libs/permission-types", version = "0.6.0" }
snapshot-types = { path = "../libs/snapshot-types", version = "0.6.0" }
anyhow = "1"
hex = "0.4"
libc = "0.2"
once_cell = "1"
parking_lot = "0.12"
patch = { path = "../libs/patch", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
time = "0.3"
tracing = "0.1"

[features]
shell-tokio = ["shell-command/shell-tokio"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", features = ["json"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
rusqlite = "0.37.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
