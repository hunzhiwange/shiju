[package]
name = "vw-shared"
version.workspace = true
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Shared utilities for VibeWindow crates"
license = "MIT"

[dependencies]
app-self-update = { path = "../libs/app-self-update" }
desktop-release = { path = "../libs/desktop-release" }
shell-command = { path = "../libs/shell-command" }
local-app-auth = { path = "../libs/local-app-auth" }
runtime-log = { path = "../libs/runtime-log" }
pasted-text-cache = { path = "../libs/pasted-text-cache" }
task-file-store = { path = "../libs/task-file-store" }
session-artifact-store = { path = "../libs/session-artifact-store" }
task-types = { path = "../libs/task-types" }
ordered-id = { path = "../libs/ordered-id" }
session-text = { path = "../libs/session-text" }
session-ui-types = { path = "../libs/session-ui-types" }
session-info = { path = "../libs/session-info" }
message-types = { path = "../libs/message-types" }
auth-file-store = { path = "../libs/auth-file-store" }
auth-types = { path = "../libs/auth-types" }
model-state = { path = "../libs/model-state" }
model-types = { path = "../libs/model-types" }
model-catalog-types = { path = "../libs/model-catalog-types" }
model-reasoning = { path = "../libs/model-reasoning" }
model-protocols = { path = "../libs/model-protocols" }
session-paths = { path = "../libs/session-paths" }
build-identity = { path = "../libs/build-identity" }
runtime-time = { path = "../libs/runtime-time" }
display-format = { path = "../libs/display-format" }
json-extract = { path = "../libs/json-extract" }
todo-types = { path = "../libs/todo-types" }
project-types = { path = "../libs/project-types" }
question-types = { path = "../libs/question-types" }
permission-types = { path = "../libs/permission-types" }
snapshot-types = { path = "../libs/snapshot-types" }
patch = { path = "../libs/patch" }

[features]
shell-tokio = ["shell-command/shell-tokio"]

[dev-dependencies]
tempfile = "3"
