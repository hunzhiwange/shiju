# VibeWindow adaptation: isolate the copied Codex sources behind a minimal v3 shell.

[package]
name = "vw-tui"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
autobins = false
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "vw_tui"
path = "src/lib.rs"
doctest = false

[dependencies]
arboard = "3.4"
base64 = "0.22"
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
dirs = "6"
libc = "0.2"
pulldown-cmark = "0.10.3"
ratatui = { version = "0.30.2", features = [
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
regex-lite = "0.1.8"
serde_json = { version = "1", features = ["preserve_order"] }
supports-color = "3.0.2"
syntect = "5"
textwrap = "0.16.2"
tracing = "0.1"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
url = "2"
urlencoding = "2.1.3"

[dev-dependencies]
insta = "1.46.3"
itertools = "0.14.0"
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
tokio = { version = "1", features = ["macros", "rt"] }
vt100 = "0.16.2"
