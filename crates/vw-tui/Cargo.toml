# 上层 TUI 交互装配；底层能力由 crates/libs/tui-* 提供。

[package]
name = "vw-tui"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
autobins = false
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "vw_tui"
path = "src/lib.rs"
doctest = false

[dependencies]
tui-surface = { path = "../libs/tui-surface" }
tui-chat = { path = "../libs/tui-chat" }
tui-terminal-lifecycle = { path = "../libs/tui-terminal-lifecycle" }
tui-pager = { path = "../libs/tui-pager" }
tui-onboarding = { path = "../libs/tui-onboarding" }
tui-widgets = { path = "../libs/tui-widgets" }
tui-cells = { path = "../libs/tui-cells" }
tui-terminal = { path = "../libs/tui-terminal" }
tui-contracts = { path = "../libs/tui-contracts" }

[dev-dependencies]
tui-render = { path = "../libs/tui-render" }
insta = "1.46.3"
tui-markdown = { path = "../libs/tui-markdown" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
ratatui = { version = "0.30.2", features = ["unstable-backend-writer", "unstable-rendered-line-info", "unstable-widget-ref"] }
pretty_assertions = "1.4.1"
vt100 = "0.16.2"
