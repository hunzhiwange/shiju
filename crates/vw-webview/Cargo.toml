[package]
name = "vw-webview"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Cross-platform WebView window for VibeWindow"
license = "MIT"
default-run = "vw-webview"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[[bin]]
name = "vw-webview"
path = "src/main.rs"

[dependencies]
directories = "5"
getrandom = "0.4"
mime_guess = "2.0.5"
open = "5"
serde_json = "1"
url = "2"
vw-api-types = { path = "../vw-api-types", version = "0.6.0" }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
tao = { version = "0.34" }
wry = { version = "=0.56.1" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception", "disable-encoding-assertions"] }
objc2-app-kit = { version = "0.3.0", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSAlert",
    "NSButton",
    "NSApplication",
    "NSControl",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
    "std",
    "NSString",
    "NSObject",
    "NSNotification",
    "NSURL",
    "NSURLResponse",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKUIDelegate",
    "WKUserContentController",
    "WKWebView",
    "WKWebViewConfiguration",
] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.17"
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["desktop-webview"]
desktop-webview = []
