[package]
name = "vw-webview"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Cross-platform WebView window for VibeWindow"
license = "MIT"
default-run = "vw-webview"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[[bin]]
name = "vw-webview"
path = "src/main.rs"

[dependencies]
webview-browser-views = { path = "../libs/webview-browser-views", version = "0.6.0" }
webview-mcp-runtime = { path = "../libs/webview-mcp-runtime", version = "0.6.0" }
webview-popup = { path = "../libs/webview-popup", version = "0.6.0" }
webview-media-permissions = { path = "../libs/webview-media-permissions", version = "0.6.0" }
webview-downloads = { path = "../libs/webview-downloads", version = "0.6.0" }
webview-native-menu = { path = "../libs/webview-native-menu", version = "0.6.0" }
webview-external-protocol = { path = "../libs/webview-external-protocol", version = "0.6.0" }
webview-runtime-cookie = { path = "../libs/webview-runtime-cookie", version = "0.6.0" }
webview-init-script = { path = "../libs/webview-init-script", version = "0.6.0" }
webview-toolbar = { path = "../libs/webview-toolbar", version = "0.6.0" }
webview-local-content = { path = "../libs/webview-local-content", version = "0.6.0" }
webview-ipc = { path = "../libs/webview-ipc", version = "0.6.0" }
webview-launch = { path = "../libs/webview-launch", version = "0.6.0" }
webview-core = { path = "../libs/webview-core", version = "0.6.0" }
webview-storage = { path = "../libs/webview-storage", version = "0.6.0" }
mime_guess = "2.0.5"
open = "5"
serde_json = "1"
url = "2"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
tao = { version = "0.34" }
wry = { version = "=0.56.1" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"

[features]
default = ["desktop-webview"]
desktop-webview = []
