[package]
name = "vw-webview"
version.workspace = true
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Cross-platform WebView window for VibeWindow"
license = "MIT"
default-run = "vw-webview"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[[bin]]
name = "vw-webview"
path = "src/main.rs"

[dependencies]
webview-browser-runtime = { path = "../libs/webview-browser-runtime" }
webview-mcp-runtime = { path = "../libs/webview-mcp-runtime" }

[features]
default = ["desktop-webview"]
desktop-webview = []
