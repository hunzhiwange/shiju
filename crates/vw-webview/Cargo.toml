[package]
name = "vw-webview"
version = "0.5.7"
edition = "2024"
repository = "https://github.com/hunzhiwange/shiju"
homepage = "https://github.com/hunzhiwange/shiju"
description = "Cross-platform WebView window for VibeWindow"
license = "MIT"
default-run = "vw-webview"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[[bin]]
name = "vw-webview"
path = "src/main.rs"

[dependencies]
directories = "5"
mime_guess = "2.0.5"
open = "5"
serde_json = "1"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "musl")))'.dependencies]
tao = { version = "0.34" }
wry = { version = "0.54" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception", "disable-encoding-assertions"] }
objc2-app-kit = { version = "0.3.0", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSControl",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
    "std",
    "NSString",
    "NSObject",
] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.17"

[features]
default = ["desktop-webview"]
desktop-webview = []
