<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeScript Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #1e1e1e; color: #d4d4d4; }
    header { padding: 12px 20px; background: #252526; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; font-weight: 500; }
    .toolbar { display: flex; gap: 8px; margin-left: auto; }
    .toolbar button { padding: 6px 12px; background: #0e639c; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 13px; }
    .toolbar button:hover { background: #1177bb; }
    .toolbar button.secondary { background: #3c3c3c; }
    .toolbar button.secondary:hover { background: #505050; }
    #editor-container { flex: 1; }
    .status-bar { padding: 4px 20px; background: #007acc; color: white; font-size: 12px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <h1>TypeScript Editor</h1>
    <div class="toolbar">
      <button class="secondary" id="btn-format">格式化</button>
      <button class="secondary" id="btn-clear">清空</button>
      <button id="btn-run">运行</button>
    </div>
  </header>
  <div id="editor-container"></div>
  <div class="status-bar">
    <span id="status-left">TypeScript</span>
    <span id="status-right">Ln 1, Col 1</span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
