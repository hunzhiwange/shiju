<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple TS Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="editor-container">
    <header class="toolbar">
      <div class="toolbar-left">
        <button id="btn-new" title="新建 (Ctrl+N)">📄 New</button>
        <button id="btn-save" title="保存 (Ctrl+S)">💾 Save</button>
        <button id="btn-open" title="打开 (Ctrl+O)">📂 Open</button>
        <span class="separator"></span>
        <button id="btn-undo" title="撤销 (Ctrl+Z)">↶ Undo</button>
        <button id="btn-redo" title="重做 (Ctrl+Y)">↷ Redo</button>
        <span class="separator"></span>
        <label for="font-size">Font:</label>
        <select id="font-size">
          <option value="12">12px</option>
          <option value="14" selected>14px</option>
          <option value="16">16px</option>
          <option value="18">18px</option>
          <option value="20">20px</option>
        </select>
      </div>
      <div class="toolbar-right">
        <span id="file-name">untitled.txt</span>
      </div>
    </header>

    <main class="editor-main">
      <div class="line-numbers" id="line-numbers"></div>
      <textarea
        id="editor"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        placeholder="Start typing..."
      ></textarea>
    </main>

    <footer class="status-bar">
      <div class="status-left">
        <span id="cursor-pos">Ln 1, Col 1</span>
        <span class="separator">|</span>
        <span id="char-count">0 chars</span>
        <span class="separator">|</span>
        <span id="line-count">1 line</span>
      </div>
      <div class="status-right">
        <span>UTF-8</span>
        <span class="separator">|</span>
        <span>TypeScript</span>
      </div>
    </footer>
  </div>

  <input type="file" id="file-input" accept=".txt,.ts,.js,.json,.md,.html,.css" style="display: none;">
  <script src="editor.js"></script>
</body>
</html>
