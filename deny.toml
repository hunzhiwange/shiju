# cargo-deny configuration — v2 schema
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# In v2, vulnerability advisories always emit errors (not configurable).
# unmaintained: scope of unmaintained-crate checks (all | workspace | transitive | none)
unmaintained = "all"
# yanked: deny | warn | allow
yanked = "deny"
# Ignore known unmaintained transitive deps we cannot easily replace
ignore = [
    { id = "RUSTSEC-2026-0189", reason = "rmcp is used for HTTP clients and a stdio server; the vulnerable Streamable HTTP server transport is not enabled." },
    { id = "RUSTSEC-2026-0462", reason = "The affected built-in Streamable HTTP clients are disabled. mcp-client uses a custom transport that bounds JSON responses to 16 MiB and discards error bodies." },
    { id = "RUSTSEC-2026-0192", reason = "Transitive font parsing via iced/resvg and pdf-extract; no maintained compatible replacement is available upstream." },
    { id = "RUSTSEC-2026-0194", reason = "Transitive via the Linux-only wayland-scanner build-time proc macro; it does not parse runtime or untrusted XML." },
    { id = "RUSTSEC-2026-0195", reason = "Transitive via the Linux-only wayland-scanner build-time proc macro; it does not parse runtime or untrusted XML." },
    { id = "RUSTSEC-2026-0206", reason = "Transitive font shaping via iced/resvg; no maintained compatible replacement is available upstream." },
    { id = "RUSTSEC-2025-0141", reason = "Transitive via probe-rs in current release path; tracked for replacement when probe-rs updates." },
    { id = "RUSTSEC-2024-0320", reason = "Transitive via syntect in the desktop syntax highlighting path; no safe upstream upgrade is available." },
    { id = "RUSTSEC-2024-0370", reason = "Transitive via gtk3-rs macro chain under wry/tao Linux webview support; no safe upstream upgrade is available." },
    { id = "RUSTSEC-2024-0436", reason = "Transitive via wgpu/rav1e/rmcp in current release path; no safe upstream upgrade is available." },
]

[licenses]
# All licenses are denied unless explicitly allowed
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
unused-allowed-license = "allow"
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "html2md" },
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
    { allow = ["Unlicense"], crate = "ksni@=0.3.7" },
]

# Normalize deprecated SPDX strings against the license files shipped with the crates.
[[licenses.clarify]]
crate = "html2md@=0.2.15"
expression = "GPL-3.0-or-later"
license-files = [{ path = "LICENSE", hash = 0x3e21c131 }]

[[licenses.clarify]]
crate = "unescaper@=0.1.8"
expression = "MIT OR GPL-3.0-only"
license-files = [
    { path = "LICENSE-MIT", hash = 0xeb164a42 },
    { path = "LICENSE-GPL3", hash = 0xe497def1 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
