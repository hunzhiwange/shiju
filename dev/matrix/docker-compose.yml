services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse-local-password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 20

  synapse:
    image: matrixdotorg/synapse:v1.110.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    ports:
      - "8008:8008"
    volumes:
      - ./synapse:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions', timeout=3)\nPY",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  element:
    image: vectorim/element-web:v1.11.102
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - ./element/config.json:/app/config.json:ro

volumes:
  postgres-data:
