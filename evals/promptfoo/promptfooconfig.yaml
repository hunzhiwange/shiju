# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: VibeWindow Agent 评测

prompts:
  - '{{task}}'

providers:
  - id: file://./vibewindow-provider.mjs
    label: 默认模型基线 · DeepSeek V4 Flash 0731
    config:
      agent: main
      directory: .
      model: token-plan/deepseek-v4-flash-0731
      timeoutMs: 900000

defaultTest:
  options:
    disableVarExpansion: true
  assert:
    - type: javascript
      value: file://./assertions.mjs:evaluate

tests:
  - file://./tests/*.yaml

commandLineOptions:
  maxConcurrency: 1
  repeat: 1
  cache: false

sharing: false
