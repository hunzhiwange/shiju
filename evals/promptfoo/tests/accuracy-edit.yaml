- description: edit-01 · 精确文件编辑
  metadata:
    suite: runtime-accuracy
    batch: 14
    category: edit
    split: dev
    taskId: edit-01
  vars:
    evaluationProfile: runtime-accuracy
    taskId: edit-01
    maxIterations: 24
    maxToolCalls: 32
    timeoutMs: 900000
    fixtureFiles: ["settings.ini", "notes.txt"]
    task: >-
      只将 settings.ini 中 [server] 段的 port 值 4100 替换为 6287，保持所有其他字节不变。
      公开输入仅为上述 fixtureFiles：settings.ini、notes.txt。只允许修改指定目标文件；禁止创建、删除或修改其他文件、创建目录、访问网络或扩大权限。无需自写测试，完成后简短说明。
      预算：最多 24 次迭代、32 次工具调用、900000 毫秒。

