- description: facts-01 · 指定版本端口
  metadata:
    suite: runtime-accuracy
    batch: 13
    category: facts
    split: dev
    taskId: facts-01
  vars:
    evaluationProfile: runtime-accuracy
    taskId: facts-01
    maxIterations: 24
    maxToolCalls: 32
    timeoutMs: 900000
    fixtureFiles: ["release-old.json", "release-current.json"]
    task: >-
      读取 release-old.json 与 release-current.json，返回 version 为 2.1 的 port。返回字段 port（整数）。 公开输入仅为 release-old.json、release-current.json。只读任务，禁止创建、修改或删除任何文件，禁止网络访问。
      最终回答必须只有一个 JSON 对象，字段必须完全匹配要求，不加解释或 Markdown。
      预算：最多 24 次迭代、32 次工具调用、900000 毫秒。

