- description: recovery-01 · 命令失败后恢复
  metadata:
    suite: runtime-accuracy
    batch: 15
    category: recovery
    split: dev
    taskId: recovery-01
  vars:
    evaluationProfile: runtime-accuracy
    taskId: recovery-01
    maxIterations: 24
    maxToolCalls: 32
    timeoutMs: 900000
    fixtureFiles: ["runner.mjs", "README.txt", "input.txt"]
    task: "先原样运行 node runner.mjs build，必须观察退出码 2。按诊断只修正 input.txt，然后原样重跑 node runner.mjs build 生成 result.txt。 公开输入仅为 fixtureFiles 列出的文件。只允许创建或修改 input.txt、result.txt；不得删除文件、修改 runner.mjs 或 README.txt、创建其他文件或目录、访问网络、下载依赖或扩大权限。使用已有 Node.js，本地执行即可；禁止跳过初次失败或直接伪造结果。预算：24 次迭代、32 次工具调用、900000 毫秒。完成后简短说明。"

