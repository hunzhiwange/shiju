    maxToolCalls: 32
    timeoutMs: 900000
    fixtureFiles: ["result.txt", "notes.txt"]
    task: "请将 result.txt 写成 color=blue，末尾一个 LF。下一轮可能修正需求；禁止写入其他文件。公开输入仅为 fixtureFiles 列出的文件。禁止创建、删除或修改其他文件、创建目录、访问网络或扩大权限；无需自写测试。两轮总预算：24 次迭代、32 次工具调用、900000 毫秒。"
    turns:
      - "修正上一轮需求：result.txt 最终只保留 color=green 和一个 LF，不得残留 color=blue；其他文件不变。公开输入仅为 fixtureFiles 列出的文件。禁止创建、删除或修改其他文件、创建目录、访问网络或扩大权限；无需自写测试。两轮总预算：24 次迭代、32 次工具调用、900000 毫秒。"
