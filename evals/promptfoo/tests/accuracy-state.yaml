    batch: 16
    category: state
    split: dev
    taskId: state-03
  vars:
    evaluationProfile: runtime-accuracy
    taskId: state-03
    maxIterations: 24
    maxToolCalls: 32
    timeoutMs: 900000
    fixtureFiles: ["locked.txt", "allowed.txt"]
    task: "本会话 locked.txt 禁止改动，只允许更新 allowed.txt。记住此限制，本轮不要修改文件。公开输入仅为 fixtureFiles 列出的文件。禁止创建、删除或修改其他文件、创建目录、访问网络或扩大权限；无需自写测试。两轮总预算：24 次迭代、32 次工具调用、900000 毫秒。"
    turns:
      - "将允许更新的文件中的 value=old 改为 value=new，保留 LF 行尾；遵守上一轮的禁止修改项。公开输入仅为 fixtureFiles 列出的文件。禁止创建、删除或修改其他文件、创建目录、访问网络或扩大权限；无需自写测试。两轮总预算：24 次迭代、32 次工具调用、900000 毫秒。"

- description: state-04 · 跨轮状态保持
