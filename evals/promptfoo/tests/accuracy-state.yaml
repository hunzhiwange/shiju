- description: state-01 · 跨轮状态保持
  metadata:
    suite: runtime-accuracy
    batch: 16
    category: state
    split: dev
    taskId: state-01
  vars:
    evaluationProfile: runtime-accuracy
    taskId: state-01
    maxIterations: 24
    maxToolCalls: 32
    timeoutMs: 900000
    fixtureFiles: ["east/settings.txt", "west/settings.txt"]
    task: "选定 east 为本会话目标目录。记住此选择，本轮不要修改任何文件。公开输入仅为 fixtureFiles 列出的文件。禁止创建、删除或修改其他文件、创建目录、访问网络或扩大权限；无需自写测试。两轮总预算：24 次迭代、32 次工具调用、900000 毫秒。"
    turns:
      - "将先前选定目录中的 settings.txt 改为 mode=ready，保留 LF 行尾；其他文件不变。公开输入仅为 fixtureFiles 列出的文件。禁止创建、删除或修改其他文件、创建目录、访问网络或扩大权限；无需自写测试。两轮总预算：24 次迭代、32 次工具调用、900000 毫秒。"

