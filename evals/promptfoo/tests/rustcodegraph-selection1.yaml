    operation: impact
    difficulty: hard
  vars:
    task: >-
      评估修改 runtime_capability_instructions 可能影响的代码范围。不要修改代码，
      列出关键的直接或间接受影响符号，并指出相关测试符号。
    expectedOperations:
      - impact
    expectedTerms:
