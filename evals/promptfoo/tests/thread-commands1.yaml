- description: thread-commands1 · 科幻小说与任务命令轨迹
  metadata:
    suite: thread-commands1
    batch: 5
    difficulty: hard
  vars:
    evaluationProfile: thread-commands
    maxIterations: 12
    maxToolCalls: 20
    task: '使用 create_thread 创建一个新的会话,内容为"写一篇50字的科幻小说."'
    turns:
      - >-
        这是工具轨迹评测，必须依次产生三个真实工具事件，不得仅用文字声称成功。
        先调用 list_threads 确认刚创建的可见任务位于当前项目；再用列表中与 create_thread
        返回值相同的原始 thread_id 调用 read_thread；最后对同一 ID 调用 wait_threads。
      - >-
        这是工具轨迹评测，必须依次产生四个真实工具事件，不得仅用文字声称成功。
        对 create_thread 返回的原始 thread_id：先调用 fork_thread，不要改用分叉 ID；
        再调用 set_thread_title 将标题改为“50字科幻小说”；再调用 set_thread_pinned，
        pinned 必须为 true；最后调用 send_message_to_thread 发送“请把结尾改得更有希望。”。
      - >-
        这是工具轨迹评测，必须连续产生两个真实工具事件，不得仅用文字声称成功。
        先调用 set_thread_archived 归档刚创建的原始任务，archived 必须为 true；
        再调用 handoff_thread 尝试交接它，预期运行时明确返回不支持。两次调用都必须
        使用 create_thread 返回的同一个原始 thread_id，不要改用其他命令。
